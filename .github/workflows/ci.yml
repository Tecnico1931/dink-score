name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  PLAYWRIGHT_VERSION: 1.65.1 # the Chromium cache key, so a new version downloads its own browser
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: API checks on in-memory Postgres
        run: npm i --no-save @electric-sql/pglite && node tools/api-check.mjs
      - name: Account (passkey) checks on in-memory Postgres
        run: node tools/account-check.mjs
      - name: Data rights checks (export, anonymise, delete club)
        run: node tools/rights-check.mjs
      - name: Push notification checks (mocked sender)
        run: node tools/push-check.mjs
      - name: DUPR checks (mock only)
        run: node tools/dupr-check.mjs
      - name: Watch app golden vectors are up to date
        run: node tools/pb-vectors.mjs --check
      - name: Generated files are up to date
        run: |
          node build.cjs
          git diff --exit-code || { echo "::error::Run 'node build.cjs' and commit the result."; exit 1; }
      - name: Install Playwright (pinned; Chromium is cached by version)
        run: npm i --no-save playwright-core@${{ env.PLAYWRIGHT_VERSION }}
      - uses: actions/cache@v4
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright-core install chromium
        if: steps.chromium.outputs.cache-hit != 'true'
      - name: Browser smoke test (Chromium via Playwright)
        # runs on public/, which the generated-files step above just built; the OS libraries are not part of the cache
        run: |
          npx playwright-core install-deps chromium
          node tools/smoke-check.mjs
      - name: sw.js VERSION bumped when shipped files change
        if: github.event_name == 'pull_request'
        run: node tools/check-version.mjs origin/${{ github.base_ref }}
