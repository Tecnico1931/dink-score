  const myTheme = club && myName() ? equippedFor(myName()).theme : null;
  root.innerHTML = `<div class="court"${myTheme ? ` data-theme="${esc(myTheme)}"` : ''}>
    <div class="court-top">
      <button class="icon-btn" data-act="end" aria-label="Leave game">${ICON.back}</button>
      <div class="match"><b id="court-clock">${clock(Date.now() - s.startedAt)}</b><span>${live.event ? esc(live.event.name) + ': ' : ''}${cfg.mode === 'doubles' ? 'Doubles' : 'Singles'}, ${cfg.scoring === 'rally' ? 'rally scoring' : 'side-out'} to ${cfg.target}, rally ${s.rallies + 1}</span></div>
      <div class="cright"><button class="icon-btn" data-act="club-share" aria-label="Share this game: join code and QR">${ICON.share}</button><button class="icon-btn" data-act="log-open" aria-label="Log a result from another court">${ICON.plus}</button><button class="icon-btn" data-act="undo" aria-label="Undo last rally" ${live.stack.length ? '' : 'disabled'}>${ICON.undo}</button></div>
    </div>
    ${half(0)}
    <div class="net" aria-live="polite">
      <div class="call" aria-label="Score call ${callParts.join(' ')}">${callParts.map((n, i) => `<div><b>${n}</b><small>${callLabels[i]}</small></div>`).join('')}</div>
      ${fresh ? '<div class="first-hint">Tap the side that wins each rally</div>' : `<div class="who"><b>${esc(serverName)}</b> serves from the ${side}</div>`}
    </div>
    ${half(1)}
  </div>${live.toast ? `<div class="toast" role="status">${esc(live.toast)}</div>` : ''}${sheet}`;
  bumpTeam = null;
  if (lastTap) {
    const el = root.querySelector(`.half[data-rally="${lastTap.t}"]`);
    if (el) { const r = document.createElement('span'); r.className = 'ripple'; r.style.left = lastTap.x + 'px'; r.style.top = lastTap.y + 'px'; el.appendChild(r); }
    lastTap = null;
  }
}

let askedWhoami = false;
// Dinks each named player gets from this game once it's saved (the same rules the server uses).
function dinksPreview(s) {
  if (!club || !shopInfo()) return '';
  const base = Object.assign(record(s), { id: '__pending' });
  const rec = Object.assign(base, senderGuess(base));
  const after = DK.compute([...allGames(), rec]);
  const named = [0, 1].flatMap(t => s.cfg.teams[t].map(n => ({ n, t }))).filter(x => !isDefaultName(x.n));
  if (!named.length) return '';
  const got = named.map(x => ({ ...x, d: ((after.get(x.n.trim().toLowerCase()) || { games: {} }).games.__pending) || 0 }));
  if (!live.celebrated && s.winner !== null) {
    live.celebrated = true;
    const fx = s.cfg.teams[s.winner].map(n => equippedFor(n).celebrate).find(Boolean);
    if (fx) setTimeout(() => celebrate(fx), 250);
    const snd = s.cfg.teams[s.winner].map(n => equippedFor(n).sound).find(Boolean);
    if (snd) playSound(snd);
  }
  return `<div class="dinks-row"><span class="lab">Dinks earned</span><div class="chips">${got.map(x => `<span class="dk-chip" style="--c:${TEAM_COLOR[x.t]}">${esc(x.n)} <b>+${x.d}</b></span>`).join('')}</div></div>`;
}
function ratingPreview(s) {
  const rec = Object.assign(record(s), { id: '__pending' });
  const { changes } = DR.compute([...allGames(), rec]);
  const c = changes.__pending;
  if (!c) return '';
  const named = c.list.filter(x => !isDefaultName(x.name));
  if (!named.length) return `<p class="expect">Add player names next time to track Dink Ratings.</p>`;
  const fav = c.expected >= 0.5 ? 0 : 1;
  const pf = fav === 0 ? c.expected : 1 - c.expected;
  const target = s.cfg.target;
  const exp = Math.min(target - 1, Math.round(target * (1 - pf) / pf));
  const expText = Math.abs(c.expected - 0.5) < 0.02 ? 'The forecast called it even.' : `The forecast had ${esc(teamLabel(s.cfg.teams[fav]))} winning ${target}–${exp}.`;
  return `<div style="display:flex;flex-direction:column;gap:8px"><p class="expect">${expText} Rating changes once saved:</p>
    <div class="changes">${named.map(x => `<div class="ch" style="--c:${TEAM_COLOR[x.team]}"><span class="tick"></span><span class="nm">${esc(x.name)}</span><span class="rt">${r2(x.after)}</span>${deltaHTML(x.after - x.before)}</div>`).join('')}</div></div>`;
}

/* ---------- watch scoring (prototype) ----------
   While a club game is scored on this phone, the phone publishes the live state to /api/live. An
   Apple Watch running Shortcuts (setup steps are on the club sheet's watch page) appends point and
   undo intents there; this phone polls for them and applies them with PB.rally, so the scoring
   rules live in exactly one place and a watch tap changes nothing until this phone takes it.
   Event matches are not watch-scored: they already report to the event. */
let watchAck = 0, publishedLiveId = null, publishedSecret = null, publishTimer = null;
const liveGameId = () => 'live-' + live.state.startedAt.toString(36);
// Each live game has its own short-lived secret, made here and shown on the watch page. A watch must name the game and carry it,
// and this phone drops any intent whose signature does not match, so a tap meant for one court can never score another.
function liveSecret() {
  if (!live.secret) { const b = crypto.getRandomValues(new Uint8Array(10)); live.secret = Array.from(b, x => 'abcdefghjkmnpqrstuvwxyz23456789'[x % 31]).join(''); }
  return live.secret;
}
async function intentOk(it, game, secret) {
  if (!it || it.g !== game || typeof it.sig !== 'string') return false;
  try {
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`${secret}:${it.n}:${it.kind}:${it.side}:${game}`));
    return Array.from(new Uint8Array(h), x => x.toString(16).padStart(2, '0')).join('') === it.sig;
  } catch { return false; }
}
function schedulePublishLive() {
  if (!API_OK || !club) return;
  clearTimeout(publishTimer);
  publishTimer = setTimeout(publishLive, 250);
}
async function publishLive() {
  if (!API_OK || !club) return;
  try {
    if (live && !live.event) {
      publishedLiveId = liveGameId(); publishedSecret = liveSecret();
      await api('live', { method: 'POST', body: JSON.stringify({ code: club.code, action: 'state', id: publishedLiveId, secret: publishedSecret, state: live.state, ack: watchAck }) });
    } else if (publishedLiveId) {
      const id = publishedLiveId, secret = publishedSecret; publishedLiveId = null; publishedSecret = null; watchAck = 0;
      await api('live', { method: 'POST', body: JSON.stringify({ code: club.code, action: 'end', id, secret }) });
    }
  } catch {}
}
function applyWatchIntent(it) {
  if (!live || live.event) return;
  if (it.kind === 'point' && live.state.winner === null && !live.confirmEnd && !logForm) {
    buzz();
    live.stack.push(live.state);
    live.state = PB.rally(live.state, it.side === 1 ? 1 : 0);
    persistLive(); renderCourt();
  } else if (it.kind === 'undo' && live.stack.length) {
    live.state = live.stack.pop(); live.toast = null;
    persistLive(); renderCourt();
  }
}
setInterval(async () => {
  if (!API_OK || !club || !live || live.event || !live.open || document.hidden) return;
  try {
    const game = liveGameId(), secret = liveSecret();
    const d = await api('live?code=' + club.code + '&id=' + encodeURIComponent(game) + '&secret=' + encodeURIComponent(secret));
    const fresh = (d.intents || []).filter(i => i.n > watchAck).sort((a, b) => a.n - b.n);
    for (const it of fresh) { if (await intentOk(it, game, secret)) applyWatchIntent(it); watchAck = Math.max(watchAck, it.n); } // unsigned or foreign intents are skipped, never applied
    if (fresh.length) schedulePublishLive();
  } catch {}
}, 4000);

function persistLive() { store.set('pb.live', live ? { state: live.state, stack: live.stack.slice(-200), open: live.open, event: live.event || null, secret: live.secret || null } : null); schedulePublishLive(); }
let toastTimer;
function showToast(msg, inCourt = true) {
  if (inCourt && live) { live.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { if (live) { live.toast = null; renderCourt(); } }, 3500); return; }
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3000);
}
function startGame(cfgOverride) {
  const cfg = cfgOverride || { mode: setup.mode, scoring: setup.scoring, target: +setup.target, winBy: +setup.winBy, first: setup.first, teams: [teamPlayers(0), teamPlayers(1)] };
  live = { state: PB.newGame(cfg), stack: [], open: true };
  persistLive(); keepAwake(true); render();
}
function record(s) {
  return { id: newId(s.startedAt), startedAt: s.startedAt, endedAt: s.endedAt, mode: s.cfg.mode, scoring: s.cfg.scoring, target: s.cfg.target, winBy: s.cfg.winBy, teams: s.cfg.teams, score: s.score, winner: s.winner, rallies: s.rallies };
}

/* ---------- log a result from another court ---------- */
function localDateTimeValue(t) {
  const d = new Date(t); const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
// With no club, games and logged results stay on this device (pb.games) until saved to a club.
// saveAfterJoin: game ids to upload once a club is joined ("Save to a club" after a game).
let saveAfterJoin = null;
function beginGame() {
  addToRoster([...teamPlayers(0), ...teamPlayers(1)]);
  startGame();
}
function openLog() {
  logForm = { mode: setup.mode, target: +setup.target, names: [['', ''], ['', '']], score: ['', ''], when: localDateTimeValue(Date.now()), error: '' };
  renderLog();
}
function renderLog() {
  const root = $('#sheet2');
  if (!logForm) { root.innerHTML = ''; if (!(live && live.open)) lockBody(false); return; }
  lockBody(true);
  const f = logForm;
  const n = f.mode === 'doubles' ? 2 : 1;
  const team = t => `<div class="log-team" style="--c:${TEAM_COLOR[t]}"><div class="names">
      ${Array.from({ length: n }, (_, i) => `<input type="text" id="log-${t}-${i}" data-log-name="${t}-${i}" list="roster-list-log" placeholder="${TEAM_NAME[t]} player ${i + 1}" value="${esc(f.names[t][i])}" autocomplete="off" aria-label="${TEAM_NAME[t]} team, player ${i + 1}">`).join('')}</div>
      <div class="stepper"><input type="number" inputmode="numeric" min="0" max="99" id="log-score-${t}" data-log-score="${t}" value="${esc(f.score[t])}" placeholder="0" aria-label="${TEAM_NAME[t]} team score">
        <div class="sb"><button type="button" data-step="${t}" data-d="-1" aria-label="Lower ${TEAM_NAME[t]} score">−</button><button type="button" data-step="${t}" data-d="1" aria-label="Raise ${TEAM_NAME[t]} score">+</button></div></div></div>`;
  root.innerHTML = `<div class="sheet-bg top"><form class="sheet" data-form="log" role="dialog" aria-modal="true" aria-labelledby="log-h" novalidate><span class="grip"></span>
    <div class="sheet-head"><h2 id="log-h">${f.editId ? 'Edit result' : 'Log a result'}</h2><span style="display:flex;gap:8px;align-items:center">${f.editId ? `<button type="button" class="btn btn-ball share-pill" data-share="${esc(f.editId)}">${ICON.share}Share</button>` : ''}<button type="button" class="x" data-act="log-close" aria-label="Close">✕</button></span></div>
    <p>${f.editId ? `Fix the score, players, format or date. Ratings are recalculated from the corrected game.${club && club.hasPin && !hasOrganizer() ? ' Saving needs the organizer PIN.' : ''}` : `Add a finished game from another court. It counts toward the record and Dink Ratings${live && live.open ? ', and your live game keeps its score' : ''}.`}</p>
    <div class="seg-row" style="margin:0"><div class="field" style="margin:0"><span class="lab">Format</span>${seg('data-log-mode', [['doubles', 'Doubles'], ['singles', 'Singles']], f.mode, 'sm')}</div>
      <div class="field" style="margin:0"><span class="lab">Played to</span>${seg('data-log-target', [[11, '11'], [15, '15'], [21, '21']], f.target, 'sm')}</div></div>
    <div class="log-teams">${team(0)}${team(1)}</div>
    ${roster.length ? `<div class="field" style="margin:0"><span class="lab">Saved players</span><div class="chips">${chipsHTML(f.names, f.mode, 'log')}</div></div>` : ''}
    <datalist id="roster-list-log">${roster.map(x => `<option value="${esc(x)}"></option>`).join('')}</datalist>
    <div class="field" style="margin:0"><label class="lab" for="log-when">Finished at</label><div class="when"><input type="datetime-local" id="log-when" data-log-when value="${esc(f.when)}"></div></div>
    ${f.error ? `<p class="err" role="alert">${esc(f.error)}</p>` : ''}
    <button type="submit" class="btn btn-blue block">${f.editId ? 'Save changes' : 'Save result'}</button></form></div>`;
}
// Opens the log form filled in with a saved game, so its score, players, format or date can be corrected.
function openEdit(id) {
  const g = allGames().find(x => x.id === id);
  if (!g) return;
  const names = g.teams.map(t => [t[0] || '', t[1] || '']);
  logForm = { editId: id, original: g, mode: g.mode === 'singles' ? 'singles' : 'doubles', target: [11, 15, 21].includes(+g.target) ? +g.target : 11,
    names, score: [String(g.score[0]), String(g.score[1])], when: localDateTimeValue(g.endedAt), error: '' };
  renderLog();
}
function submitLog() {
  const f = logForm;
  const n = f.mode === 'doubles' ? 2 : 1;
  const teams = [0, 1].map(t => Array.from({ length: n }, (_, i) => (f.names[t][i] || '').trim()));
  const score = f.score.map(v => parseInt(v, 10));
  const err = msg => { f.error = msg; renderLog(); };
  if (teams.flat().some(x => !x)) return err(`Add a name for all ${n * 2} players.`);
  const flat = teams.flat().map(x => x.toLowerCase());
  if (new Set(flat).size !== flat.length) return err('Each player can only appear once.');
  if (score.some(v => !Number.isFinite(v) || v < 0 || v > 99)) return err('Enter both scores, from 0 to 99.');
  if (score[0] === score[1]) return err("Scores can't be tied. Pickleball games need a winner.");
  const endedAt = f.when ? new Date(f.when).getTime() : Date.now();
  if (!Number.isFinite(endedAt)) return err('Pick when the game finished.');
  const winner = score[0] > score[1] ? 0 : 1;
  if (f.editId) {
    // Keep how long the game took: if the finish time moved, move the start with it.
    const o = f.original;
    const updated = Object.assign({}, o, { mode: f.mode, target: f.target, teams, score, winner, endedAt, startedAt: endedAt - Math.max(0, o.endedAt - o.startedAt), editedAt: Date.now() });
    logForm = null;
    editGame(updated);
    return;
  }
  saveGame({ id: newId(endedAt), startedAt: endedAt, endedAt, mode: f.mode, scoring: 'sideout', target: f.target, winBy: 2, teams, score, winner, rallies: 0, logged: true });
  logForm = null;
  render();
  showToast(`Saved: ${teamLabel(teams[winner])} won ${score[winner]}–${score[1 - winner]}`, false);
}
// Saves a corrected game. Clubs go through the organizer PIN like deleting; games on this device just update.
function editGame(g) {
  if (club) { withPin({ type: 'edit', id: g.id, game: g }); return; }
  localGames = localGames.map(x => x.id === g.id ? g : x);
  store.set('pb.games', localGames);
  if (cloudGames) cloudGames = cloudGames.map(x => x.id === g.id ? g : x);
  if (gamesCol) { const { id, ...rest } = g; gamesCol.doc(id).set(rest).catch(() => {}); }
  render();
  showToast('Result updated', false);
}

/* ---------- share a result as an image ---------- */
// A 1080x1350 card drawn on a canvas: both teams on court-colored panels, rating changes, the score, and a note
// when the side the forecast had losing won. Night (dark) and Day (light) versions.
const SHARE_W = 1080, SHARE_H = 1350;
const SHARE_THEMES = {
  night: { ink: '#EEF2F7', muted: '#8E9BAD', badgeBg: 'rgba(221,242,71,.14)', badgeInk: '#DDF247' },
  day: { ink: '#0E1726', muted: '#5D6A7B', badgeBg: '#DDF247', badgeInk: '#1B2104' }
};
const SHARE_PANELS = [['#3D5BFF', '#2B49E6'], ['#0f8c66', '#08664b']];
const DISPLAY_FONT = '"Bricolage Grotesque", "Arial Narrow", sans-serif';
const UI_FONT = 'Geist, system-ui, -apple-system, "Segoe UI", Roboto, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
const EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
// What goes on the card for one game. pending: a just-finished game that isn't in the record yet.
function shareCardData(g, pending) {
  const games = pending ? [...allGames().filter(x => x.id !== g.id), g] : allGames();
  const c = DR.compute(games).changes[g.id];
  const named = n => !isDefaultName(String(n).trim());
  const deltaFor = (t, name) => {
    if (!c || !named(name)) return null;
    const x = c.list.find(y => y.team === t && sameName(y.name, name));
    return x ? x.after - x.before : null;
  };
  const target = Number(g.target) || 11;
  // Upset: the side the pre-game forecast had losing won. Only when both sides have named players and the
  // forecast (the same one the end-of-game screen shows) had it by 2+ points.
  let upset = null;
  if (c && [0, 1].every(t => g.teams[t].some(named)) && Math.abs(c.expected - 0.5) >= 0.02) {
    const fav = c.expected >= 0.5 ? 0 : 1;
    const pf = fav === 0 ? c.expected : 1 - c.expected;
    const lo = Math.min(target - 1, Math.round(target * (1 - pf) / pf));
    if (g.winner !== fav && lo <= target - 2) {
      const sc = fav === 0 ? [target, lo] : [lo, target];
      upset = `${sc[0]}–${sc[1]}`;
    }
  }
  const d = new Date(g.endedAt || Date.now());
  const mode = g.mode === 'singles' ? 'Singles' : 'Doubles';
  return {
    date: d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }),
    mode, line2: g.logged ? `To ${target}` : `To ${target} · ${g.scoring === 'rally' ? 'Rally' : 'Side-out'}`,
    teams: [0, 1].map(t => ({
      score: Number(g.score[t]) || 0, win: g.winner === t,

// Tell the player when something new unlocks (checked after each refresh from the server).
function announceUnlocks() {
  if (!club || !myName()) return;
  const p = progressOf(myName()), info = progressInfo();
  if (!p || !info) return;
  const seenAll = store.get('pb.seenProgress', {});
  const seenKey = club.code + '|' + myName().toLowerCase();
  const seen = seenAll[seenKey];
  const now = { ach: p.achievements.map(a => a.id), ch: (p.week || []).filter(x => x.done).map(x => info.week.id + ':' + x.id), tr: p.trophies.map(t => t.season + t.mode) };
  const lv = levelUnlockMsgs(seen);
  Object.assign(now, lv.now);
  seenAll[seenKey] = now; store.set('pb.seenProgress', seenAll);
  if (!seen) return; // first time on this phone: don't replay old unlocks
  const msgs = lv.msgs.slice();
  for (const id of now.ach) if (!seen.ach.includes(id)) { const a = info.achievements.find(x => x.id === id); if (a) msgs.push(`${ACH_ICON[id] || '🏅'} Achievement: ${a.name}! +${a.dinks} Dinks`); }
  for (const k of now.ch) if (!(seen.ch || []).includes(k)) { const c = info.week.challenges.find(x => k.endsWith(':' + x.id)); if (c) msgs.push(`✓ Challenge done: ${c.name}. +${c.dinks} Dinks`); }
  for (const k of now.tr) if (!(seen.tr || []).includes(k)) { const t = p.trophies.find(x => x.season + x.mode === k); if (t) msgs.push(`${MEDAL[t.place - 1]} ${t.name} ${t.mode} ${PLACE[t.place - 1]}! +${info.season.prizes[t.place - 1]} Dinks`); }
  msgs.slice(0, 3).forEach((m, i) => setTimeout(() => showToast(m, false), i * 3200));
}

/* ---------- levels: one for each player (with prestige) and one for the whole club ---------- */
// Same rules as api/_dinks.js: only games sent from a club player's phone count, 10 XP a game and 5 more for a win,
// at most 300 XP a player a day. Personal levels stop at
// LEVEL_MAX; a maxed player can prestige to start again from level 1 with a star and bonus Dinks. The club level adds up
// every game the club has played and never stops.
const XP = { game: 10, win: 5, dailyCap: 300 }, LEVEL_MAX = 25, PRESTIGE_ID = 'prestige', PRESTIGE_DINKS = 250;
const levelNeed = n => 40 + 8 * (n - 1);
function levelFrom(xp) {
  let level = 1, left = Math.max(0, Math.floor(xp));
  while (level < LEVEL_MAX && left >= levelNeed(level)) { left -= levelNeed(level); level++; }
  return { level, into: level < LEVEL_MAX ? left : 0, need: level < LEVEL_MAX ? levelNeed(level) : 0, maxed: level >= LEVEL_MAX };
}
let xpCache = { sig: null, map: null };
function xpMap() {
  const games = allGames();
  const sig = games.length + ':' + games.map(g => g.id + g.winner + (g.scoredBy ? 1 : 0)).join('').length + ':' + (games[0] ? games[0].id : '');
  if (xpCache.sig === sig) return xpCache.map;
  const map = new Map(), daily = new Map();
  for (const g of games) {
    if (!g.scoredBy) continue;
    const day = new Date(g.receivedAt || g.endedAt).toISOString().slice(0, 10);
    for (const t of [0, 1]) for (const raw of g.teams[t]) {
      const nm = String(raw).trim();
      if (!nm || isDefaultName(nm)) continue;
      const k = nm.toLowerCase(), dk = k + '|' + day, used = daily.get(dk) || 0;
      const n = Math.max(0, Math.min(XP.game + (g.winner === t ? XP.win : 0), XP.dailyCap - used));
      daily.set(dk, used + n);
      map.set(k, (map.get(k) || 0) + n);
    }
  }
  xpCache = { sig, map };
  return map;
}
function prestigeOf(name) {
  const p = clubPlayers().find(x => sameName(x.name, name));
  const pr = (p && p.prestige) || {};
  return { count: Math.max(0, Number(pr.count) || 0), xpAt: Math.max(0, Number(pr.xpAt) || 0) };
}
function playerLevel(name) {
  const xp = xpMap().get(String(name || '').trim().toLowerCase()) || 0;
  const pr = prestigeOf(name);
  return Object.assign(levelFrom(xp - pr.xpAt), { xp, prestige: pr.count });
}
const stars = n => n ? `<span class="lv-stars" aria-hidden="true">${n > 3 ? '★×' + n : '★'.repeat(n)}</span>` : '';
// Self-reported DUPR rating (display only, never used for the Dink Rating, XP or order). Everyone in the club sees it.

const duprOf = name => { const p = club && clubPlayers().find(x => sameName(x.name, name)); return p && p.dupr ? p.dupr : null; };
const duprChip = name => { const v = duprOf(name); return v ? `<span class="dupr" title="${DUPR_TIP}" aria-label="DUPR ${v.toFixed(2)}, self-reported, not verified">DUPR ${v.toFixed(2)}<small>self-reported</small></span>` : ''; };
// That name's own phone, or an organizer (the only one who can set it on a guest name).
const canSetDupr = name => !!club && !!clubData && clubPlayers().some(x => sameName(x.name, name)) && (isMe(name) || (club.hasPin ? hasOrganizer() : isCreator()));
let duprEdit = null; // { name, value, error, busy } while the DUPR box in a profile or the Your DUPR card is being edited
const refreshDupr = () => { if (profile) renderProfile(); if (clubSheet) renderClub(); };
function selfDuprHTML(name) {

}

}

// Club level: 10 XP for every game; level n needs 50 x n XP to reach the next.
const CLUB_XP = 10, clubNeed = n => 50 * n;
function clubLevel() {
  let level = 1, left = clubGames().length * CLUB_XP;
  while (left >= clubNeed(level)) { left -= clubNeed(level); level++; }
  return { level, into: left, need: clubNeed(level), games: Math.ceil((clubNeed(level) - left) / CLUB_XP) };
}

    : `<span class="lv-bar"><i style="width:${Math.round(100 * L.into / L.need)}%"></i></span><p class="note">${L.need - L.into} XP to level ${L.level + 1}. Games sent from a club player's phone give ${XP.game} XP, ${XP.game + XP.win} for a win, up to ${XP.dailyCap} a day.</p>`;

let prestigeArmed = false, prestigeBusy = false;

function levelUnlockMsgs(seen) {

function rivalriesHTML(name, mode) {

    const t = g.teams[0].some(n => n.trim().toLowerCase() === k) ? 0 : g.teams[1].some(n => n.trim().toLowerCase() === k) ? 1 : -1;
    if (t < 0) continue;

      const e = opp.get(ok) || { name: n.trim(), w: 0, l: 0, last: 0 };

      opp.set(ok, e);

  const rivals = [...opp.values()].filter(e => e.w + e.l >= 3).sort((a, b) => (b.w + b.l) - (a.w + a.l) || b.last - a.last).slice(0, 3);

  }).join('')}</div></div>`;
}

// Shrink a photo on the phone to a 160px square JPEG before it's sent.

// Victory sounds, made with Web Audio (no files). The audio context is only made when a sound may play, so phones
// that aren't using one never have their music interrupted.
let actx = null;
function audioCtx() {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { actx = new C(); } catch { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(ctx, { f, f2, type = 'sine', at = 0, dur = 0.3, vol = 0.25, attack = 0.01, out }) {
  const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(out || ctx.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(ctx, { at = 0, dur = 0.5, vol = 0.3, attack = 0.01, filter = 'bandpass', freq = 1000, q = 1, out }) {
  const len = Math.ceil(ctx.sampleRate * (dur + 0.05)), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(), bq = ctx.createBiquadFilter(), g = ctx.createGain(), t = ctx.currentTime + at;
  src.buffer = buf; bq.type = filter; bq.frequency.value = freq; bq.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bq).connect(g).connect(out || ctx.destination); src.start(t); src.stop(t + dur + 0.05);
}
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
function playSound(id) {
  const ctx = audioCtx();
  if (!ctx) return;
  const out = ctx.createGain(); out.gain.value = 0.9; out.connect(ctx.destination);
  if (id === 'sound-ding') {
    [[88, 0], [93, 0.22]].forEach(([n, at]) => { tone(ctx, { f: NOTE(n), at, dur: 1.4, vol: 0.3, out }); tone(ctx, { f: NOTE(n) * 2.76, at, dur: 0.5, vol: 0.06, out }); });
  } else if (id === 'sound-horn') {
    [[0, 0.22], [0.3, 0.22], [0.6, 0.9]].forEach(([at, dur]) => {
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(out);
      [233, 294, 349, 466].forEach(f => tone(ctx, { f: f * 0.985, f2: f, type: 'sawtooth', at, dur, vol: 0.07, attack: 0.02, out: lp }));
    });
  } else if (id === 'sound-arcade') {
    [72, 76, 79, 84, 79, 84].forEach((n, i) => tone(ctx, { f: NOTE(n), type: 'square', at: i * 0.09, dur: i === 5 ? 0.6 : 0.09, vol: 0.09, attack: 0.003, out }));
    tone(ctx, { f: NOTE(91), type: 'square', at: 0.54, dur: 0.6, vol: 0.05, attack: 0.003, out });
  } else if (id === 'sound-drum') {
    for (let i = 0; i < 22; i++) noise(ctx, { at: i * 0.055, dur: 0.08, vol: 0.06 + i * 0.012, freq: 1800, q: 0.7, out });
    tone(ctx, { f: 110, f2: 45, at: 1.25, dur: 0.6, vol: 0.6, out });
    noise(ctx, { at: 1.25, dur: 1.6, vol: 0.28, filter: 'highpass', freq: 5000, q: 0.5, out });
  } else if (id === 'sound-crowd') {
    noise(ctx, { dur: 2.4, vol: 0.32, attack: 0.5, freq: 900, q: 0.6, out });
    noise(ctx, { at: 0.2, dur: 2.0, vol: 0.16, attack: 0.4, freq: 2400, q: 1.2, out });
    for (let i = 0; i < 6; i++) tone(ctx, { f: 500 + Math.random() * 400, f2: 900 + Math.random() * 500, type: 'triangle', at: 0.3 + Math.random() * 1.2, dur: 0.45, vol: 0.025, attack: 0.08, out });
    for (let i = 0; i < 14; i++) noise(ctx, { at: 0.2 + Math.random() * 1.8, dur: 0.05, vol: 0.12, freq: 2500, q: 2, out });
  } else if (id === 'sound-fanfare') {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(out);
    const seq = [[67, 0, 0.14], [67, 0.15, 0.14], [67, 0.3, 0.14], [72, 0.45, 0.5], [76, 0.95, 0.25], [79, 1.2, 1.1]];
    seq.forEach(([n, at, dur]) => { tone(ctx, { f: NOTE(n), type: 'sawtooth', at, dur, vol: 0.09, attack: 0.03, out: lp }); tone(ctx, { f: NOTE(n - 12), type: 'sawtooth', at, dur, vol: 0.05, attack: 0.03, out: lp }); });
    [64, 67, 72].forEach(n => tone(ctx, { f: NOTE(n), type: 'triangle', at: 1.2, dur: 1.1, vol: 0.06, attack: 0.05, out: lp }));
    noise(ctx, { at: 1.2, dur: 1.3, vol: 0.12, filter: 'highpass', freq: 6000, q: 0.5, out });
  }
}

  setTimeout(() => layer.remove(), 2600);
}

/* ---------- player profiles ---------- */
let profile = null; // { name, mode } when a profile is open
function playerProfile(name, mode, games) {
  const key = name.trim().toLowerCase();
  const isMe = n => n.trim().toLowerCase() === key;
  const { tables, changes } = DR.compute(games);
  const asc = [...games].sort((a, b) => a.endedAt - b.endedAt)
    .filter(g => (g.mode === 'singles' ? 'singles' : 'doubles') === mode && g.teams.some(t => t.some(isMe)));
  const series = [{ r: DR.START }];
  const partners = new Map(), opps = new Map();
  let w = 0, l = 0, pf = 0, pa = 0;
  const tally = (map, n, won) => { const k = n.trim().toLowerCase(); const e = map.get(k) || { name: n.trim(), g: 0, w: 0 }; e.g++; if (won) e.w++; map.set(k, e); };
  for (const g of asc) {
    const t = g.teams[0].some(isMe) ? 0 : 1;
    const won = g.winner === t;
    if (won) w++; else l++;
    pf += Number(g.score[t]); pa += Number(g.score[1 - t]);
    const ch = changes[g.id] && changes[g.id].list.find(x => isMe(x.name));
    series.push({ r: ch ? ch.after : series[series.length - 1].r, g, t, won });
    for (const n of g.teams[t]) if (!isMe(n)) tally(partners, n, won);
    for (const n of g.teams[1 - t]) tally(opps, n, won);
  }
  const p = DR.lookup(tables, mode, name);
  const byGames = m => [...m.values()].filter(e => !isDefaultName(e.name)).sort((a, b) => b.g - a.g || b.w / b.g - a.w / a.g);
  const partnerList = byGames(partners);
  const best = partnerList.filter(e => e.g >= 2).sort((a, b) => b.w / b.g - a.w / a.g || b.g - a.g)[0];
  return { name: p ? p.name : name, p, rel: p ? Math.round(DR.reliability(p, Date.now()) * 100) : 0, series, w, l, pf, pa, partners: partnerList, best, opps: byGames(opps), recent: asc.slice(-5).reverse() };
}
// Rating over time: one series, so no legend; the heading names it. Hover or drag to read each game.
function ratingChart(series) {
  const W = 320, H = 140, L = 34, R = 12, T = 12, B = 20;
  const rs = series.map(s => s.r);
  let lo = Math.min(...rs, DR.START), hi = Math.max(...rs, DR.START);
  if (hi - lo < 0.2) { const m = (hi + lo) / 2; lo = m - 0.1; hi = m + 0.1; }
  lo -= (hi - lo) * 0.1; hi += (hi - lo) * 0.1;
  const x = i => L + (series.length === 1 ? 0 : (i / (series.length - 1)) * (W - L - R));
  const y = r => T + (1 - (r - lo) / (hi - lo)) * (H - T - B);
  const step = (hi - lo) > 1 ? 0.5 : (hi - lo) > 0.4 ? 0.2 : 0.1;
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(2));
  const pts = series.map((s, i) => `${x(i).toFixed(1)},${y(s.r).toFixed(1)}`);
  const last = series.length - 1;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rating over ${last} games, from ${r2(DR.START)} to ${r2(series[last].r)}" data-chart>
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="axis" x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${v.toFixed(step < 0.2 ? 1 : 1)}</text>`).join('')}
    <line class="base" x1="${L}" x2="${W - R}" y1="${y(DR.START).toFixed(1)}" y2="${y(DR.START).toFixed(1)}"/>
    <path class="area" d="M${pts[0]} L${pts.join(' L')} L${x(last).toFixed(1)},${H - B} L${L},${H - B} Z"/>
    <polyline class="line" points="${pts.join(' ')}"/>
    <circle class="end" cx="${x(last).toFixed(1)}" cy="${y(series[last].r).toFixed(1)}" r="4.5"/>
    <text class="axis" x="${L}" y="${H - 4}">Start</text><text class="axis" x="${W - R}" y="${H - 4}" text-anchor="end">Game ${last}</text>
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="hover-dot" r="4" visibility="hidden"/>
  </svg>`;
  return { svg, geo: { W, L, R, n: series.length, x, y } };
}
let chartGeo = null, chartSeries = null;
function wireChart() {
  const card = document.querySelector('#sheet4 .chart-card');
  const svgEl = card && card.querySelector('svg');
  if (!svgEl || !chartGeo) return;
  const tip = card.querySelector('.chart-tip'), cross = svgEl.querySelector('.cross'), dot = svgEl.querySelector('.hover-dot');
  const show = clientX => {
    const box = svgEl.getBoundingClientRect();
    const vx = (clientX - box.left) / box.width * chartGeo.W;
    const i = Math.max(0, Math.min(chartGeo.n - 1, Math.round((vx - chartGeo.L) / ((chartGeo.W - chartGeo.L - chartGeo.R) / Math.max(1, chartGeo.n - 1)))));
    const s = chartSeries[i];
    const cx = chartGeo.x(i), cy = chartGeo.y(s.r);
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('visibility', 'visible');
    const prev = i > 0 ? chartSeries[i - 1].r : s.r;
    const d = Math.round((s.r - prev) * 100) / 100;
    tip.innerHTML = i === 0 ? `<b>${r2(s.r)}</b> starting rating`
      : `<b>${r2(s.r)}</b> ${d === 0 ? '±0.00' : (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2)}<br>${s.won ? 'Won' : 'Lost'} ${Number(s.g.score[s.t])}–${Number(s.g.score[1 - s.t])} vs ${esc(teamLabel(s.g.teams[1 - s.t]))}`;
    tip.hidden = false;
    // Keep the readout inside the card: centre it on the point, then nudge it in from either edge.
    const px = (cx / chartGeo.W) * box.width + (box.left - card.getBoundingClientRect().left);
    const half = tip.offsetWidth / 2, cw = card.clientWidth;
    tip.style.left = Math.max(half + 6, Math.min(cw - half - 6, px)) + 'px';
  };
  const hide = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  svgEl.addEventListener('pointermove', e => show(e.clientX));
  svgEl.addEventListener('pointerdown', e => show(e.clientX));
  svgEl.addEventListener('pointerleave', hide);
}
function renderProfile() {

  }
  const changed = setSheet(root, `<div class="sheet-bg top"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pf-h"><span class="grip"></span>

    ${levelCardHTML(pr.name)}

  if (changed) wireChart();

  if (form.matches('[data-form="whoami"]')) { e.preventDefault(); claimName($('#whoami-name').value); return; }
  if (form.matches('[data-form="whoami-pin"]')) { e.preventDefault(); clubSheet.claimPin = $('#whoami-pin').value.trim(); claimName(clubSheet.needPinFor); return; }
  if (form.matches('[data-form="pin-set"]')) { e.preventDefault(); pinSet($('#pin-old') ? $('#pin-old').value : '', $('#pin-new').value, $('#pin-new2').value); return; }
  if (!form.matches('[data-form="add-player"]')) return;
  e.preventDefault();
  const name = $('#new-player').value.trim();
  if (!name) return;
  addToRoster([name]); render();
  const again = $('#new-player'); if (again) again.focus();
});
document.addEventListener('keydown', e => {
  if (tourStep !== null) {
    if (e.key === 'Escape') closeTour();
    else if (e.key === 'ArrowRight' && tourStep < tourSteps().length - 1) { tourStep++; renderTour(); }
    else if (e.key === 'ArrowLeft' && tourStep > 0) { tourStep--; renderTour(); }
    return;
  }
  if (e.key === 'Escape' && shareSheet) { closeShare(); return; }
  if (e.key === 'Escape' && profile) { profile = null; renderProfile(); return; }
  if (e.key === 'Escape' && clubSheet) { clubSheet = null; renderClub(); if (renderPending) safeRender(); return; }
  if (e.key === 'Escape' && logForm) { logForm = null; render(); return; }
  if (e.key === 'Escape' && evScreen && !(live && live.open)) { evAct('back', {}); return; }
  if (!live || !live.open || live.state.winner !== null || live.confirmEnd || logForm || clubSheet || profile) return;
  if (e.target.matches && e.target.matches('input')) return;
  if (e.key === '1' || e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); document.querySelector('[data-rally="0"]').click(); }
  if (e.key === '2' || e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); document.querySelector('[data-rally="1"]').click(); }
  if ((e.key === 'z' && (e.ctrlKey || e.metaKey)) || e.key === 'Backspace') { e.preventDefault(); document.querySelector('[data-act="undo"]').click(); }
});

/* ---------- DUPR link and send (off unless the server has DUPR keys) ---------- */
// Everything here stays hidden until GET /api/dupr says {enabled:true}. A player signs in on DUPR's own page (an iframe),
// the server confirms who they are with DUPR, and only a DUPR id and a rating are kept. Organizers review finished event
// matches and send them to DUPR after an explicit confirm. DUPR numbers are shown as labelled by DUPR and never feed the
// Dink Rating, Dinks, achievements or the leaderboard order. (The self-reported rating further up is a separate thing.)
let dsso = { code: null, cfg: null, loading: false, failedAt: 0 };
let dssoUI = null; // { view: 'connect' | 'review', name, event, busy, error, review, round, ok, results }
function dssoCfg() {
  if (!club || !API_OK) return null;
  if (dsso.code === club.code && dsso.cfg) return dsso.cfg.enabled ? dsso.cfg : null;
  if (!dsso.loading && (dsso.code !== club.code || Date.now() - dsso.failedAt > 60000)) {
    const code = club.code; dsso = { code, cfg: null, loading: true, failedAt: 0 };
    api('dupr?code=' + code).then(d => { if (club && club.code === code) { dsso = { code, cfg: d, loading: false, failedAt: 0 }; if (d.enabled) { refreshDupr(); if (evScreen) renderEvents(true); } } })
      .catch(() => { dsso = { code, cfg: null, loading: false, failedAt: Date.now() }; });
  }
  return null;
}
const dssoFmt = v => (typeof v === 'number' ? v.toFixed(2) : '–');
const dssoAgo = at => { const m = Math.max(0, Math.round((Date.now() - at) / 60000)); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const DSSO_CONSENT = 'You sign in on DUPR’s own page, so Dink Score never sees your DUPR password. Dink Score keeps your DUPR ID and your DUPR rating, and your club sees the rating labelled as DUPR’s. If an organizer sends event scores to DUPR, what goes to DUPR is the players’ DUPR IDs, the scores, the match date and the event name. Nothing is sent without an organizer confirming it. You can revoke access in your DUPR settings, or tap Unlink here, which deletes the stored ID and rating. DUPR numbers never change your Dink Rating, Dinks or leaderboard.';
// DUPR is wired to DUPR's UAT (test) site until production keys exist, so say so where a real account may fail.
const duprTestNote = c => DuprEntry.testMode(c) ? '<p class="note"><span class="test" style="font-weight:700">DUPR test mode.</span> This connects to DUPR’s test site (uat.dupr.gg). A real DUPR account may not sign in here, and that is not a bug in Dink Score.</p>' : '';
/*DUPRENTRY-START*/
// Which "Your DUPR" card to show. Pure, so test/duprentry.test.js can load this block alone.
const DuprEntry = {
  // cfg is the enabled /api/dupr answer or null
  state: ({ club, cfg, myName }) => (!club ? 'noclub' : !myName ? 'pickname' : cfg ? 'connect' : 'self'),
  testMode: cfg => !!cfg && cfg.env === 'uat'
};
/*DUPRENTRY-END*/
// The always-findable "Your DUPR" card: header DUPR button and the club sheet. Reuses the profile's DUPR boxes.
function yourDuprHTML(label = true) {
  const c = dssoCfg(), mine = myName();
  const st = DuprEntry.state({ club, cfg: c, myName: mine });
  const tag = DuprEntry.testMode(c) ? '<span class="test">DUPR test mode</span>' : '';
  let inner;
  if (st === 'noclub') inner = '<p class="note">DUPR linking is per club, so join or start a club first. Then you can link your DUPR here.</p><button type="button" class="btn btn-blue" data-act="club-open">Join or start a club</button>';
  else if (st === 'pickname') inner = `<p class="note">First tell ${esc(club.name)} which player you are. Pick your name, then you can connect your DUPR.</p><button type="button" class="btn btn-blue" data-act="whoami-open">Pick my name</button>`;
  else if (st === 'connect') inner = `<p class="note">You are <b>${esc(mine)}</b> in ${esc(club.name)}.</p>${duprTestNote(c)}${dssoProfileHTML(mine)}`;
  else inner = `<p class="note">You are <b>${esc(mine)}</b> in ${esc(club.name)}. Linking with DUPR is not switched on, so you can enter your rating yourself.</p>${selfDuprHTML(mine)}`;
  return `<section class="dupr-entry" aria-label="Your DUPR">${label ? '<span class="lab">Your DUPR</span>' : ''}${tag}${inner}</section>`;
}
function dssoProfileHTML(name) {
  const c = dssoCfg(); if (!c) return '';
  const p = c.players[String(name).trim().toLowerCase()];
  const can = isMe(name) || canOrganize();
  if (!p) return can ? `<div class="dupr-box"><div class="dupr-row"><span class="note">Not connected to DUPR</span><button type="button" class="link" data-dsso="connect" data-name="${esc(name)}">Connect DUPR</button></div></div>` : '';
  const r = p.rating || {};
  const prov = p.provisional || {};
  return `<div class="dupr-box"><div class="dupr-row"><span class="dsso-chip" aria-label="DUPR doubles ${dssoFmt(r.doubles)}, singles ${dssoFmt(r.singles)}, from DUPR">DUPR ${dssoFmt(r.doubles)}<small>doubles${prov.doubles ? ' (provisional)' : ''}</small> ${dssoFmt(r.singles)}<small>singles${prov.singles ? ' (provisional)' : ''}</small></span></div>
    <span class="note">Rating from DUPR${p.at ? `, updated ${dssoAgo(p.at)}` : ''}. Not used for your Dink Rating.</span>
    ${p.needsRelink ? `<p class="err" role="alert">DUPR access ended, so this rating may be out of date. Connect again to refresh it.</p>` : ''}
    ${can ? `<div class="dupr-row">${p.needsRelink ? `<button type="button" class="link" data-dsso="connect" data-name="${esc(name)}">Connect again</button>` : `<button type="button" class="link" data-dsso="refresh" data-name="${esc(name)}">Refresh from DUPR</button>`}<button type="button" class="link armed" data-dsso="unlink" data-name="${esc(name)}">Unlink DUPR</button></div>` : ''}</div>`;
}
function dssoEventHTML(ev, org) {
  const c = dssoCfg(); if (!c || !org) return '';
  const done = [...ev.rounds.flatMap(r => r.matches), ...(ev.knockout || []).flatMap(r => r.matches)].filter(m => m.score).length;
  if (!done) return '';
  const linked = ev.players.filter(p => c.players[p.toLowerCase()]).length;
  return `<section class="ev-card" aria-labelledby="ev-dsso"><h3 id="ev-dsso">Send scores to DUPR</h3>
    <p class="note">${linked} of ${ev.players.length} players are connected to DUPR. Only matches where all four players are connected can be sent, and nothing is sent until you confirm.</p>
    ${c.paused ? `<p class="err" role="status">Sending is paused: ${esc(c.paused.reason)}</p>` : ''}
    <div class="ev-actions"><button class="btn btn-ink ev-small" data-dsso="review-open" data-id="${esc(ev.id)}">Review and send</button></div></section>`;
}
const dssoCreds = () => Object.assign({ playerToken: myToken() || '' }, adminCreds());
const dssoTz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch { return 'UTC'; } };
const dssoPost = body => api('dupr', { method: 'POST', body: JSON.stringify(Object.assign({ code: club.code }, body)) });
function dssoSetPlayer(name, snap) { const c = dsso.cfg; if (c && c.players) { if (snap) c.players[name.toLowerCase()] = snap; else delete c.players[name.toLowerCase()]; } }

function renderDsso() {
  const root = $('#sheet6'); if (!root) return;
  const u = dssoUI, c = dssoCfg();
  if (!u || !c) { root.innerHTML = ''; root._html = root._key = ''; return; }
  let inner;
  if (u.view === 'connect') {
    inner = `<div class="sheet-head"><h2 id="dsso-h">Connect ${esc(u.name)} to DUPR</h2><button type="button" class="x" data-dsso="close" aria-label="Close">✕</button></div>
      ${duprTestNote(c)}
      <p class="note">${esc(DSSO_CONSENT)}</p>
      ${u.error ? `<p class="err" role="alert">${esc(u.error)}</p>` : ''}
      ${u.busy ? '<p class="note" role="status">Checking with DUPR…</p>' : `<iframe class="dsso-frame" id="dsso-frame" title="Sign in to DUPR" src="${esc(c.loginUrl)}"></iframe>`}`;
  } else {
    const r = u.review;
    const rounds = r ? r.rounds : [];
    const items = r ? r.items.filter(i => !u.round || i.round === u.round) : [];
    const ready = items.filter(i => i.state === 'ready'), failed = items.filter(i => i.state === 'failed');
    const label = { ready: 'Ready', blocked: 'Blocked', sent: 'Sent', failed: 'Refused', skipped: 'Not counted' };
    const todo = { create: 'Will be sent', update: 'Score changed: will update DUPR', delete: 'Deleted here: will be removed from DUPR' };
    const team = t => t.join(' & ');
    inner = `<div class="sheet-head"><h2 id="dsso-h">Send to DUPR</h2><button type="button" class="x" data-dsso="close" aria-label="Close">✕</button></div>
      <p class="note">${esc(u.event.name)}. Sent to DUPR: the four players’ DUPR IDs, the score, the match date and the event name. DUPR changes real ratings from these, so check them first.</p>
      ${u.error ? `<p class="err" role="alert">${esc(u.error)}</p>` : ''}
      ${!r ? '<p class="note" role="status">Loading…</p>' : `
        ${r.paused ? `<p class="err" role="status">Sending is paused: ${esc(r.paused.reason)} It tries again later.</p>` : ''}
        ${u.results ? `<p class="note" role="status"><b>Done.</b> ${[['created', 'sent'], ['updated', 'updated'], ['deleted', 'removed'], ['alreadyAtDupr', 'already at DUPR'], ['failed', 'refused by DUPR'], ['retryLater', 'to retry later']].filter(([k]) => u.results[k]).map(([k, w]) => `${u.results[k]} ${w}`).join(', ') || 'Nothing to send.'}</p>` : ''}
        <p class="note"><b>${r.summary.ready}</b> ready · <b>${r.summary.blocked}</b> blocked · <b>${r.summary.sent}</b> sent${r.summary.failed ? ` · <b>${r.summary.failed}</b> refused` : ''}</p>
        ${rounds.length > 1 ? `<label class="lab" for="dsso-round">Round</label><select id="dsso-round" class="field-input" data-dsso-round><option value="">All rounds</option>${rounds.map(x => `<option value="${esc(x)}" ${u.round === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>` : ''}
        <ul class="dsso-list">${items.map(i => `<li class="dsso-item"><div class="top"><b>${esc(team(i.teams[0]))} vs ${esc(team(i.teams[1]))}</b><span class="badge ${i.state === 'ready' || i.state === 'sent' ? 'on' : i.state === 'blocked' || i.state === 'failed' ? 'hot' : 'prov'}">${label[i.state]}</span></div>
          <span class="note">${esc(i.round)} · ${i.score ? `${i.score[0]}–${i.score[1]}` : 'no score'}${i.state === 'ready' ? ` · ${todo[i.action] || ''}` : ''}</span>
          ${i.reasons.map(x => `<p class="bad">${esc(x.text)}</p>`).join('')}${i.note ? `<span class="note">${esc(i.note)}</span>` : ''}</li>`).join('') || '<li class="note">No finished matches yet.</li>'}</ul>
        ${ready.length || failed.length ? `<label class="dsso-check"><input type="checkbox" data-dsso-ok ${u.ok ? 'checked' : ''}><span>I checked these scores and players. Send ${ready.length} match${ready.length === 1 ? '' : 'es'} to DUPR.</span></label>
          <div class="ev-actions"><button class="btn btn-ink ev-small" data-dsso="send" ${u.ok && ready.length && !u.busy && !r.paused ? '' : 'disabled'}>${u.busy ? 'Sending…' : `Send ${ready.length} to DUPR`}</button>${failed.length ? `<button class="btn btn-soft ev-small" data-dsso="retry" ${u.ok && !u.busy && !r.paused ? '' : 'disabled'}>Try the ${failed.length} refused again</button>` : ''}</div>` : ''}`}`;
  }
  setSheet(root, `<div class="sheet-bg top"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dsso-h"><span class="grip"></span>${inner}</div></div>`, u.view + (u.event ? u.event.id : u.name));
}
function dssoClose() { dssoUI = null; renderDsso(); }
async function dssoLink(userToken) {
  const u = dssoUI; if (!u || u.busy) return;
  u.busy = true; u.error = ''; renderDsso();
  try {
    const d = await dssoPost(Object.assign({ action: 'link', playerName: u.name, userToken }, dssoCreds()));
    dssoSetPlayer(u.name, d.snapshot);
    if (dssoUI === u) dssoUI = null;
    showToast(d.basic === false ? 'DUPR connected. DUPR shows no membership for this account yet.' : 'DUPR connected', false);
  } catch (err) { u.busy = false; u.error = err.message; }
  renderDsso(); refreshDupr();
}
async function dssoReview(quiet) {
  const u = dssoUI; if (!u) return;
  try { u.review = await dssoPost(Object.assign({ action: 'review', id: u.event.id, tz: dssoTz() }, adminCreds())); if (!quiet) u.error = ''; }
  catch (err) { if (err.status === 403) forgetPin(); u.error = err.message; u.review = u.review || { items: [], rounds: [], summary: { ready: 0, blocked: 0, sent: 0, failed: 0, skipped: 0 }, paused: null }; }
  renderDsso();
}
async function dssoSend(retryFailed) {
  const u = dssoUI; if (!u || u.busy || !u.ok) return;
  const ids = u.review.items.filter(i => (!u.round || i.round === u.round) && (i.state === 'ready' || (retryFailed && i.state === 'failed'))).map(i => i.matchId);
  if (!ids.length) return;
  u.busy = true; u.error = ''; renderDsso();
  try {
    const d = await dssoPost(Object.assign({ action: 'send', id: u.event.id, tz: dssoTz(), confirm: true, matchIds: ids, retryFailed: !!retryFailed }, adminCreds()));
    u.review = d; u.results = d.results; u.ok = false;
  } catch (err) { if (err.status === 403) forgetPin(); u.error = err.message; }
  u.busy = false; renderDsso();
}
// The login iframe reports the signed-in player with a message. Anything not from DUPR's login origin and this iframe is ignored;
// the server then asks DUPR who the token belongs to, so the message itself proves nothing.
window.addEventListener('message', e => {
  const c = dssoCfg(), fr = document.getElementById('dsso-frame');
  if (!c || !dssoUI || dssoUI.view !== 'connect' || !fr || e.origin !== c.loginOrigin || e.source !== fr.contentWindow) return;
  let d = e.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
  const t = d && (d.userToken || d.accessToken);
  if (typeof t === 'string' && t) dssoLink(t);
});
document.addEventListener('click', async e => {
  const b = e.target.closest && e.target.closest('button[data-dsso]');
  if (!b || !dssoCfg()) return;
  const a = b.dataset.dsso, name = b.dataset.name;
  if (a === 'close') dssoClose();
  else if (a === 'connect') { dssoUI = { view: 'connect', name }; renderDsso(); }
  else if (a === 'review-open') { dssoUI = { view: 'review', event: { id: b.dataset.id, name: evScreen && evScreen.event ? evScreen.event.name : 'Event' }, review: null, round: '', ok: false }; renderDsso(); dssoReview(); }
  else if (a === 'send') dssoSend(false);
  else if (a === 'retry') dssoSend(true);
  else if (a === 'refresh') {
    b.disabled = true;
    try { const d = await dssoPost({ action: 'refresh', playerName: name }); dssoSetPlayer(name, d.snapshot); showToast(d.needsRelink ? 'DUPR access ended. Connect again.' : d.cached ? 'Already up to date' : 'Rating updated from DUPR', false); }
    catch (err) { showToast(err.message, false); }
    refreshDupr();
  } else if (a === 'unlink') {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Tap again to unlink'; return; }
    try { await dssoPost(Object.assign({ action: 'unlink', playerName: name }, dssoCreds())); dssoSetPlayer(name, null); showToast('DUPR unlinked. The stored ID and rating are deleted.', false); }
    catch (err) { showToast(err.message, false); }
    refreshDupr();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!dssoUI) return;
  if (t.matches && t.matches('[data-dsso-round]')) { dssoUI.round = t.value; dssoUI.ok = false; renderDsso(); }
  if (t.matches && t.matches('[data-dsso-ok]')) { dssoUI.ok = t.checked; renderDsso(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && dssoUI) { e.stopImmediatePropagation(); dssoClose(); } }, true);

if (live && live.state.winner === null && live.open) keepAwake(true);
render();
if (importedCount) showToast(`Moved ${importedCount} game${importedCount === 1 ? '' : 's'} from the old site`, false);
if (club) { flush(); refreshClub(); }
checkInvite().finally(() => { urlReady = true; syncUrl(); });
</script>
