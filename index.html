<style>
:root { color-scheme: light; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<title>Dink Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Layout: phone-first app. Home is a tile grid (now playing, log a result, top player, this week) over the game setup card.
   A floating pill tab bar. Scoring is two rounded court panels with condensed numerals and a score-call pill between them.
   One bold idea: the variable grotesque squeezed narrow and heavy for every number that matters. */
/*TOKENS-START*/
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #E9EDF2;
  --ink: #0E1726;
  --muted: #5D6A7B;
  --line: #DEE4EA;
  --blue: #2B49E6;      /* team 1 court */
  --green: #0B8562;     /* team 2 court */
  --ball: #DDF247;      /* serve, highlights */
  --ball-ink: #1B2104;
  --up: #0B8562;
  --down: #C2372B;
  --danger: #C2372B;
  --focus: #2B49E6;
  --shadow: 0 1px 2px rgb(14 23 38 / .06), 0 8px 24px -12px rgb(14 23 38 / .18);
  --display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --ui: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F17; --surface: #131B26; --surface-2: #1B2532; --ink: #EEF2F7; --muted: #8E9BAD; --line: #243142;
    --blue: #3D5BFF; --green: #12A578; --ball: #DDF247; --ball-ink: #1B2104;
    --up: #3DD69E; --down: #FF7A6B; --danger: #FF7A6B; --focus: #9DB0FF;
    --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 30px -14px rgb(0 0 0 / .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F17; --surface: #131B26; --surface-2: #1B2532; --ink: #EEF2F7; --muted: #8E9BAD; --line: #243142;
  --blue: #3D5BFF; --green: #12A578; --ball: #DDF247; --ball-ink: #1B2104;
  --up: #3DD69E; --down: #FF7A6B; --danger: #FF7A6B; --focus: #9DB0FF;
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 30px -14px rgb(0 0 0 / .7);
  color-scheme: dark;
}
/*TOKENS-END*/
html { height: 100%; height: 100dvh; overflow: hidden; background: var(--bg); }
body { height: 100%; height: 100dvh; margin: 0; overflow-y: auto; overscroll-behavior-y: none; -webkit-overflow-scrolling: touch; scrollbar-gutter: stable; }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 15; pointer-events: none; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, .n { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(112px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark { display: flex; align-items: center; gap: 10px; flex: none; }
.wordmark svg { width: 34px; height: 34px; flex: none; }
.wordmark h1 { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 28px; letter-spacing: -.02em; line-height: 1; margin: 0; white-space: nowrap; }
.top-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; flex: 1; }
.top-right .sync { min-width: 0; }
.me-btn { position: relative; --r: 26px; width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; padding: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; box-shadow: 0 0 0 2px var(--surface), 0 4px 12px -4px rgb(0 0 0 / .35); }
.me-btn svg { width: 22px; height: 22px; }
.me-btn .av-emoji { font-size: 22px; }
.me-btn .av-icon { width: 60%; height: 60%; }
.me-btn.frame-crown::before { top: -13px; width: 22px; height: 14px; }
@media (max-width: 380px) { .wordmark h1 { font-size: 24px; } .wordmark svg { width: 30px; height: 30px; } }
.sync { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.sync.on::before { background: var(--up); }
h2 { font-family: var(--display); font-weight: 700; font-stretch: 90%; font-size: 26px; letter-spacing: -.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 700; font-stretch: 90%; font-size: 19px; letter-spacing: -.01em; margin: 0; }
.sub { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.card { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); }

/* Home tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 0; border-radius: 22px; padding: 16px; box-shadow: var(--shadow); text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 132px; }
.tile .t-k { font-size: 13px; color: var(--muted); font-weight: 500; }
.tile .t-big { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: .95; letter-spacing: -.02em; }
.tile .t-name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; line-height: 1.2; }
.tile .t-foot { margin-top: auto; font-size: 13px; color: var(--muted); }
.tile.wide { grid-column: 1 / -1; }
.tile.live { background: var(--ink); color: var(--bg); min-height: 0; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 14px; }
.tile.live .t-k { color: inherit; opacity: .65; display: flex; align-items: center; gap: 8px; }
.tile.live .t-k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 0 4px rgb(221 242 71 / .25); }
.tile.live .t-big { font-size: 54px; grid-column: 1; }
.tile.live .t-name { grid-column: 1; font-weight: 500; opacity: .8; font-size: 14px; }
.tile.live .go { grid-column: 2; grid-row: 1 / span 3; background: var(--ball); color: var(--ball-ink); border-radius: 999px; padding: 12px 18px; font-weight: 700; }
.tile.log { background: var(--blue); color: #fff; }
.tile.log .t-k { color: rgb(255 255 255 / .8); }
.tile.log .plus { width: 34px; height: 34px; border-radius: 50%; background: rgb(255 255 255 / .18); display: grid; place-items: center; font-size: 22px; line-height: 1; }
.tile.log .t-name { margin-top: auto; font-size: 17px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 58px; margin-top: 4px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.week i { display: block; width: 100%; max-width: 26px; border-radius: 6px; background: var(--surface-2); min-height: 4px; }
.week i.has { background: var(--green); }
.week i.today { outline: 2px solid var(--ball); outline-offset: 1px; }
.week span { font-size: 11px; color: var(--muted); }

/* Setup */
.field { display: flex; flex-direction: column; gap: 8px; }
.field + .field { margin-top: 14px; }
.lab { font-size: 13px; font-weight: 500; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 10px 6px; font-weight: 600; font-size: 15px; color: var(--muted); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(14 23 38 / .14); }
.seg.sm button { padding: 7px 10px; font-size: 14px; }
.seg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.teams { display: grid; gap: 10px; margin-top: 18px; position: relative; }
.team { border-radius: 18px; padding: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }
.team::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--c); }
.team .thead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.team .tname { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.team .tname::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.team input { width: 100%; min-width: 0; border: 1px solid transparent; background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.team input:focus-visible { outline: none; border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.serve-pick { border: 0; background: transparent; border-radius: 999px; padding: 5px 10px 5px 6px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.serve-pick .ball { opacity: .35; }
.serve-pick[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink); }
.serve-pick[aria-pressed="true"] .ball { opacity: 1; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .25); }
.swap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--surface); background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 16px; padding: 0; }
.ball { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; background: radial-gradient(circle at 35% 35%, #F4FAB8 0 16%, var(--ball) 17%); }

.roster { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.roster .rhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; max-width: 100%; overflow-wrap: anywhere; }
.chip-btn .r { font-family: var(--display); font-stretch: 75%; font-weight: 700; font-size: 14px; color: var(--muted); }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-btn[aria-pressed="true"] .r { color: inherit; opacity: .65; }
.chip-btn.editing { border-style: dashed; }
.chip-btn.editing::after { content: "✕"; font-size: 11px; color: var(--danger); }
.add-player { display: flex; gap: 8px; }
.add-player input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.new-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.link { border: 0; background: transparent; padding: 4px 2px; font-size: 14px; font-weight: 600; color: var(--blue); }
.link.armed { color: var(--danger); }

.forecast { margin-top: 16px; border-radius: 16px; background: var(--surface-2); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
.forecast .fc-k { font-size: 12px; color: var(--muted); font-weight: 500; }
.forecast .fc-who { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.forecast .fc-score { grid-row: 1 / span 2; grid-column: 2; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 34px; line-height: 1; }
.forecast .fc-note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin: 4px 0 0; }

.btn { border: 0; border-radius: 16px; padding: 16px 20px; font-weight: 700; font-size: 16px; display: inline-flex; justify-content: center; align-items: center; gap: 10px; }
.btn:active { transform: scale(.985); }
.btn-ink { background: var(--ink); color: var(--bg); }
.btn-ball { background: var(--ball); color: var(--ball-ink); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-soft { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--danger); color: #fff; }
.btn.block { width: 100%; }
.start { margin-top: 18px; }

/* Lists */
.games { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.game { background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; }
.game .lines { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.game .line { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; }
.game .tick { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.game .who { min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
.game .win .who { color: var(--ink); font-weight: 600; }
.game .pts { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 26px; line-height: 1; min-width: 2ch; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.game .win .pts { color: var(--ink); }
.game .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-left: 18px; }
.tag { background: var(--surface-2); border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 500; }
.month { display: flex; flex-direction: column; gap: 12px; }
.month-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.month-stats div { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; }
.month-stats b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.month-stats span { font-size: 12px; color: var(--muted); }
.month-facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.month-facts li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.month-facts .mk { color: var(--muted); flex: none; }
.month-facts .mv { text-align: right; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.pl-link { border: 0; background: transparent; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.g-actions { display: flex; gap: 12px; align-self: start; }
.g-actions .link { font-size: 13px; padding: 2px 0; }
.tag.logged { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }

.empty { background: var(--surface); border-radius: 22px; padding: 24px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty p { margin: 0; color: var(--muted); max-width: 42ch; }

.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.totals div { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.totals b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.totals span { font-size: 13px; color: var(--muted); }

/* Leaders */
.podium { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; align-items: end; }
.step { border: 0; background: transparent; font: inherit; color: inherit; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.step .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 17px; margin-bottom: 6px; }
.step.s1 .avatar { width: 58px; height: 58px; font-size: 21px; box-shadow: 0 0 0 4px var(--ball); }
.step .pl-name { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; line-height: 1.2; }
.step .pl-rating { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.step.s1 .pl-rating { font-size: 38px; }
.step .block { width: 100%; margin-top: 8px; border-radius: 16px 16px 6px 6px; display: flex; justify-content: center; padding-top: 8px; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 24px; background: var(--surface); box-shadow: var(--shadow); color: var(--muted); }
.step.s1 .block { height: 96px; background: var(--ink); color: var(--ball); }
.step.s2 .block { height: 70px; }
.step.s3 .block { height: 52px; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.prow .avatar-mini { width: 34px; height: 34px; font-size: 12px; --r: 23px; }
.prow { border: 0; font: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer; background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 2.2ch auto 1fr auto; gap: 10px; align-items: center; }
.prow .rank { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 20px; color: var(--muted); text-align: center; }
.prow:first-child .rank { color: var(--ink); }
.prow .pinfo { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.prow .pname { font-weight: 600; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.prow .pstats { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.prow .rel { display: inline-flex; align-items: center; gap: 6px; }
.prow .rel i { width: 44px; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; display: inline-block; position: relative; }
.prow .rel i b { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 2px; }
.prow .pr { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.prow .rating { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
.badge.prov { background: var(--surface-2); color: var(--muted); }
.badge.hot { background: var(--ball); color: var(--ball-ink); }
.delta { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat { color: var(--muted); font-weight: 500; }
.awards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.awards > button { border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.awards .aw-k { font-size: 13px; color: var(--muted); }
.awards .aw-name { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; line-height: 1.2; }
.awards .aw-v { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 26px; line-height: 1; margin-top: auto; padding-top: 6px; }

/* Rules */
.rules { display: flex; flex-direction: column; gap: 10px; }
.rule { background: var(--surface); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.rule p, .rule ul { margin: 0; color: var(--muted); max-width: 62ch; }
.rule ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.rule b { color: var(--ink); }
.call-demo { display: flex; gap: 10px; }
.call-demo div { flex: 1; background: var(--surface-2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
.call-demo strong { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: 1; }
.call-demo small { font-size: 12px; color: var(--muted); text-align: center; }

/* Tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(10px, calc(env(safe-area-inset-bottom, 0px) - 14px));
}
.tabs nav {
  pointer-events: auto; max-width: 420px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 6px;
  background: color-mix(in srgb, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 12px 34px -12px rgb(0 0 0 / .35);
}
.tabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
.tabs button[hidden] { display: none; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* Scoring screen: a floodlit night court. Two rounded team panels with glowing gradients and condensed numerals,
   a glass score-call capsule sitting on the net tape between them, and the serving side lit while the other dims. */
.court {
  position: fixed; inset: 0; z-index: 40; color: #fff;
  background: radial-gradient(120% 55% at 50% 50%, #132033 0%, #070B11 72%);
  display: grid; grid-template-rows: auto 1fr auto 1fr;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
.court-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 10px 0 12px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; color: #fff; background: rgb(255 255 255 / .08); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .1); display: inline-grid; place-items: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:disabled { opacity: .3; }
.icon-btn.wide { width: auto; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.match { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.match b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 24px; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.match span { font-size: 12px; color: rgb(255 255 255 / .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cright { display: flex; gap: 8px; }

.half {
  --c1: #4361FF; --c2: #1A2BA6;
  border: 0; padding: 0; color: #fff; text-align: left; display: block; position: relative; overflow: hidden; border-radius: 30px;
  background: linear-gradient(155deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow: 0 24px 48px -28px var(--c1), inset 0 1px 0 rgb(255 255 255 / .2);
  transition: transform .12s ease, filter .3s ease;
}
.half[data-k="b"] { --c1: #17B988; --c2: #07634A; }
.half::before { content: ""; position: absolute; inset: 0; background: rgb(6 10 16 / 0); transition: background .3s ease; pointer-events: none; }
.half.idle::before { background: rgb(6 10 16 / .3); }
.half.idle .big { color: rgb(255 255 255 / .82); }
.half:active { transform: scale(.985); }
.half .glow { position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; right: -20%; background: radial-gradient(closest-side, rgb(255 255 255 / .18), transparent); pointer-events: none; }
.half[data-k="a"] .glow { top: -30%; }
.half[data-k="b"] .glow { bottom: -30%; }
.half .inner { position: absolute; inset: 0; padding: 18px 20px 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.half[data-k="b"] .inner { flex-direction: column-reverse; padding: 22px 20px 18px; }
.team-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avs { display: flex; flex: none; }
.avs i { width: 34px; height: 34px; border-radius: 50%; background: rgb(255 255 255 / .2); display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 13px; box-shadow: 0 0 0 2px var(--c2); }
.avs i + i { margin-left: -5px; }
.avs i.srv { background: var(--ball); color: var(--ball-ink); position: relative; z-index: 1; box-shadow: 0 0 0 2px var(--c2), 0 0 0 6px rgb(221 242 71 / .3); }
.names { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.names span { font-size: 15px; font-weight: 600; color: rgb(255 255 255 / .72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.names span.srv { color: #fff; }
.badges { margin-left: auto; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex: none; }
.pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 5px 10px; background: rgb(255 255 255 / .16); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill.serve { background: var(--ball); color: var(--ball-ink); }
.pill.serve .ball { width: 10px; height: 10px; background: radial-gradient(circle at 35% 35%, #fff 0 18%, #B9CC22 19%); }
.pill.gp { background: #fff; color: #0E1726; animation: gp 1.6s ease-in-out infinite; }
@keyframes gp { 50% { box-shadow: 0 0 0 7px rgb(255 255 255 / .16); } }
.score-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.half[data-k="b"] .score-row { align-items: flex-start; }
.big { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: clamp(112px, 25vh, 240px); line-height: .78; letter-spacing: -.045em; font-variant-numeric: tabular-nums; text-shadow: 0 8px 30px rgb(0 0 0 / .2); }
.big.bump { animation: bump .36s cubic-bezier(.2, .9, .3, 1.25); }
@keyframes bump { 0% { transform: translateY(18px) scale(.9); opacity: .3; } 100% { transform: none; opacity: 1; } }
.side-mini { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; font-weight: 500; color: rgb(255 255 255 / .78); padding-bottom: 4px; }
.half[data-k="b"] .side-mini { padding: 4px 0 0; }
.side-mini .boxes { display: grid; grid-template-columns: 1fr 1fr; width: 54px; height: 32px; border: 2px solid rgb(255 255 255 / .55); border-radius: 7px; overflow: hidden; }
.side-mini .boxes i + i { border-left: 2px solid rgb(255 255 255 / .55); }
.side-mini .boxes i.on { background: var(--ball); }
.progress { height: 4px; border-radius: 2px; background: rgb(255 255 255 / .16); overflow: hidden; }
.progress b { display: block; height: 100%; background: #fff; border-radius: 2px; transition: width .35s ease; }
.ripple { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: rgb(255 255 255 / .5); pointer-events: none; animation: ripple .65s ease-out forwards; }
@keyframes ripple { to { transform: scale(20); opacity: 0; } }

.net { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; }
.net::before { content: ""; position: absolute; left: -12px; right: -12px; top: 42px; height: 3px; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .6) 18%, rgb(255 255 255 / .6) 82%, transparent); }
.call { position: relative; display: flex; gap: 4px; padding: 5px; border-radius: 22px; background: rgb(15 22 34 / .86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .12), 0 14px 34px -12px rgb(0 0 0 / .9); }
.call div { width: 60px; display: flex; flex-direction: column; align-items: center; padding: 7px 0 6px; border-radius: 17px; }
.call b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.call small { font-size: 10px; font-weight: 600; color: rgb(255 255 255 / .55); margin-top: 3px; }
.call div:first-child { background: var(--ball); color: var(--ball-ink); }
.call div:first-child small { color: rgb(27 33 4 / .7); }
.net .who { font-size: 13px; color: rgb(255 255 255 / .72); text-align: center; }
.net .who b { color: #fff; font-weight: 600; }
.net .first-hint { font-size: 12px; font-weight: 600; color: var(--ball); text-align: center; }
@media (orientation: landscape) and (min-width: 640px) {
  .court { grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr; column-gap: 12px; }
  .court-top { grid-column: 1 / -1; }
  .court > .half[data-k="a"] { grid-column: 1; grid-row: 2; }
  .court > .net { grid-column: 2; grid-row: 2; justify-content: center; }
  .court > .half[data-k="b"] { grid-column: 3; grid-row: 2; }
  .net::before { left: 50%; right: auto; top: -10px; bottom: -10px; width: 3px; height: auto; transform: translateX(-50%); background: linear-gradient(transparent, rgb(255 255 255 / .6) 15%, rgb(255 255 255 / .6) 85%, transparent); }
  .call { flex-direction: column; }
  .half[data-k="b"] .inner { flex-direction: column; padding: 18px 20px 22px; }
  .half[data-k="b"] .score-row { align-items: flex-end; }
  .net .who, .net .first-hint { max-width: 150px; text-align: center; position: relative; background: #0A111B; border-radius: 10px; padding: 4px 8px; }
  .court .big { font-size: min(44vh, 17vw); }
}
@media (max-height: 640px) { .big { font-size: clamp(84px, 22vh, 200px); } .avs i { width: 28px; height: 28px; font-size: 11px; } }

.toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 95; background: var(--ball); color: var(--ball-ink); font-weight: 700; font-size: 15px; padding: 11px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); max-width: calc(100% - 32px); text-align: center; animation: drop .3s ease-out; }
@keyframes drop { from { transform: translate(-50%, -10px); opacity: 0; } }

/* Sheets */
.sheet-bg { position: fixed; inset: 0; z-index: 70; background: rgb(5 9 15 / .55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg.top { z-index: 90; }
.sheet-bg.share { z-index: 92; }
/* Share a result: preview of the card image (4:5), with the image's own rounded corners */
.share-prev { align-self: center; flex: none; width: min(100%, 300px, calc((100dvh - 380px) * .8)); aspect-ratio: 4 / 5; border-radius: 7.8% / 6.2%; overflow: hidden; box-shadow: 0 18px 40px -22px rgb(5 9 15 / .55); }
.share-prev.busy { background: var(--surface-2); }
.share-prev img { display: block; width: 100%; height: 100%; transition: opacity .2s; }
.share-prev.busy img { opacity: .45; }
.share-prev img:not([src]) { visibility: hidden; }
.share-pill { padding: 9px 14px; border-radius: 999px; font-size: 14px; gap: 6px; flex: none; }
.share-pill svg, .share-ic { width: 16px; height: 16px; flex: none; }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; border-radius: 28px 28px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; animation: rise .32s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-top: -10px; flex: none; }
.sheet p { margin: 0; color: var(--muted); }
.sheet .btns { display: flex; flex-direction: column; gap: 8px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 16px; display: grid; place-items: center; padding: 0; flex: none; }
.result { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 20px; padding: 16px; }
.result .side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.result .side:last-child { text-align: right; align-items: flex-end; }
.result .side small { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.result .side b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; }
.result .side.won b { color: var(--c); }
.result .vs { font-size: 13px; color: var(--muted); }
.winner-line { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 30px; letter-spacing: -.02em; line-height: 1.05; margin: 0; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; }
.facts b { font-weight: 700; font-variant-numeric: tabular-nums; }
.facts small { font-size: 12px; color: var(--muted); }
.changes { display: flex; flex-direction: column; gap: 6px; }
.ch { display: grid; grid-template-columns: 8px 1fr auto auto; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 9px 12px; }
.ch .tick { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.ch .nm { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.ch .rt { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 22px; font-variant-numeric: tabular-nums; }
.expect { font-size: 14px; color: var(--muted); }

/* Log a result */
.log-teams { display: grid; gap: 10px; }
.log-team { border-radius: 18px; background: var(--surface-2); padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; position: relative; overflow: hidden; }
.log-team::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--c); }
.log-team .names { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.log-team input[type="text"] { width: 100%; min-width: 0; border: 1px solid transparent; background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.stepper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stepper input { width: 76px; text-align: center; border: 1px solid transparent; background: var(--surface); border-radius: 14px; padding: 4px 0; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: 1.1; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .sb { display: flex; gap: 4px; }
.stepper .sb button { width: 36px; height: 32px; border-radius: 10px; border: 0; background: var(--surface); font-size: 18px; font-weight: 700; padding: 0; }
.when { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.when input { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px; font-size: 15px; }
.err { color: var(--danger); font-size: 14px; font-weight: 600; margin: 0; }

/* Club */
button.sync { cursor: pointer; font-weight: 600; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: block; }
.sync.warn::before { background: var(--down); }
.code-card { background: var(--surface-2); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.org-card .code { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: .08em; user-select: all; }
.code-card .code { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 52px; letter-spacing: .08em; line-height: 1; user-select: all; }
.code-card p { font-size: 14px; }
.share-card { align-items: center; text-align: center; }
.share-card .invite, .share-card .btn.block { align-self: stretch; }
.share-qr { background: #fff; border-radius: 16px; padding: 10px; width: min(280px, 100%); box-sizing: border-box; }
.share-qr svg { display: block; width: 100%; height: auto; }
.invite { display: flex; gap: 8px; }
.invite input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.upload-card { border: 2px dashed color-mix(in srgb, var(--blue) 45%, transparent); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.upload-card .btn { padding: 11px 16px; border-radius: 12px; font-size: 15px; margin-top: 4px; }
.club-form { display: flex; flex-direction: column; gap: 8px; }
.club-form input { font-size: 16px; }
#club-code { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.deleted { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.deleted li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
.deleted li span { min-width: 0; overflow-wrap: anywhere; }
.field-input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.org-card { background: var(--surface-2); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.org-head { display: flex; justify-content: space-between; align-items: center; }
.org-card p { font-size: 14px; }
.mem-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mem-row { background: var(--surface-2); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mem-who { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left; background: none; border: 0; padding: 0; color: var(--ink); font: inherit; cursor: pointer; }
.mem-who .avatar-mini { width: 34px; height: 34px; font-size: 12px; --r: 23px; }
.mem-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.mem-name { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; min-width: 0; }
.mem-meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.mem-acts { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-left: 44px; font-size: 13px; }
.org-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.org-btns .btn { padding: 10px 14px; border-radius: 12px; font-size: 14px; }
.org-btns .btn-soft { background: var(--surface); }
.badge.on { background: color-mix(in srgb, var(--up) 18%, transparent); color: var(--up); }
.badge.off { background: var(--surface); color: var(--muted); }
.btn-line-danger { background: transparent; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
.btn:disabled { opacity: .5; }
.art-code { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.art-code b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 46px; letter-spacing: .1em; color: #fff; background: rgb(255 255 255 / .1); border-radius: 16px; padding: 6px 16px; }
.art-code .phones { display: flex; gap: 10px; }
.art-code .phones i { width: 34px; height: 56px; border-radius: 9px; border: 2px solid rgb(255 255 255 / .5); position: relative; }
.art-code .phones i::after { content: ""; position: absolute; inset: 14px 7px; border-radius: 4px; background: var(--ball); }

/* Shop, wallet and cosmetics */
.badge.you { background: var(--ink); color: var(--bg); margin-left: 6px; }
.p-title { display: block; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .01em; margin-top: 1px; }
.p-name.style-gold { background: linear-gradient(180deg, #F7D774, #C9971C); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
.p-name.style-glow { color: var(--ink); text-shadow: 0 0 10px color-mix(in srgb, var(--ball) 80%, transparent), 0 0 2px var(--ball); font-weight: 800; }
.p-name.style-flame { background: linear-gradient(90deg, #FF4D2E, #FF9F1C 60%, #FFD23F); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
.frame-ball { box-shadow: 0 0 0 3px var(--ball) !important; }
.frame-cobalt { box-shadow: 0 0 0 3px #4361FF !important; }
.frame-forest { box-shadow: 0 0 0 3px #17B988 !important; }
.frame-sunset { box-shadow: 0 0 0 3px #FF7A45, 0 0 0 6px #C2185B !important; }
.frame-prism { box-shadow: 0 0 0 3px #FF2BD6, 0 0 0 6px #00E5FF, 0 0 14px 4px rgb(0 229 255 / .35) !important; }
.avatar-mini { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--bg); display: inline-grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.dupr { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.dupr small { font-size: 10px; font-weight: 500; opacity: .8; }
.dupr-box { display: flex; flex-direction: column; gap: 8px; }
.dupr-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.dupr-form { display: flex; gap: 8px; align-items: stretch; }

// ERROR_REPORT_URL set (docs/ops.md). No query string or club data is sent. At most 5 per page load.
(function () {
  var left = 5;
  function send(o) {
    if (left-- <= 0) return;
    try { o.page = location.pathname; fetch('/api/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o), keepalive: true }).catch(function () {}); } catch (e) {}
  }
  window.addEventListener('error', function (e) { send({ message: e.message, source: e.filename, line: e.lineno, col: e.colno, stack: e.error && e.error.stack }); });

})();

    const doubles = s.cfg.mode === 'doubles';
    s.rallies++;
    if (s.cfg.scoring === 'rally') {
      s.score[w]++;
      if (w === s.serving) { if (doubles) s.right[w] = 1 - s.right[w]; }
      else { s.serving = w; s.server = doubles ? s.right[w] : 0; }
    } else if (w === s.serving) {
      s.score[w]++;
      if (doubles) s.right[w] = 1 - s.right[w]; // server moves to the other side and serves again
    } else if (doubles && s.serverNum === 1) {
      s.serverNum = 2; s.server = 1 - s.server; // partner serves from where they stand
    } else {
      s.serving = 1 - s.serving; s.serverNum = 1;
      s.server = doubles ? s.right[s.serving] : 0; // side out: player on the right serves first
    }
    const hi = Math.max(s.score[0], s.score[1]);
    if (!s.switched && hi >= switchAt(s.cfg.target)) { s.switched = true; s.justSwitched = true; }
    for (const t of [0, 1]) {
      if (s.score[t] >= s.cfg.target && s.score[t] - s.score[1 - t] >= s.cfg.winBy) { s.winner = t; s.endedAt = Date.now(); }
    }
    return s;
  }
  function call(s) {
    const a = s.score[s.serving], b = s.score[1 - s.serving];
    if (s.cfg.mode === 'doubles' && s.cfg.scoring === 'sideout') return [a, b, s.serverNum];
    return [a, b];
  }
  function serverSide(s) {
    if (s.cfg.mode === 'doubles') return s.server === s.right[s.serving] ? 'right' : 'left';
    return s.score[s.serving] % 2 === 0 ? 'right' : 'left';
  }
  return { newGame, rally, call, serverSide, switchAt };
})();

/* Dink Rating: our own performance rating, inspired by how DUPR is publicly described.
   - Scale 2.00 to 8.00. New players start at 2.00. Doubles and singles are rated separately.
   - A team's rating is the average of its players.
   - Each game has an expected share of points: share = 1 / (1 + 10^(-gap / 2.8)).
     A 0.50 rating gap expects roughly 11-7.
   - After the game: change = K x (actual share - expected share). Beat the forecast and you go up, even in a loss.
   - K shrinks as reliability grows: K = 0.06 + 0.24 x (1 - reliability).
   - Reliability = min(1, games / 20), fading after 30 days without a game (never below 40% of its value).
   Ratings are always recomputed by replaying saved games in order, so deleting a game corrects everything after it. */
const DR = (() => {
  const START = 2, MIN = 2, MAX = 8, SCALE = 2.8, FULL = 20;
  const DAY = 864e5;
  const key = n => String(n).trim().toLowerCase();
  const expShare = gap => 1 / (1 + Math.pow(10, -gap / SCALE));
  function reliability(p, now) {
    if (!p || !p.games) return 0;
    const volume = Math.min(1, p.games / FULL);
    const days = (now - p.last) / DAY;
    const recency = days <= 30 ? 1 : Math.max(0.4, 1 - (days - 30) / 180);
    return volume * recency;
  }
  const kFactor = rel => 0.06 + 0.24 * (1 - rel);
  const clamp = r => Math.min(MAX, Math.max(MIN, r));
  function compute(games) {
    const tables = { doubles: new Map(), singles: new Map() };
    const changes = {};
    const sorted = [...games].sort((a, b) => a.endedAt - b.endedAt);
    for (const g of sorted) {
      const tot = g.score[0] + g.score[1];
      if (!tot) continue;
      const T = tables[g.mode === 'singles' ? 'singles' : 'doubles'];
      const get = n => {
        const k = key(n);
        if (!T.has(k)) T.set(k, { name: String(n).trim(), rating: START, games: 0, wins: 0, last: g.endedAt, delta: 0 });
        return T.get(k);
      };
      const teams = g.teams.map(t => t.map(get));
      const tr = teams.map(t => t.reduce((s, p) => s + p.rating, 0) / t.length);
      const pA = expShare(tr[0] - tr[1]);
      const sA = g.score[0] / tot;
      const list = [];
      const updates = [];
      teams.forEach((t, ti) => {
        const surprise = ti === 0 ? sA - pA : pA - sA;
        t.forEach(p => {
          const rel = reliability(p, g.endedAt);
          updates.push([p, clamp(p.rating + kFactor(rel) * surprise), ti]);
        });
      });
      // apply after computing, so partners and opponents all use pre-game ratings
      for (const [p, next, ti] of updates) {
        const before = p.rating;
        p.rating = next; p.delta = next - before; p.games++; p.last = g.endedAt;
        if (g.winner === ti) p.wins++;
        list.push({ name: p.name, team: ti, before, after: next });
      }
      changes[g.id] = { expected: pA, list };
    }
    return { tables, changes };
  }
  function lookup(tables, mode, name) {
    return tables[mode === 'singles' ? 'singles' : 'doubles'].get(key(name)) || null;
  }
  function forecast(tables, mode, teams, target) {
    const tr = teams.map(t => t.reduce((s, n) => s + ((lookup(tables, mode, n) || {}).rating ?? START), 0) / t.length);
    const pA = expShare(tr[0] - tr[1]);
    const fav = pA >= 0.5 ? 0 : 1;
    const pf = fav === 0 ? pA : 1 - pA;
    const loser = Math.min(target - 1, Math.round(target * (1 - pf) / pf));
    return { pA, fav, score: fav === 0 ? [target, loser] : [loser, target], ratings: tr };
  }
  return { compute, forecast, lookup, reliability, expShare, START };
})();

/* Dinks: earned per player per game. Must match computeDinks() in api/_dinks.js, which is what counts when buying.
   Live-scored games sent from a player's own linked phone (or the club creator's): +2 play, +10 win, +3 beat the
   forecast, +5 per win from the 3rd in a row. The server records who sent each game (scoredBy) and when (receivedAt).
   Logged results earn the same as live ones. At most 60 per player per UTC day. */
const DK = (() => {
  const EARN = { play: 2, win: 10, beatForecast: 3, streak: 5, streakFrom: 3, dailyCap: 120 };
  function compute(games) {
    const sorted = [...games].sort((a, b) => a.endedAt - b.endedAt);
    const { changes } = DR.compute(sorted);
    const people = new Map(), streaks = new Map(), daily = new Map();
    for (const g of sorted) {
      const day = new Date(g.receivedAt || g.endedAt).toISOString().slice(0, 10); // server receive time, not the claimed finish time
      for (const t of [0, 1]) {
        const won = g.winner === t;
        const tot = g.score[0] + g.score[1];
        const share = tot ? g.score[t] / tot : 0;
        const expected = changes[g.id] ? (t === 0 ? changes[g.id].expected : 1 - changes[g.id].expected) : 0.5;
        for (const raw of g.teams[t]) {
          const name = String(raw).trim();
          if (!name || /^Player \d+$/.test(name)) continue;
          const k = name.toLowerCase();
          let n = EARN.play;
          if (g.scoredBy) { // sent from a linked player's phone (or the club creator's), as the server recorded; logged or live
            const s = won ? (streaks.get(k) || 0) + 1 : 0;
            streaks.set(k, s);
            if (won) n += EARN.win;
            if (share > expected) n += EARN.beatForecast;
            if (won && s >= EARN.streakFrom) n += EARN.streak;
          }
          if (!daily.has(k)) daily.set(k, new Map());
          const used = daily.get(k).get(day) || 0;
          n = Math.max(0, Math.min(n, EARN.dailyCap - used));
          daily.get(k).set(day, used + n);
          const e = people.get(k) || { name, earned: 0, games: {} };
          e.earned += n; e.games[g.id] = n;
          people.set(k, e);
        }
      }
    }
    return people;
  }
  return { compute, EARN };
})();
/*ENGINE-END*/
</script>

<script id="bracketview">
/*BRACKETVIEW-START*/
// Draws event brackets and pool tables. Pure: data in (an event as the API's view() or publicView() returns it), HTML or
// numbers out, so the app and the public bracket page share it and test/bracketview.test.js can run it without a browser.
const BK = (() => {
  const CW = 240, CH = 112, GX = 48, ROW = 128, HEAD = 36, SECT = 40; // card, gap between rounds, row pitch, header and section space (logical px)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TEAM = ['var(--blue)', 'var(--green)'];
  // Team names and logos (from a sheet import): ev.teamInfo is [{ players: [a, b], name, logo }]. A team is found by its
  // players, whichever way round they are listed. Without a name a team is shown as its players, as before.
  const tkey = t => t.slice().sort().join('|');
  const TI = new WeakMap();
  const infoOf = (ev, t) => {
    const l = ev && ev.teamInfo;
    if (!t || !l || !l.length) return null;
    let m = TI.get(l);
    if (!m) { m = new Map(l.map(i => [tkey(i.players || []), i])); TI.set(l, m); }
    return m.get(tkey(t)) || null;
  };
  const teamName = (ev, t) => { if (!t) return ''; const i = infoOf(ev, t); return (i && i.name) || t.join(' & '); };
  const initials = s => { const w = String(s || '').split(/\s+/).filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '?').slice(0, 2)).toUpperCase(); };
  // The logo is the viewer's browser loading the organizer's https link (never fetched by the server). If it fails, the
  // initials show instead: the page's error listener (watchLogos) marks the box, because inline handlers are not allowed.
  const logoHTML = (ev, t, big) => {
    const i = infoOf(ev, t), u = i && i.logo;
    return u ? `<span class="tlogo${big ? ' big' : ''}" aria-hidden="true"><img src="${esc(u)}" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async"><span class="tl-i">${esc(initials(teamName(ev, t)))}</span></span>` : '';
  };
  const logoOfUrl = (u, label) => (u ? `<span class="tlogo" aria-hidden="true"><img src="${esc(u)}" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async"><span class="tl-i">${esc(initials(label))}</span></span>` : '');
  let watching = false;
  function watchLogos() {
    if (watching || typeof document === 'undefined') return;
    watching = true;
    document.addEventListener('error', e => { const el = e.target; if (el && el.tagName === 'IMG' && el.parentNode && el.parentNode.classList && el.parentNode.classList.contains('tlogo')) el.parentNode.classList.add('bad'); }, true);
  }
  const CHECK = '<svg class="bk-ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // Where everything goes. tree is event.tree: { kind, rounds: [{key, title}] (the rounds worth showing), matches: [...] }.
  // One column per round; a match sits halfway between the two matches that feed it. Double elimination stacks the
  // losers bracket under the winners bracket and puts the grand final to the right of both.
  function layout(tree) {
    const byId = new Map(tree.matches.map(m => [m.id, m]));
    const keyOf = m => m.stage + m.round;
    const visible = new Set(tree.rounds.map(r => r.key));
    const title = new Map(tree.rounds.map(r => [r.key, r.title]));
    const shown = m => visible.has(keyOf(m)) && !(m.slots[0] === -1 && m.slots[1] === -1); // two byes make no match
    const double = tree.kind === 'double';
    const col = {}, count = { W: 0, L: 0 };
    for (const r of tree.rounds) if (r.key[0] !== 'F') col[r.key] = count[r.key[0]]++;
    const f2 = visible.has('F2');
    const base = Math.max(count.W, count.L);
    if (double) { col.F1 = base; if (f2) col.F2 = base + 1; }
    const champCol = base + (double ? (f2 ? 2 : 1) : 0);
    const X = c => c * (CW + GX);

    // A match's vertical centre inside its own section: round r doubles the spacing, and so does every second losers round.
    const yc = m => (m.pos + 0.5) * ROW * 2 ** ((m.stage === 'L' ? Math.ceil(m.round / 2) : m.round) - 1);
    const sec = { W: [], L: [] };
    for (const m of tree.matches) if (m.stage !== 'F' && shown(m)) sec[m.stage].push(m);
    const span = list => (list.length ? [Math.min.apply(null, list.map(m => yc(m) - CH / 2)), Math.max.apply(null, list.map(m => yc(m) + CH / 2))] : [0, 0]);
    const [wMin, wMax] = span(sec.W), [lMin] = span(sec.L);
    const wOff = HEAD - wMin;
    const lHead = HEAD + (wMax - wMin) + SECT;
    const lOff = lHead + HEAD - lMin;
    const yOf = m => yc(m) + (m.stage === 'L' ? lOff : wOff);

    const nodes = [], headers = [], links = [], snaps = [];
    const at = new Map();
    const place = (m, c, y) => { const n = { id: m.id, kind: 'match', m, col: c, x: X(c), y: y - CH / 2, w: CW, h: CH }; nodes.push(n); at.set(m.id, n); return n; };
    for (const m of tree.matches) if (m.stage !== 'F' && shown(m)) place(m, col[keyOf(m)], yOf(m));
    const centre = n => n.y + CH / 2;
    const feeders = tree.matches.filter(m => m.winnerTo === 'F1' && at.has(m.id));
    const fy = feeders.length ? feeders.reduce((s, m) => s + centre(at.get(m.id)), 0) / feeders.length : HEAD + CH / 2;
    if (double) for (const m of tree.matches) if (m.stage === 'F' && shown(m)) place(m, col[keyOf(m)], fy);
    // The single elimination final has nowhere to go but the champion.
    const final = double ? null : tree.matches.find(m => m.stage === 'W' && !m.winnerTo && at.has(m.id));
    const champY = double ? fy : final ? centre(at.get(final.id)) : HEAD + CH / 2;
    const champion = { id: 'champion', kind: 'champion', col: champCol, x: X(champCol), y: champY - CH / 2, w: CW, h: CH };
    nodes.push(champion);

    for (const r of tree.rounds) {
      const st = r.key[0], first = nodes.find(n => n.kind === 'match' && keyOf(n.m) === r.key);
      const y = st === 'W' ? 0 : st === 'L' ? lHead : Math.max(0, (first ? first.y : champY - CH / 2) - HEAD);
      headers.push({ key: r.key, title: r.title, x: X(col[r.key]), y, w: CW });
    }
    headers.push({ key: 'champion', title: 'Champion', x: X(champCol), y: Math.max(0, champY - CH / 2 - HEAD), w: CW });
    for (let c = 0; c <= champCol; c++) snaps.push(X(c));

    // Skips matches that are not drawn (two byes, or a whole round of byes) to the next one that is.
    const next = id => { let t = id && byId.get(id); while (t && !at.has(t.id)) t = t.winnerTo ? byId.get(t.winnerTo) : null; return t || null; };
    const link = (a, b) => {
      const x1 = a.x + CW, y1 = centre(a), x2 = b.x, y2 = centre(b);
      const xm = b.col - a.col > 1 ? x2 - GX / 2 : x1 + GX / 2;
      const done = !!a.m && (a.m.status === 'done' || a.m.status === 'bye');
      links.push({ from: a.id, to: b.id, done, d: y1 === y2 ? `M${x1} ${y1}H${x2}` : `M${x1} ${y1}H${xm}V${y2}H${x2}` });
    };
    for (const n of nodes) {
      if (n.kind !== 'match') continue;
      const m = n.m;
      let target = null, winTitle;
      if (m.id === 'F1') { const t = at.get('F2'); target = t || champion; winTitle = t ? 'Champion or reset' : 'Champion'; }
      else if (m.id === 'F2' || m === final) { target = champion; winTitle = 'Champion'; }
      else { const t = next(m.winnerTo); target = t ? at.get(t.id) : null; winTitle = t ? title.get(keyOf(t)) : 'Champion'; }
      const lt = m.loserTo ? next(m.loserTo) : null;
      n.feed = { win: winTitle, lose: lt ? title.get(keyOf(lt)) : m.stage === 'F' ? null : 'out' };
      if (target) link(n, target);
    }
    const width = X(champCol) + CW;
    const height = Math.max.apply(null, nodes.map(n => n.y + n.h)) + 6;
    return { width, height, nodes, headers, links, snaps, double };
  }

  // How big to draw a layout of w x h logical px in cw x ch px. Returns the scale and whether to scroll instead of fit.
  // Text is never drawn smaller than 93% of its design size (13px at the smallest), so a bracket too wide for that scrolls.
  // A TV (tv: true) fits both width and height and may grow the text a lot; max caps the growth.
  function scale({ cw, ch, w, h, tv = false, max = 1.35 }) {
    const fit = cw / w;
    if (tv) {
      let s = ch ? Math.min(fit, ch / h) : fit;
      if (s < 0.7) s = fit; // too tall for one screen: fit the width and let the page scroll
      return s < 0.55 ? { s: 1, scroll: true } : { s: Math.min(s, max), scroll: false };
    }
    return fit < 0.93 ? { s: 1, scroll: true } : { s: Math.min(fit, max), scroll: false };
  }

  const scoreText = s => `${s[0]} to ${s[1]}`;
  function describe(n, o) {
    const m = n.m, sc = o.scoreOf ? o.scoreOf(m) : m.score;
    const ev = o.ev, nm = t => { const i = infoOf(ev, t); return teamName(ev, t) + (i && i.name ? ` (${t.join(' and ')})` : ''); };
    const side = t => (m.slots[t] === -1 ? 'a bye' : nm(m.teams[t]) || 'to be decided');
    const win = sc ? (sc[0] > sc[1] ? 0 : 1) : m.status === 'bye' ? m.winner : null;
    const title = (o.titleOf && o.titleOf(m)) || '';
    let state;
    if (m.status === 'bye') state = `${teamName(ev, m.teams[win])} has a bye and moves on`;
    else if (sc) state = `Final, ${scoreText(sc)}. ${teamName(ev, m.teams[win])} won`;
    else if (m.ready) state = m.court ? `Ready to play on court ${m.court}` : 'Ready to play, waiting for a court';
    else state = m.id === 'F2' ? 'Only played if the losers bracket team wins the grand final' : 'Waiting for earlier matches';
    const f = n.feed;
    const feed = f ? `. Winner goes to ${f.win}${f.lose && f.lose !== 'out' ? `, loser to ${f.lose}` : f.lose === 'out' ? ', loser is out' : ''}` : '';
    return `${title ? title + ': ' : ''}${side(0)} versus ${side(1)}. ${state}${feed}`;
  }

  function cardHTML(n, o) {
    const m = n.m, sc = o.scoreOf ? o.scoreOf(m) : m.score;
    const saving = !!(o.saving && o.saving(m));
    const bye = m.status === 'bye';
    const win = sc ? (sc[0] > sc[1] ? 0 : 1) : bye ? m.winner : null;
    const row = t => {
      const isBye = m.slots[t] === -1, tbd = !isBye && !m.teams[t];
      const label = isBye ? 'Bye' : tbd ? 'To be decided' : teamName(o.ev, m.teams[t]);
      const won = win === t && !bye;
      return `<span class="bk-row${won ? ' win' : ''}${tbd ? ' tbd' : ''}" style="--c:${TEAM[t]}"><span class="bk-name">${isBye || tbd ? '' : logoHTML(o.ev, m.teams[t])}${esc(label)}${won ? '<span class="vh">, winner</span>' : ''}</span>${won ? CHECK : '<span></span>'}<span class="bk-pts">${sc ? sc[t] : ''}</span></span>`;
    };
    const st = bye ? 'Bye, moves on' : saving ? 'Saving…' : sc ? 'Final' : m.ready ? `<b>Up next${m.court ? ` · Court ${m.court}` : ''}</b>` : m.id === 'F2' ? 'Only if the losers team wins' : 'Waiting for earlier matches';
    const f = n.feed, short = t => esc(String(t).replace(/^(Winners|Losers) round (\d+)$/, '$1 $2')); // the full name stays in the label
    const feed = f ? `<span class="bk-feed"><span><span class="vh">Winner goes to </span>→ ${short(f.win)}</span>${f.lose && f.lose !== 'out' ? `<span><span class="vh">Loser goes to </span>↓ ${short(f.lose)}</span>` : f.lose === 'out' ? '<span>Loser out</span>' : ''}</span>` : '';
    const inner = `<span class="bk-st"><span>${st}</span></span>${row(0)}${row(1)}${feed}`;
    const label = esc(describe(n, o));
    const cls = `bk-card${m.ready && !sc ? ' up' : ''}${bye ? ' bye' : ''}`;
    const style = `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
    if (o.interactive && !bye) return `<li style="${style}"><button type="button" class="${cls}" data-ev="pick" data-m="${esc(m.id)}" aria-pressed="${o.sel === m.id}" aria-label="${label}">${inner}</button></li>`;
    return `<li style="${style}"><div class="${cls}" role="group" aria-label="${label}">${inner}</div></li>`;
  }
  function champHTML(n, ev) {
    const c = ev.champion;
    const style = `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
    return `<li style="${style}"><div class="bk-champ${c ? ' won' : ''}" role="group" aria-label="${c ? 'Champions: ' + esc(teamName(ev, c)) : 'Champion, to be decided'}">${c ? (logoHTML(ev, c, true) || '<span class="ball"></span>') : ''}<span><small>${c ? 'Champions' : 'Champion'}</small><b>${c ? esc(teamName(ev, c)) : 'To be decided'}</b></span></div></li>`;
  }

  // The scrollable, scalable bracket. opts: interactive (cards are buttons), sel (selected match id), scoreOf(m), saving(m).
  function bracketHTML(ev, opts = {}) {
    const L = layout(ev.tree);
    const o = Object.assign({}, opts, { ev, titleOf: m => (ev.tree.rounds.find(r => r.key === m.stage + m.round) || {}).title });
    const groups = L.headers.map(h => {
      const items = L.nodes.filter(n => (h.key === 'champion' ? n.kind === 'champion' : n.kind === 'match' && n.m.stage + n.m.round === h.key));
      const id = `bk-${h.key}`;
      return `<div role="group" aria-labelledby="${id}"><h3 class="bk-head" id="${id}" style="left:${h.x}px;top:${h.y}px;width:${h.w}px">${esc(h.title)}</h3><ol class="bk-col">${items.map(n => (n.kind === 'champion' ? champHTML(n, ev) : cardHTML(n, o))).join('')}</ol></div>`;
    }).join('');
    const paths = L.links.map(l => `<path class="${l.done ? '' : 'todo'}" d="${l.d}"/>`).join('');
    const snaps = L.snaps.map(x => `<i class="bk-snap" style="left:${x}px" aria-hidden="true"></i>`).join('');
    return `<div class="bk-host"><p class="bk-hint">Swipe or scroll sideways to move between rounds.</p>
      <div class="bk-scroll" tabindex="0" role="region" aria-label="${esc(ev.tree.kind === 'double' ? 'Double elimination bracket' : 'Bracket')}, one column per round" data-bk-w="${L.width}" data-bk-h="${L.height}">
      <div class="bk-fit" style="width:${L.width}px;height:${L.height}px"><div class="bk-canvas" style="width:${L.width}px;height:${L.height}px">
      <svg class="bk-links" width="${L.width}" height="${L.height}" viewBox="0 0 ${L.width} ${L.height}" aria-hidden="true">${paths}</svg>${snaps}${groups}</div></div></div></div>`;
  }

  // Sizes every bracket under root to its container. Call after rendering and when the window resizes.
  function fitAll(root, { tv = false, max } = {}) {
    for (const el of root.querySelectorAll('.bk-scroll')) {

<script>
// Club display mode: /?display=CODE turns the page into a full-screen join sign for a TV or
// monitor at the courts. The QR code is the club's invite link (/?club=CODE), drawn with the
// qrcode-generator library above (MIT License, (c) Kazuhiko Arase). The club name comes from
// the same club lookup the invite flow uses, and is refreshed every 5 minutes.
(function () {
  var code = (new URLSearchParams(location.search).get('display') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!code) return;
  var el = document.getElementById('club-display');
  if (!el) return;
  document.documentElement.classList.add('dsp-lock');
  el.hidden = false;
  var link = location.origin + '/?club=' + code;
  document.getElementById('dsp-code').textContent = code;
  document.getElementById('dsp-exit').href = link;
  try {
    var qr = qrcode(0, 'M');
    qr.addData(link);
    qr.make();
    document.getElementById('dsp-qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 12, scalable: true });
  } catch (e) { document.getElementById('dsp-qr').style.display = 'none'; }
  var nameEl = document.getElementById('dsp-name');
  var named = false;
  function loadName() {
    fetch('/api/club?code=' + code, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.club && d.club.name) { named = true; nameEl.textContent = d.club.name; }
        else if (!named) nameEl.textContent = 'Join our club';
      })
      .catch(function () { if (!named) nameEl.textContent = 'Join our club'; });
  }
  loadName();
  setInterval(loadName, 5 * 60 * 1000);
})();
</script>

const Move = {
  ALPHA: 'ABCDEFGHJKMNPQRSTUVWXYZ23456789',
  newCode() {
    let out = '';
    while (out.length < 12) for (const b of crypto.getRandomValues(new Uint8Array(24))) if (b < 248 && out.length < 12) out += Move.ALPHA[b % 31];

  clean(raw) { const c = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return c.length === 12 && [...c].every(ch => Move.ALPHA.includes(ch)) ? c : ''; },
  async bits(code, salt) {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', iterations: 100000, salt: new TextEncoder().encode(salt) }, k, 256));
  },
  async id(raw) { return [...await Move.bits(Move.clean(raw), 'dink-move-id')].map(b => b.toString(16).padStart(2, '0')).join(''); },
  async key(code) { return crypto.subtle.importKey('raw', await Move.bits(code, 'dink-move-key'), 'AES-GCM', false, ['encrypt', 'decrypt']); },
  async seal(raw, payload) {
    const code = Move.clean(raw), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await Move.key(code), new TextEncoder().encode(JSON.stringify(payload))));

    return JSON.parse(new TextDecoder().decode(pt));
  },

  pack(clubs, me, owners, pins) {
    return { v: 1, clubs: clubs.map(c => ({ code: c.code, name: c.name, me: me[c.code] || null, owner: owners[c.code] || null, pin: pins[c.code] || null })) };
  },
  // Folds a received bundle into this phone's own records. Anything this phone already has for a club is kept. Returns how many clubs were added.
  merge(payload, clubs, me, owners, pins) {
    if (!payload || payload.v !== 1 || !Array.isArray(payload.clubs)) throw new Error('That transfer was not valid.');
    let added = 0;
    for (const c of payload.clubs.slice(0, 50)) {

function opLabel(o) {

}

    <button class="btn btn-soft" data-fail="export">Export as a file</button></div>`;

function failAct(kind, uid, el) {
  const op = outbox.find(o => o.uid === uid);
  if (kind === 'export') {
    const url = URL.createObjectURL(new Blob([Outbox.exportJson(failedOps(), club.code)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `dink-score-unsent-${club.code}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    return;
  }
  if (!op) return;
  if (kind === 'discard') { if (!confirm('Discard this change for good? It will not be sent to the club.')) return; outbox.splice(outbox.indexOf(op), 1); }
  else if (kind === 'save') {
    const row = el.closest('li'), v = [...row.querySelectorAll('[data-fs]')].map(i => i.value);
    if (!Outbox.rescore(op, v[0], v[1])) { showToast('Enter the two scores as whole numbers.', false); return; }
  } else { Outbox.retry(op); if (Outbox.pinOp(op) && pins[op.code]) op.pin = pins[op.code]; }
  store.set('pb.outbox', outbox); renderClub(); updateSyncPill(); flush();
}

async function clubJoinByCode(raw) {
  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6) { clubSheet.error = 'Club codes are 6 letters and numbers.'; renderClub(); return; }
  clubSheet.busy = true; clubSheet.error = ''; renderClub();
  try {
    const data = await api('club?code=' + code);
    await joinClub(data.club.code, data.club.name);
    clubSheet = { view: 'club' };
    showToast(`Joined ${data.club.name}`, false);
  } catch (err) { clubSheet.busy = false; clubSheet.error = err.message; }
  afterJoin();
}
// After joining: first "Who are you?", then on to whatever brought them here (logging a result, starting a game).
function afterJoin() {
  if (club && !myName() && !whoamiSkipped()) { clubSheet = { view: 'whoami', afterJoin: true }; render(); renderClub(); return; }
  if (club && saveAfterJoin) { const ids = saveAfterJoin; saveAfterJoin = null; clubSheet = { view: 'club', msg: 'Adding your game…' }; render(); renderClub(); uploadLocalGames(ids); return; }
  render(); renderClub();

async function clubCreate(name, pin) {
  name = String(name || '').trim();
  pin = String(pin || '').trim();
  if (!name) { clubSheet.error = 'Give your club a name.'; renderClub(); return; }
  if (pin && !/^\d{4,8}$/.test(pin)) { clubSheet.error = 'Organizer PINs are 4 to 8 digits. Leave it blank and we will make a code for you.'; renderClub(); return; }
  clubSheet.busy = true; clubSheet.error = ''; renderClub();
  try {
    const data = await api('club', { method: 'POST', body: JSON.stringify(pin ? { name, pin } : { name }) });
    rememberOwner(data.club.code, data.ownerToken);
    rememberPin(data.club.code, pin || data.organizerCode);
    await joinClub(data.club.code, data.club.name);
    clubSheet = { view: 'club', ...(data.organizerCode ? { newOrganizerCode: data.organizerCode } : {}) };
  } catch (err) { clubSheet.busy = false; clubSheet.error = err.message; }
  afterJoin();
}
// Invite links look like /?club=ABC123
async function checkInvite() {
  if (!API_OK) return;
  // A scanned transfer QR carries the code in the address fragment, which never reaches the server.
  const mv = /^#move=([A-Za-z0-9-]+)$/.exec(location.hash);
  if (mv) { history.replaceState(null, '', location.pathname + location.search); clubSheet = { view: 'move-in', moveCode: mv[1] }; renderClub(); return; }
  const params = new URLSearchParams(location.search);
  const code = ShareLink.fromSearch(location.search);
  if (!code) return;
  try { history.replaceState(null, '', location.pathname); } catch {}
  if (club && club.code === code) return;
  try {
    const data = await api('club?code=' + code);
    clubSheet = { view: 'invite', joinCode: code, joinName: data.club.name };
  } catch (err) { clubSheet = { view: 'club', joinCode: code, error: err.message }; }
  renderClub();
}

function homeTiles(games) {
  const tiles = [];
  if (live && live.state.winner === null) {

    tiles.push(`<div class="tile live wide"><span class="t-k">Paused game</span><span class="t-big">${s.score[0]}–${s.score[1]}</span>

  }
  const top = leaderStats(games, setup.mode)[0];
  tiles.push(`<button class="tile" data-tab-go="leaders"><span class="t-k">Top ${setup.mode === 'singles' ? 'singles' : 'doubles'} player</span>
    ${top ? `<span class="t-name">${esc(top.name)}</span><span class="t-big">${r2(top.rating)}</span>` : `<span class="t-name">No ratings yet</span><span class="t-foot">Save a game with named players</span>`}</button>`);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Array.from({ length: 7 }, (_, i) => new Date(today.getTime() - (6 - i) * DAY));
  const counts = days.map(d => games.filter(g => g.endedAt >= d.getTime() && g.endedAt < d.getTime() + DAY).length);
  const max = Math.max(1, ...counts);
  const total = counts.reduce((a, b) => a + b, 0);
  tiles.push(`<div class="tile wide" style="min-height:0"><div class="sec-head"><span class="t-k">This week</span><span class="t-k">${total} game${total === 1 ? '' : 's'}</span></div>

  return `<section class="tiles">${tiles.join('')}</section>${challengesCard()}${monthCard(games)}`;
}

// "This month" on the home screen: the club's (or this phone's) games since the 1st of the month.
function monthCard(games) {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const month = now.toLocaleDateString(undefined, { month: 'long' });
  const mine = games.filter(g => g.endedAt >= start);
  const title = club ? `${esc(club.name)} in ${esc(month)}` : `This month`;
  if (!mine.length) return `<section class="card month"><div class="sec-head"><h3>${title}</h3></div><p class="note">No games yet in ${esc(month)}. Finished and logged games will show up here.</p></section>`;
  const players = new Map();
  let points = 0;
  for (const g of mine) {
    points += Number(g.score[0]) + Number(g.score[1]);
    for (const t of [0, 1]) for (const n of g.teams[t]) {
      if (isDefaultName(n)) continue;
      const k = n.trim().toLowerCase();
      const e = players.get(k) || { name: n.trim(), g: 0, w: 0 };
      e.g++; if (g.winner === t) e.w++;
      players.set(k, e);
    }
  }
  const list = [...players.values()];
  const active = [...list].sort((a, b) => b.g - a.g || b.w - a.w)[0];
  const winner = [...list].sort((a, b) => b.w - a.w || a.g - b.g)[0];
  const margin = g => Math.abs(Number(g.score[0]) - Number(g.score[1]));
  const biggest = [...mine].sort((a, b) => margin(b) - margin(a) || b.endedAt - a.endedAt)[0];
  const closest = [...mine].sort((a, b) => margin(a) - margin(b) || Math.max(...b.score) - Math.max(...a.score))[0];
  const who = n => `<button class="pl-link" data-player="${esc(n)}">${esc(n)}</button>`;
  const res = g => { const w = g.winner, l = 1 - w; return `${esc(teamLabel(g.teams[w]))} ${Number(g.score[w])}–${Number(g.score[l])}`; };
  const facts = [
    active ? `<li><span class="mk">Most active</span><span class="mv">${who(active.name)}, ${active.g} game${active.g === 1 ? '' : 's'}</span></li>` : '',
    winner && winner.w ? `<li><span class="mk">Most wins</span><span class="mv">${who(winner.name)}, ${winner.w} win${winner.w === 1 ? '' : 's'}</span></li>` : '',
    `<li><span class="mk">Biggest win</span><span class="mv">${res(biggest)}</span></li>`,
    mine.length > 1 ? `<li><span class="mk">Closest game</span><span class="mv">${res(closest)}</span></li>` : ''
  ].join('');
  return `<section class="card month"><div class="sec-head"><h3>${title}</h3>${club ? '' : '<span class="note">On this phone</span>'}</div>
    <div class="month-stats"><div><b>${mine.length}</b><span>Games</span></div><div><b>${list.length}</b><span>Players</span></div><div><b>${points}</b><span>Points</span></div></div>
    <ul class="month-facts">${facts}</ul></section>`;
}

function leaderStats(games, mode) {
  const { tables } = DR.compute(games);
  const now = Date.now();
  const extra = new Map();
  for (const g of [...games].sort((a, b) => a.endedAt - b.endedAt)) {
    if ((g.mode === 'singles' ? 'singles' : 'doubles') !== mode) continue;
    for (const t of [0, 1]) for (const n of g.teams[t]) {
      const k = n.trim().toLowerCase();
      const e = extra.get(k) || { streak: 0, best: 0, diff: 0 };
      e.streak = g.winner === t ? e.streak + 1 : 0; e.best = Math.max(e.best, e.streak);
      e.diff += g.score[t] - g.score[1 - t];
      extra.set(k, e);
    }
  }
  return [...tables[mode].values()].filter(p => !isDefaultName(p.name)).map(p => {
    const e = extra.get(p.name.toLowerCase()) || { streak: 0, best: 0, diff: 0 };
    return Object.assign({}, p, e, { rel: Math.round(DR.reliability(p, now) * 100) });
  }).sort((a, b) => b.rating - a.rating);
}

async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}

// Would winning the next rally end the game for team t?
function isGamePoint(s, t) {
  if (s.winner !== null) return false;
  if (s.cfg.scoring !== 'rally' && s.serving !== t) return false; // side-out: only the serving side can score
  const next = s.score[t] + 1;
  return next >= s.cfg.target && next - s.score[1 - t] >= s.cfg.winBy;
}

  const serverName = cfg.teams[s.serving][s.server];

    const pct = Math.min(100, Math.round(100 * s.score[t] / cfg.target));
    return `<button class="half ${serving ? '' : 'idle'}" data-k="${k}" data-rally="${t}" aria-label="${esc(teamLabel(cfg.teams[t]))} won the rally. Their score is ${s.score[t]}${serving ? ', serving' : ''}">
      <span class="glow"></span>

  };
  let sheet = '';

      <div class="sheet-head"><h2 class="winner-line" id="win-h">${esc(teamLabel(cfg.teams[w]))} ${cfg.teams[w].length > 1 ? 'win' : 'wins'}</h2><button class="btn btn-ball share-pill" data-act="share-live">${ICON.share}Share</button></div>
      ${resultBlock(cfg.teams, s.score, w)}

      ${ratingPreview(s)}
      ${dinksPreview(s)}
      ${API_OK && !club && !live.event ? '<p class="note">No club yet, so this game is saved on this phone.</p>' : ''}
      <div class="btns">${live.event ? '' : '<button class="btn btn-ball" data-act="rematch">Save and rematch</button>'}
        <button class="btn ${live.event ? 'btn-ball' : 'btn-ink'}" data-act="finish">${live.event ? 'Save result' : 'Save and finish'}</button>
        ${API_OK && !club && !live.event ? '<button class="btn btn-blue" data-act="finish-club">Save to a club</button>' : ''}
        <button class="btn btn-soft" data-act="undo">Undo last rally</button></div></div></div>`;
  } else if (live.confirmEnd) {

  }
