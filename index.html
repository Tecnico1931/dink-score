function seasonRows(mode) {
  const info = progressInfo();

  const s = info.season;
  const games = ratedGames().filter(g => g.scoredBy && (g.receivedAt || g.endedAt) >= s.start && (g.receivedAt || g.endedAt) < s.end && (g.mode === 'singles' ? 'singles' : 'doubles') === mode);
  const { tables } = DR.compute(games);
  return [...tables[mode].values()].filter(p => !isDefaultName(p.name)).sort((a, b) => b.rating - a.rating || b.games - a.games);
}
function pastChampionsHTML(mode) {

// What goes inside an avatar circle. Photos only come back from the server as JPEG or WebP data URLs.
function avatarInner(name, override) {
  const a = override !== undefined ? override : avatarOf(name);
  if (a && a.type === 'photo' && /^data:image\/(jpeg|webp);base64,/.test(a.value)) return `<img class="av-img" src="${esc(a.value)}" alt="">`;
  if (a && a.type === 'emoji') return `<span class="av-emoji">${esc(a.value)}</span>`;
  if (a && a.type === 'icon' && AVATAR_ICONS[a.value]) return `<span class="av-icon">${iconSvg(a.value)}</span>`;
  return esc(initials(name || '?'));
}
// Shrink a photo on the phone to a 160px square JPEG before it's sent.
function photoToAvatar(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('Pick a photo.'));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight), S = 160;
      const c = document.createElement('canvas'); c.width = c.height = S;
      c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
      URL.revokeObjectURL(url);
      let q = 0.82, out = c.toDataURL('image/jpeg', q);
      while (out.length > 55000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That photo couldn't be opened. Try a different one.")); };
    img.src = url;
  });
}

function boardClick(ds) {

  const d = new Date(ms);
  const dateStr = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const timeStr = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const diff = Math.round((target - today.getTime()) / DAY);
  const rel = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : diff > 1 && diff <= 14 ? `In ${diff} days` : '';
  return { label: `${dateStr} · ${timeStr}`, rel };
}

function gnPad2(n) { return String(n).padStart(2, '0'); }
function gnDefaultDraft(night) {
  let d;
  if (night && night.startsAt) {
    d = new Date(night.startsAt);
  } else {
    d = new Date();
    d.setDate(d.getDate() + 1);
    d.setHours(18, 30, 0, 0);
  }
  return {
    id: night ? night.id : '',
    title: night ? night.title : '',
    date: `${d.getFullYear()}-${gnPad2(d.getMonth() + 1)}-${gnPad2(d.getDate())}`,
    time: `${gnPad2(d.getHours())}:${gnPad2(d.getMinutes())}`,
    location: night ? (night.location || '') : '',
    cap: night && night.cap != null ? String(night.cap) : '',
    note: night ? (night.note || '') : ''
  };
}

function gnSyncLocalNight(night, removeId) {
  if (clubData) {
    const cur = (clubData.nights || []).slice();
    const id = removeId || (night && night.id);
    const idx = cur.findIndex(x => x.id === id);
    if (removeId || (night && (night.status === 'cancelled' || night.startsAt < Date.now() - GN_GRACE_MS))) {
      if (idx >= 0) cur.splice(idx, 1);
    } else if (night) {
      if (idx >= 0) cur[idx] = night; else cur.push(night);
      cur.sort((a, b) => a.startsAt - b.startsAt || a.id.localeCompare(b.id));
    }
    clubData.nights = cur.slice(0, 10);
    store.set('pb.clubCache', clubData);
  }
  if (clubSheet && Array.isArray(clubSheet.nights)) {
    const list = clubSheet.nights.slice();
    const id = removeId || (night && night.id);
    const idx = list.findIndex(x => x.id === id);
    if (removeId) {
      if (idx >= 0) list.splice(idx, 1);
    } else if (night) {
      if (idx >= 0) list[idx] = night; else list.push(night);
      list.sort((a, b) => a.startsAt - b.startsAt || a.id.localeCompare(b.id));
    }
    clubSheet.nights = list;
  }
}

  return `<div class="gn-rsvp" role="group" aria-label="Your response for ${esc(n.title)}">${opts.map(([st, label, cnt, blocked]) => {
    const sel = mine === st;

}

async function gnOpen(from) {
  if (!club) return;
  clubSheet = { view: 'nights', from: from || null, nights: clubData && clubData.nights ? clubData.nights.slice() : null, pushEnabled: null, loading: true, error: '', msg: '' };
  renderClub();
  await gnLoad();
}

async function gnLoad() {
  const c = clubSheet;
  if (!c || !club) return;
  try {
    const d = await api('club?code=' + encodeURIComponent(club.code) + '&nights=1');
    if (clubSheet !== c) return;
    if (!d.notModified) {
      c.nights = Array.isArray(d.nights) ? d.nights : [];
      c.pushEnabled = d.pushEnabled !== false;
    }
    c.loading = false; c.error = '';
    renderClub();
  } catch (err) {
    if (clubSheet === c) { c.loading = false; c.error = err.message; renderClub(); }
  }
}

async function gnRsvp(id, status) {
  if (!club) return;
  if (!myName() || !myToken()) {
    clubSheet = { view: 'whoami', msg: '' };
    renderClub();
    showToast('Pick your name in the club first to answer.', false);
    announce('Pick your name in the club first to answer.');
    return;
  }
  const all = (clubSheet && clubSheet.nights) || (clubData && clubData.nights) || [];
  const cur = all.find(x => x.id === id);
  const mine = cur ? gnMyStatus(cur) : null;
  if (cur && status === 'in' && cur.cap != null && cur.counts.in >= cur.cap && mine !== 'in') {
    const msg = `This game night is full (${cur.cap}/${cur.cap} In). You can still mark Maybe or Out.`;
    showToast(msg, false);
    announce(msg);
    return;
  }
  const nextStatus = mine === status ? 'none' : status;
  if (clubSheet && clubSheet.view === 'nights') { clubSheet.busy = true; clubSheet.error = ''; clubSheet.msg = ''; renderClub(); }
  try {
    const d = await api('club', {
      method: 'POST',
      body: JSON.stringify({ code: club.code, action: 'night-rsvp', id, status: nextStatus, playerName: myName(), playerToken: myToken() })
    });
    gnSyncLocalNight(d.night);
    const label = nextStatus === 'none' ? 'Response cleared' : `Marked ${{ in: 'In', maybe: 'Maybe', out: 'Out' }[nextStatus]}`;
    const msg = `${label} for ${d.night.title}.`;
    if (clubSheet && clubSheet.view === 'nights') { clubSheet.busy = false; clubSheet.msg = msg; }
    showToast(label, false);
    announce(msg);
    render();
  } catch (err) {
    if (clubSheet && clubSheet.view === 'nights') { clubSheet.busy = false; clubSheet.error = err.message; renderClub(); }
    else showToast(err.message, false);
    announce(err.message);
  }
}

function gnFormOpen(night) {
  const from = clubSheet ? clubSheet.from : null;
  const cachedNights = clubSheet ? clubSheet.nights : null;
  const pushEnabled = clubSheet ? clubSheet.pushEnabled : null;
  clubSheet = { view: 'night-form', from, nights: cachedNights, pushEnabled, draft: gnDefaultDraft(night), editing: !!night, error: '', busy: false };
  renderClub();
  const t = $('#gn-title'); if (t) t.focus();
}

function gnSyncDraftFromDom() {
  if (!clubSheet || clubSheet.view !== 'night-form' || !clubSheet.draft) return;
  const d = clubSheet.draft;
  const val = sel => { const el = $(sel); return el ? el.value : null; };
  for (const [k, sel] of [['title', '#gn-title'], ['date', '#gn-date'], ['time', '#gn-time'], ['location', '#gn-loc'], ['cap', '#gn-cap'], ['note', '#gn-note']]) {
    const v = val(sel); if (v !== null) d[k] = v;
  }
}

async function gnFormSave() {
  if (!clubSheet || clubSheet.view !== 'night-form') return;
  gnSyncDraftFromDom();
  const d = clubSheet.draft;
  const title = String(d.title || '').trim();
  if (!title) { clubSheet.error = 'Give this game night a title.'; renderClub(); announce(clubSheet.error); return; }
  const dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d.date || '').trim());
  const tm = /^(\d{2}):(\d{2})$/.exec(String(d.time || '').trim());
  if (!dm || !tm) { clubSheet.error = 'Pick both a date and a start time.'; renderClub(); announce(clubSheet.error); return; }
  const startsAt = new Date(+dm[1], +dm[2] - 1, +dm[3], +tm[1], +tm[2], 0, 0).getTime();
  if (!Number.isFinite(startsAt)) { clubSheet.error = 'Pick a valid date and time.'; renderClub(); announce(clubSheet.error); return; }
  const capRaw = String(d.cap || '').trim();
  let cap = null;
  if (capRaw !== '') {
    const n = Number(capRaw);
    if (!Number.isInteger(n) || n < 2 || n > 128) { clubSheet.error = 'Player limit must be a whole number from 2 to 128.'; renderClub(); announce(clubSheet.error); return; }
    cap = n;
  }
  clubSheet.busy = true; clubSheet.error = ''; renderClub();
  try {
    const action = clubSheet.editing ? 'night-edit' : 'night-create';
    const payload = Object.assign({
      code: club.code, action,
      ...(clubSheet.editing ? { id: d.id } : {}),
      night: { title, startsAt, location: String(d.location || '').trim(), note: String(d.note || '').trim(), cap },
      ...(clubSheet.editing ? {} : { tz: (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch { return 'UTC'; } })() })
    }, adminCreds());
    const res = await api('club', { method: 'POST', body: JSON.stringify(payload) });
    const saved = res.night;
    const from = clubSheet.from, pushEnabled = clubSheet.pushEnabled, list = clubSheet.nights;
    clubSheet = { view: 'nights', from, nights: Array.isArray(list) ? list : [], pushEnabled, msg: clubSheet.editing ? 'Game night updated.' : 'Game night scheduled.' };
    gnSyncLocalNight(saved);
    announce(clubSheet.msg);
    render();
    gnLoad();
  } catch (err) {
    clubSheet.busy = false; clubSheet.error = err.message; renderClub(); announce(err.message);
  }
}

async function gnCancel(id) {
  if (!clubSheet || clubSheet.view !== 'nights') return;
  if (clubSheet.armedCancel !== id) { clubSheet.armedCancel = id; clubSheet.armedDelete = null; renderClub(); return; }
  clubSheet.busy = true; clubSheet.armedCancel = null; clubSheet.error = ''; clubSheet.msg = ''; renderClub();
  try {
    const res = await api('club', { method: 'POST', body: JSON.stringify(Object.assign({ code: club.code, action: 'night-cancel', id }, adminCreds())) });
    gnSyncLocalNight(res.night);
    clubSheet.busy = false; clubSheet.msg = `${res.night.title} was cancelled.`;
    announce(clubSheet.msg);
    render();
  } catch (err) {
    clubSheet.busy = false; clubSheet.error = err.message; renderClub(); announce(err.message);
  }
}

async function gnDelete(id) {
  if (!clubSheet || clubSheet.view !== 'nights') return;
  if (clubSheet.armedDelete !== id) { clubSheet.armedDelete = id; clubSheet.armedCancel = null; renderClub(); return; }
  clubSheet.busy = true; clubSheet.armedDelete = null; clubSheet.error = ''; clubSheet.msg = ''; renderClub();
  try {
    await api('club', { method: 'POST', body: JSON.stringify(Object.assign({ code: club.code, action: 'night-delete', id }, adminCreds())) });
    gnSyncLocalNight(null, id);
    clubSheet.busy = false; clubSheet.msg = 'Game night removed.';
    announce(clubSheet.msg);
    render();
  } catch (err) {
    clubSheet.busy = false; clubSheet.error = err.message; renderClub(); announce(err.message);
  }
}

function gnRemindOpen(id) {
  if (!clubSheet || clubSheet.view !== 'nights') return;
  const n = (clubSheet.nights || []).find(x => x.id === id);
  if (!n) return;
  clubSheet = {
    view: 'night-remind', from: clubSheet.from, nights: clubSheet.nights, pushEnabled: clubSheet.pushEnabled,
    id, audience: 'all', busy: false, error: '', msg: ''
  };
  renderClub();
}

async function gnRemindSend() {
  if (!clubSheet || clubSheet.view !== 'night-remind') return;
  clubSheet.busy = true; clubSheet.error = ''; clubSheet.msg = ''; renderClub();
  let tz = 'UTC'; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch {}
  try {
    const res = await api('club', {
      method: 'POST',
      body: JSON.stringify(Object.assign({ code: club.code, action: 'night-remind', id: clubSheet.id, audience: clubSheet.audience || 'all', tz }, adminCreds()))
    });
    if (res.night) gnSyncLocalNight(res.night);
    clubSheet.busy = false;
    if (res.enabled === false) {
      clubSheet.pushEnabled = false;
      clubSheet.msg = res.message || 'Notifications are not set up on this server yet.';
    } else if (res.sent > 0) {
      clubSheet.msg = `Reminder sent to ${res.sent} device${res.sent === 1 ? '' : 's'}.`;
    } else {
      clubSheet.msg = res.message || 'No subscribed members to notify right now.';
    }
    announce(clubSheet.msg);
    renderClub();
  } catch (err) {
    clubSheet.busy = false; clubSheet.error = err.message; renderClub(); announce(err.message);
  }
}

/* ---------- year-in-review recap on every player profile ---------- */
/*YEARRECAP-START*/
// Pure calendar-year summary for one player, built from rated games and the Dink Rating engine.
// No app globals, so test/recap.test.js can load this block directly alongside DR.
const YearRecap = {
  isDefault: n => /^Player \d+$/.test(String(n || '').trim()),
  validGame: g => !!(g && !g.hold && Array.isArray(g.teams) && g.teams.length === 2 && g.teams.every(Array.isArray) && Array.isArray(g.score) && g.score.length === 2 && Number.isFinite(g.endedAt)),
  yearOf: ms => new Date(ms).getFullYear(),
  years(DR, name, games, { yearOf = YearRecap.yearOf } = {}) {
    const k = DR.key(name || '');
    if (!k) return [];
    const set = new Set();
    for (const g of games || []) {
      if (!YearRecap.validGame(g)) continue;
      if (g.teams.some(t => t.some(n => DR.key(n) === k))) set.add(yearOf(g.endedAt));
    }
    return [...set].sort((a, b) => b - a);
  },
  compute(DR, name, games, year = null, { yearOf = YearRecap.yearOf } = {}) {
    const rawName = String(name || '').trim();
    const k = DR.key(rawName);
    const valid = (games || []).filter(YearRecap.validGame).sort((a, b) => a.endedAt - b.endedAt);
    const years = YearRecap.years(DR, rawName, valid, { yearOf });
    const targetYear = Number.isInteger(year) ? year : (years[0] ?? yearOf(Date.now()));
    const empty = {
      name: rawName, year: targetYear, years,
      games: 0, wins: 0, losses: 0, winRate: 0,
      bestRating: null, bestRatingMode: null, bestRatingAt: null,
      doublesGames: 0, singlesGames: 0, pointsFor: 0, pointsAgainst: 0,
      favouritePartner: null, biggestRival: null
    };
    if (!k || !valid.length) return empty;
    // Replay the full rated history so ratings carry across year boundaries; peak rating only considers games in targetYear.
    const { after } = DR.compute(valid);
    const partners = new Map(), opponents = new Map();
    const tally = (map, n, won, decided, at) => {
      const ok = DR.key(n);
      const e = map.get(ok) || { name: String(n).trim(), games: 0, wins: 0, losses: 0, last: 0 };
      e.name = String(n).trim();
      e.games++;
      if (decided) { if (won) e.wins++; else e.losses++; }
      e.last = Math.max(e.last, at);
      map.set(ok, e);
    };
    let displayName = rawName, total = 0, wins = 0, losses = 0, doublesGames = 0, singlesGames = 0, pointsFor = 0, pointsAgainst = 0;
    let bestRating = null, bestRatingMode = null, bestRatingAt = null;
    for (const g of valid) {
      if (yearOf(g.endedAt) !== targetYear) continue;
      const side = g.teams[0].some(n => DR.key(n) === k) ? 0 : g.teams[1].some(n => DR.key(n) === k) ? 1 : -1;
      if (side < 0) continue;
      const mine = g.teams[side].find(n => DR.key(n) === k);
      if (mine && String(mine).trim()) displayName = String(mine).trim();
      const mode = g.mode === 'singles' ? 'singles' : 'doubles';
      const sFor = Number(g.score[side]) || 0, sAgainst = Number(g.score[1 - side]) || 0;
      const hasWinner = g.winner === 0 || g.winner === 1;
      const decided = hasWinner || sFor !== sAgainst;
      const won = hasWinner ? g.winner === side : sFor > sAgainst;
      total++;
      if (decided) { if (won) wins++; else losses++; }
      if (mode === 'singles') singlesGames++; else doublesGames++;
      pointsFor += sFor; pointsAgainst += sAgainst;
      const r = after[g.id] && after[g.id][k];
      if (typeof r === 'number' && (bestRating === null || r > bestRating)) {
        bestRating = r; bestRatingMode = mode; bestRatingAt = g.endedAt;
      }
      if (mode === 'doubles') {
        for (const n of g.teams[side]) {
          if (DR.key(n) !== k && !YearRecap.isDefault(n)) tally(partners, n, won, decided, g.endedAt);
        }
      }
      for (const n of g.teams[1 - side]) {
        if (DR.key(n) !== k && !YearRecap.isDefault(n)) tally(opponents, n, won, decided, g.endedAt);
      }
    }
    const fp = [...partners.values()].sort((a, b) => b.games - a.games || b.wins - a.wins || b.last - a.last || a.name.localeCompare(b.name))[0] || null;
    const rv = [...opponents.values()].sort((a, b) => b.games - a.games || Math.abs(a.wins - a.losses) - Math.abs(b.wins - b.losses) || b.last - a.last || a.name.localeCompare(b.name))[0] || null;
    const attachRate = e => e ? Object.assign({}, e, { winRate: e.games ? Math.round(100 * e.wins / e.games) : 0 }) : null;
    return {
      name: displayName, year: targetYear, years,
      games: total, wins, losses, winRate: total ? Math.round(100 * wins / total) : 0,
      bestRating, bestRatingMode, bestRatingAt,
      doublesGames, singlesGames, pointsFor, pointsAgainst,
      favouritePartner: attachRate(fp), biggestRival: attachRate(rv)
    };
  }
};
/*YEARRECAP-END*/

function recapFormatLabel(r) {
  if (r.doublesGames && r.singlesGames) return 'Doubles & singles';
  if (r.singlesGames) return 'Singles';
  if (r.doublesGames) return 'Doubles';
  return 'Year in review';
}

// Entry card shown on every player profile when that player has rated games in at least one year.

  if (r.bestRating !== null) bits.push(`Best ${r2(r.bestRating)}`);
  return `<button type="button" class="recap-cta" data-act="recap-open">
    <span class="recap-cta-text"><b>${r.year} in review</b><small>${esc(bits.join(' · '))}${ys.length > 1 ? ` · ${ys.length} years` : ''}</small></span>
    <span class="recap-cta-go" aria-hidden="true">Recap ›</span>
  </button>`;
}

// Full Year-in-review view rendered inside the profile sheet (#sheet4).

    ? (r.years.length <= 4

    : '';
  let content;
  if (!r.games) {
    content = `<div class="empty" style="box-shadow:none;background:var(--surface-2)"><p>No rated games in ${r.year} for ${esc(r.name)}.</p></div>`;
  } else {
    const fp = r.favouritePartner;

    const fpHTML = fp
      ? `<button type="button" class="rival recap-hl" data-player="${esc(fp.name)}"><span class="avatar-mini">${avatarInner(fp.name)}</span>
          <span class="rv-text"><b>${esc(fp.name)}</b><small>Favourite partner · ${fp.games} game${fp.games === 1 ? '' : 's'} together (${fp.winRate}%)</small></span>
          <span class="rv-score">${fp.wins}–${fp.losses}</span></button>`
      : `<div class="recap-empty-row"><b>Favourite partner</b><small>${r.singlesGames && !r.doublesGames ? `Singles only in ${r.year} — no doubles partner yet.` : `No named doubles partner in ${r.year}.`}</small></div>`;

      const h2h = lead === 'tied' ? `All square at ${rv.wins}–${rv.losses}` : `${first} ${lead} ${Math.max(rv.wins, rv.losses)}–${Math.min(rv.wins, rv.losses)}`;
      rvHTML = `<button type="button" class="rival recap-hl ${lead}" data-player="${esc(rv.name)}"><span class="avatar-mini">${avatarInner(rv.name)}</span>
        <span class="rv-text"><b>${esc(rv.name)}</b><small>Biggest rival · ${esc(h2h)} (${rv.games} game${rv.games === 1 ? '' : 's'})</small></span>
        <span class="rv-score">${rv.wins}–${rv.losses}</span></button>`;
    } else {
      rvHTML = `<div class="recap-empty-row"><b>Biggest rival</b><small>No named opponents in ${r.year}.</small></div>`;
    }
    const peakSub = r.bestRatingMode ? `${r.bestRatingMode === 'singles' ? 'Singles' : 'Doubles'} peak` : 'Peak rating';
    content = `<div class="recap-hero">
        <div class="recap-hero-meta"><span class="recap-k">Best Dink Rating</span><small>${esc(peakSub)}</small></div>

      </div>
      <div class="pf-stats">
        <div><b>${r.games}</b><small>Games</small></div>
        <div><b>${r.wins}–${r.losses}</b><small>Won–lost</small></div>
        <div><b>${r.winRate}%</b><small>Win rate</small></div>

      </div>

  }

function recapCardData(r) {

let profile = null; // { name, mode } when a profile is open
function playerProfile(name, mode, games) {
  const key = name.trim().toLowerCase();
  const isMe = n => n.trim().toLowerCase() === key;
  const { tables, changes } = DR.compute(games);
  const asc = [...games].sort((a, b) => a.endedAt - b.endedAt)
    .filter(g => (g.mode === 'singles' ? 'singles' : 'doubles') === mode && g.teams.some(t => t.some(isMe)));

  const partners = new Map(), opps = new Map();
  let w = 0, l = 0, pf = 0, pa = 0;
  const tally = (map, n, won) => { const k = n.trim().toLowerCase(); const e = map.get(k) || { name: n.trim(), g: 0, w: 0 }; e.g++; if (won) e.w++; map.set(k, e); };
  for (const g of asc) {
    const t = g.teams[0].some(isMe) ? 0 : 1;
    const won = g.winner === t;
    if (won) w++; else l++;
    pf += Number(g.score[t]); pa += Number(g.score[1 - t]);
    const ch = changes[g.id] && changes[g.id].list.find(x => isMe(x.name));

    for (const n of g.teams[t]) if (!isMe(n)) tally(partners, n, won);
    for (const n of g.teams[1 - t]) tally(opps, n, won);
  }
  const p = DR.lookup(tables, mode, name);
  const byGames = m => [...m.values()].filter(e => !isDefaultName(e.name)).sort((a, b) => b.g - a.g || b.w / b.g - a.w / a.g);
  const partnerList = byGames(partners);
  const best = partnerList.filter(e => e.g >= 2).sort((a, b) => b.w / b.g - a.w / a.g || b.g - a.g)[0];
  return { name: p ? p.name : name, p, rel: p ? Math.round(DR.reliability(p, Date.now()) * 100) : 0, series, w, l, pf, pa, partners: partnerList, best, opps: byGames(opps), recent: asc.slice(-5).reverse() };
}
// Rating over time: one series, so no legend; the heading names it. Hover or drag to read each game.
function ratingChart(series) {

  lo -= (hi - lo) * 0.1; hi += (hi - lo) * 0.1;
  const x = i => L + (series.length === 1 ? 0 : (i / (series.length - 1)) * (W - L - R));
  const y = r => T + (1 - (r - lo) / (hi - lo)) * (H - T - B);
  const step = (hi - lo) > 1 ? 0.5 : (hi - lo) > 0.4 ? 0.2 : 0.1;
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(2));
  const pts = series.map((s, i) => `${x(i).toFixed(1)},${y(s.r).toFixed(1)}`);
  const last = series.length - 1;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rating over ${last} games, from ${r2(DR.START)} to ${r2(series[last].r)}" data-chart>
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="axis" x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${v.toFixed(step < 0.2 ? 1 : 1)}</text>`).join('')}
    <line class="base" x1="${L}" x2="${W - R}" y1="${y(DR.START).toFixed(1)}" y2="${y(DR.START).toFixed(1)}"/>
    <path class="area" d="M${pts[0]} L${pts.join(' L')} L${x(last).toFixed(1)},${H - B} L${L},${H - B} Z"/>
    <polyline class="line" points="${pts.join(' ')}"/>
    <circle class="end" cx="${x(last).toFixed(1)}" cy="${y(series[last].r).toFixed(1)}" r="4.5"/>
    <text class="axis" x="${L}" y="${H - 4}">Start</text><text class="axis" x="${W - R}" y="${H - 4}" text-anchor="end">Game ${last}</text>
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="hover-dot" r="4" visibility="hidden"/>
  </svg>`;
  return { svg, geo: { W, L, R, n: series.length, x, y } };
}
let chartGeo = null, chartSeries = null;
function wireChart() {
  const card = document.querySelector('#sheet4 .chart-card');
  const svgEl = card && card.querySelector('svg');
  if (!svgEl || !chartGeo) return;
  const tip = card.querySelector('.chart-tip'), cross = svgEl.querySelector('.cross'), dot = svgEl.querySelector('.hover-dot');
  const show = clientX => {
    const box = svgEl.getBoundingClientRect();
    const vx = (clientX - box.left) / box.width * chartGeo.W;
    const i = Math.max(0, Math.min(chartGeo.n - 1, Math.round((vx - chartGeo.L) / ((chartGeo.W - chartGeo.L - chartGeo.R) / Math.max(1, chartGeo.n - 1)))));
    const s = chartSeries[i];
    const cx = chartGeo.x(i), cy = chartGeo.y(s.r);

      : `<b>${r2(s.r)}</b> ${d === 0 ? '±0.00' : (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2)}<br>${s.won ? 'Won' : 'Lost'} ${Number(s.g.score[s.t])}–${Number(s.g.score[1 - s.t])} vs ${esc(teamLabel(s.g.teams[1 - s.t]))}`;
    tip.hidden = false;

    const px = (cx / chartGeo.W) * box.width + (box.left - card.getBoundingClientRect().left);
    const half = tip.offsetWidth / 2, cw = card.clientWidth;

  const hide = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  svgEl.addEventListener('pointermove', e => show(e.clientX));
  svgEl.addEventListener('pointerdown', e => show(e.clientX));
  svgEl.addEventListener('pointerleave', hide);
}

// The dismissed message is remembered on this phone only, as a hash of its text: a changed message hashes differently and shows again.
/*ANNOUNCE-START*/
const Announce = {
  key: 'pb.announceDismissed',
  // FNV-1a over the NFC text, 8 hex digits: enough to tell one note from the next, not a security hash.
  hash(text) {
    let h = 0x811c9dc5;
    for (const c of String(text == null ? '' : text).normalize('NFC')) {
      h ^= c.codePointAt(0);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(16).padStart(8, '0');
  },
  // Show a non-empty note unless this phone dismissed exactly this text.
  shown(note, dismissed) {
    const t = String(note == null ? '' : note).trim();
    return !!t && Announce.hash(t) !== dismissed;
  }
};
/*ANNOUNCE-END*/

// Fetches your paddles once per club per visit; the app works from the saved copy meanwhile.
async function paddleLoad() {
  if (!club || !myName() || !myToken()) return;
  const code = club.code;
  if (paddleAsked.has(code)) return;
  paddleAsked.add(code);
  try {
    const d = await playerCall({ action: 'paddles-get', name: myName(), playerToken: myToken() });
    if (!club || club.code !== code || !d.paddles) return;
    paddleDocs[code] = { list: d.paddles.list || [], used: d.paddles.used || {} };
    paddleCache(); render(); renderProfile();

}
async function paddleSave(doc) {
  const d = await playerCall({ action: 'paddles-set', name: myName(), playerToken: myToken(), paddles: doc });
  paddleDocs[club.code] = d.paddles;
  if (paddleChoice[club.code] && !d.paddles.list.some(p => p.id === paddleChoice[club.code])) delete paddleChoice[club.code];
  paddleCache();

const paddleNewId = () => Math.random().toString(36).slice(2, 10).padEnd(4, 'x');

// Your record with each paddle, from the rated games you were in. A game with no paddle chosen counts for none of them.
function paddleTally(name, games) {
  const doc = paddleDoc();
  const rows = new Map(paddleList().map(p => [p.id, { p, w: 0, l: 0 }]));
  for (const g of doc ? games : []) {
    const row = rows.get(doc.used[g.id]);
    if (!row) continue;
    const t = g.teams[0].some(n => sameName(n, name)) ? 0 : g.teams[1].some(n => sameName(n, name)) ? 1 : -1;
    if (t < 0) continue;
    if (g.winner === t) row.w++; else row.l++;
  }
  return [...rows.values()];
}

async function paddleTag(gameId) {

async function lgRun(body, ok) {
  const s = lgScreen;
  if (!s || s.busy) return null;
  s.busy = true; s.error = ''; renderLeagues(true);
  let data = null;
  try {
    data = await lgCall(body);
    if (data.league && lgScreen === s) { s.league = data.league; s.id = data.league.id; }
    s.entry = s.plan = s.rs = s.ff = null; s.armDelete = false;
    if (ok) showToast(ok, false);
  } catch (err) {
    if (err.status === 403 && body.action !== 'league-result') forgetPin();
    s.error = err.offline ? 'You are offline. Try again when you are back online.' : err.message;
  }
  s.busy = false; renderLeagues(true);
  return data;
}
function lgCreate() {

  if (f.kind === 'ladder') Object.assign(league, { jump: f.jump, decayDays: f.decayDays }); else Object.assign(league, { divisions: f.divisions, legs: f.legs });
  f.busy = true; f.error = ''; renderLeagues(true);
  lgCall({ action: 'league-create', league }).then(d => {
    if (lgScreen !== s) return;
    s.view = 'detail'; s.id = d.league.id; s.league = d.league; s.loading = false; s.ch = null; s.form = null; s.error = '';
    showToast(f.kind === 'ladder' ? 'Ladder started' : 'League started', false);
  }).catch(err => { if (err.status === 403) forgetPin(); f.busy = false; f.error = err.offline ? 'You are offline. Try again when you are back online.' : err.message; }).finally(() => { f.busy = false; renderLeagues(true); });
}
const lgSavePlan = () => { const s = lgScreen, p = s.plan; lgRun({ action: 'league-schedule', id: s.league.id, week: p.n, date: p.date, time: p.time, courts: p.courts === '' ? undefined : +p.courts }, 'Week saved').then(d => { if (!d && lgScreen === s && s.plan === p) { p.error = s.error; s.error = ''; renderLeagues(true); } }); };
const lgSaveMove = () => { const s = lgScreen, r = s.rs; lgRun({ action: 'league-reschedule', id: s.league.id, matchId: r.m, date: r.date, time: r.time, court: r.court === '' ? null : +r.court }, 'Match moved').then(d => { if (!d && lgScreen === s && s.rs === r) { r.error = s.error; s.error = ''; renderLeagues(true); } }); };
const lgScores = e => { const sc = e.s.map(v => parseInt(v, 10)); return sc.some(v => !Number.isFinite(v) || v < 0 || v > 99) ? 'Enter both scores, from 0 to 99.' : sc[0] === sc[1] ? "Scores can't be tied. Pickleball games need a winner." : sc; };
async function lgSaveEntry() {

function lgAct(a, d) {
  if (a === 'open') { lgOpen(); return; }
  if (a === 'tab-open') { lgScreen = { view: 'detail', id: d.id, league: null, loading: true, error: '', list: null, fromTab: true }; renderLeagues(true); lgLoad(d.id); return; }
  if (a === 'tab-tv') { evTabTv('league', d.id); return; }
  const s = lgScreen;
  if (!s) return;
  if (a === 'back' && s.view === 'detail' && s.fromTab) {
    lgScreen = null; evTab.at = 0; renderLeagues(true); safeRender();
    const t = document.querySelector(`[data-lg="tab-open"][data-id="${CSS.escape(s.id)}"]`); if (t) t.focus({ preventScroll: true });
    return;
  }
  if (a === 'back') {
    if (s.view === 'list') { lgClose(); return; }
    s.view = 'list'; s.league = null; s.entry = s.ch = s.share = s.plan = s.rs = s.ff = null; s.error = ''; s.armDelete = s.arm = false; renderLeagues(true); lgLoadList(); return;
  }
  if (a === 'new') { s.view = 'new'; s.form = lgNewForm(); renderLeagues(true); return; }
  if (a === 'open-one') { Object.assign(s, { view: 'detail', id: d.id, league: null, loading: true, error: '', entry: null, ch: null, share: null, arm: '', plan: null, rs: null, ff: null }); renderLeagues(true); lgLoad(d.id); return; }
  if (s.view === 'new') {
    const f = s.form;
    if (a === 'set') { f[d.k] = ['divisions', 'legs', 'target', 'winBy', 'decayDays'].includes(d.k) ? +d.v : d.v; f.error = ''; }
    if (a === 'step') f.jump = Math.min(10, Math.max(1, f.jump + (+d.d)));
    if (a === 'pick') { const i = f.players.findIndex(x => sameName(x, d.pl)); if (i >= 0) f.players.splice(i, 1); else f.players.push(d.pl); }
    if (a === 'pick-all') f.players = roster.slice();
    if (a === 'pick-none') f.players = [];
    if (a === 'guest') {
      const el = $('#lg-guest'), v = el ? el.value.trim() : '';
      if (v && !f.players.some(x => sameName(x, v))) f.players.push(v);
      if (el) el.value = '';
    }
    renderLeagues(true);
    if (a === 'guest') { const el = $('#lg-guest'); if (el) el.focus(); }
    return;
  }
  const L = s.league;
  if (!L) return;
  if (a === 'enter') { s.entry = { m: d.m, s: ['', ''], error: '' }; renderLeagues(true); }
  else if (a === 'fix') { const m = L.weeks.flatMap(w => w.matches).find(x => x.id === d.m); s.entry = { m: d.m, s: m ? m.score.map(String) : ['', ''], fix: true, error: '' }; renderLeagues(true); }
  else if (a === 'fix-result') { const r = L.results.find(x => x.id === d.k); s.entry = { m: d.k, s: r ? r.score.map(String) : ['', ''], fix: true, error: '' }; renderLeagues(true); }
  else if (a === 'cancel') { s.entry = s.plan = s.rs = s.ff = null; renderLeagues(true); }
  else if (a === 'plan') { const w = L.weeks.find(x => x.n === +d.n); s.entry = s.rs = s.ff = null; s.plan = { n: +d.n, date: (w && w.date) || '', time: (w && w.time) || '', courts: '', error: '' }; renderLeagues(true); }
  else if (a === 'resched') { const m = L.weeks.flatMap(w => w.matches).find(x => x.id === d.m); s.entry = s.plan = s.ff = null; s.rs = { m: d.m, date: (m && m.date) || '', time: (m && m.time) || '', court: (m && m.court) || '', error: '' }; renderLeagues(true); }
  else if (a === 'forfeit') { s.entry = s.plan = s.rs = null; s.ff = d.m; renderLeagues(true); }
  else if (a === 'send-ch') { const ch = s.ch, c = L.rows.find(r => r.name === ch.c), dd = L.rows.find(r => r.name === ch.d); if (c && dd) lgRun({ action: 'league-challenge', id: L.id, key: lgKey(), challenger: c.members, defender: dd.members }, 'Challenge sent'); }
  else if (a === 'answer-ch') lgRun({ action: 'league-answer', id: L.id, challengeId: d.k, answer: d.w }, { accept: 'Challenge accepted', decline: 'Challenge declined', withdraw: 'Challenge withdrawn' }[d.w]);
  else if (a === 'forfeit-win') lgRun({ action: 'league-forfeit', id: L.id, matchId: s.ff, winner: +d.w }, 'Forfeit recorded');
  else if (a === 'forfeit-undo') lgRun({ action: 'league-forfeit', id: L.id, matchId: d.m, winner: null }, 'Forfeit undone');
  else if (a === 'notify') lgRun({ action: 'league-notify', id: L.id, week: +d.n }).then(r => { if (r) showToast(r.sent ? `Sent to ${r.sent} phone${r.sent === 1 ? '' : 's'}` : r.on ? 'Nobody has notifications on yet' : 'Notifications are not set up on this server yet', false); });
  else if (a === 'share-open' || a === 'share-new' || a === 'share-off') lgShare(a);
  else if (a === 'share-hide') { s.share = null; s.arm = ''; renderLeagues(true); }
  else if (a === 'share-copy') lgCopyLink();
  else if (a === 'end') lgRun({ action: 'league-end', id: L.id }, L.kind === 'ladder' ? 'Season closed' : 'Season finished');
  else if (a === 'next') lgRun({ action: 'league-next-season', id: L.id }, 'Next season started');
  else if (a === 'delete') { s.armDelete = true; renderLeagues(true); }
  else if (a === 'delete-yes') lgRun({ action: 'league-delete', id: L.id }).then(d2 => { if (d2 && lgScreen === s) { s.view = 'list'; s.league = null; renderLeagues(true); lgLoadList(); } });
}

document.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el) {
    if (ratingExplain && e.target.closest && e.target.closest('#sheet8') && e.target.classList.contains('sheet-bg')) { closeRatingExplain(); return; }
    if (settingsOpen && e.target.closest && e.target.closest('#sheet9') && e.target.classList.contains('sheet-bg')) { closeSettings(); return; }
    if (inboxOpen && e.target.closest && e.target.closest('#sheet11') && e.target.classList.contains('sheet-bg')) { closeInbox(); return; }
    if (shareSheet && e.target.closest && e.target.closest('#sheet5') && e.target.classList.contains('sheet-bg')) { closeShare(); return; }
    if (profile && e.target.closest && e.target.closest('#sheet4') && e.target.classList.contains('sheet-bg')) { profile = null; renderProfile(); return; }
    if (logForm && e.target.classList && e.target.classList.contains('sheet-bg') && e.target.classList.contains('top')) { logForm = null; render(); }
    if (newGameOpen && e.target.closest && e.target.closest('#sheet10') && e.target.classList.contains('sheet-bg')) { closeNewGame(); return; }
    return;
  }
  const ds = el.dataset;
  if (ds.explainPlayer) { openRatingExplain(ds.explainPlayer, ds.explainMode, ds.explainScope, el); return; }
  if (ds.act === 'explain-close') { closeRatingExplain(); return; }
  if (ds.act === 'explain-profile' && ratingExplain) { const { name, mode } = ratingExplain; ratingExplain = null; renderRatingExplain(); profile = { name, mode }; renderProfile(); const sh = $('#sheet4 .sheet'); if (sh) sh.scrollTop = 0; return; }
  // Share a result
  if (ds.replay) { openReplay(ds.replay); return; }
  if (ds.act === 'replay-close') { closeReplay(); return; }
  if (ds.act === 'replay-play') { replayPlay(); return; }

    const d = await dssoPost(Object.assign({ action: 'link', playerName: u.name, userToken }, dssoCreds()));
    dssoSetPlayer(u.name, d.snapshot);
    if (dssoUI === u) dssoUI = null;
    showToast(d.basic === false ? 'DUPR connected. DUPR shows no membership for this account yet.' : 'DUPR connected', false);
  } catch (err) { u.busy = false; u.error = err.message; }
  renderDsso(); refreshDupr();
}
async function dssoReview(quiet) {
  const u = dssoUI; if (!u) return;
  try { u.review = await dssoPost(Object.assign({ action: 'review', id: u.event.id, tz: dssoTz() }, adminCreds())); if (!quiet) u.error = ''; }
  catch (err) { if (err.status === 403) forgetPin(); u.error = err.message; u.review = u.review || { items: [], rounds: [], summary: { ready: 0, blocked: 0, sent: 0, failed: 0, skipped: 0 }, paused: null }; }
  renderDsso();
}
async function dssoSend(retryFailed) {
  const u = dssoUI; if (!u || u.busy || !u.ok) return;
  const ids = u.review.items.filter(i => (!u.round || i.round === u.round) && (i.state === 'ready' || (retryFailed && i.state === 'failed'))).map(i => i.matchId);
  if (!ids.length) return;
  u.busy = true; u.error = ''; renderDsso();
  try {
    const d = await dssoPost(Object.assign({ action: 'send', id: u.event.id, tz: dssoTz(), confirm: true, matchIds: ids, retryFailed: !!retryFailed }, adminCreds()));
    u.review = d; u.results = d.results; u.ok = false;
  } catch (err) { if (err.status === 403) forgetPin(); u.error = err.message; }
  u.busy = false; renderDsso();
}
// The login iframe reports the signed-in player with a message. Anything not from DUPR's login origin and this iframe is ignored;
// the server then asks DUPR who the token belongs to, so the message itself proves nothing.
window.addEventListener('message', e => {
  const c = dssoCfg(), fr = document.getElementById('dsso-frame');
  if (!c || !dssoUI || dssoUI.view !== 'connect' || !fr || e.origin !== c.loginOrigin || e.source !== fr.contentWindow) return;
  let d = e.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
  const t = d && (d.userToken || d.accessToken);
  if (typeof t === 'string' && t) dssoLink(t);
});
document.addEventListener('click', async e => {
  const b = e.target.closest && e.target.closest('button[data-dsso]');
  if (!b || !dssoCfg()) return;
  const a = b.dataset.dsso, name = b.dataset.name;
  if (a === 'close') dssoClose();
  else if (a === 'connect') { dssoUI = { view: 'connect', name }; renderDsso(); }
  else if (a === 'review-open') { dssoUI = { view: 'review', event: { id: b.dataset.id, name: evScreen && evScreen.event ? evScreen.event.name : 'Event' }, review: null, round: '', ok: false }; renderDsso(); dssoReview(); }
  else if (a === 'send') dssoSend(false);
  else if (a === 'retry') dssoSend(true);
  else if (a === 'refresh') {
    b.disabled = true;
    try { const d = await dssoPost({ action: 'refresh', playerName: name }); dssoSetPlayer(name, d.snapshot); showToast(d.needsRelink ? 'DUPR access ended. Connect again.' : d.cached ? 'Already up to date' : 'Rating updated from DUPR', false); }
    catch (err) { showToast(err.message, false); }
    refreshDupr();
  } else if (a === 'unlink') {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Tap again to unlink'; return; }
    try { await dssoPost(Object.assign({ action: 'unlink', playerName: name }, dssoCreds())); dssoSetPlayer(name, null); showToast('DUPR unlinked. The stored ID and rating are deleted.', false); }
    catch (err) { showToast(err.message, false); }
    refreshDupr();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!dssoUI) return;
  if (t.matches && t.matches('[data-dsso-round]')) { dssoUI.round = t.value; dssoUI.ok = false; renderDsso(); }
  if (t.matches && t.matches('[data-dsso-ok]')) { dssoUI.ok = t.checked; renderDsso(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && dssoUI) { e.stopImmediatePropagation(); dssoClose(); } }, true);

if (live && live.state.winner === null && live.open) keepAwake(true);
applyDisplay();
render();
if (importedCount) showToast(`Moved ${importedCount} game${importedCount === 1 ? '' : 's'} from the old site`, false);
if (club) { flush(); refreshClub(); }
checkInvite().finally(() => { urlReady = true; syncUrl(); });
// Know at once whether a sign-in is alive, so the club screens can say so and offer the account's clubs.
if (API_OK && passkeysOk()) acctLoad().then(() => {
  const c = clubSheet, f = document.activeElement;
  if (acctIn() && c && !c.busy && (c.view === 'add' || c.view === 'club') && !(f && f.closest && f.closest('#sheet3') && /^(INPUT|TEXTAREA)$/.test(f.tagName))) renderClub();
});
</script>

<script>
if ('serviceWorker' in navigator) {
  // A new service worker takes over at once; reload so the page and its files come from the same version, but not
  // while a game is open or someone is typing (that waits until the page is put away). Games in progress are saved, so a reload keeps them.
  const had = !!navigator.serviceWorker.controller; let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had || reloading) return;
    const go = () => { reloading = true; location.reload(); };
    let busy = false; try { busy = !!(live && live.open) || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName); } catch (e) {}
    if (!busy) go(); else document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') go(); }, { once: true });
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}
</script>
