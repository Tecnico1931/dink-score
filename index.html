<style>
/* Layout: phone-first app. Home is a tile grid (now playing, log a result, top player, this week) over the game setup card.
   A floating pill tab bar. Scoring is two rounded court panels with condensed numerals and a score-call pill between them.
   One bold idea: the variable grotesque squeezed narrow and heavy for every number that matters. */
/*TOKENS-START*/
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #E9EDF2;
  --ink: #0E1726;
  --muted: #5D6A7B;
  --line: #DEE4EA;
  --blue: #2B49E6;      /* team 1 court */
  --green: #0B8562;     /* team 2 court */
  --ball: #DDF247;      /* serve, highlights */
  --ball-ink: #1B2104;
  --ball-hi: #E7FA5C;   /* the lime tile's gradient ends */
  --ball-lo: #CFE43A;
  --court: #0E7A55;     /* hero card and New game tile: a court seen from above */
  --court-2: #0A5E42;
  --court-line: rgb(255 255 255 / .55);
  --on-court: #FFFFFF;
  --lift: 0 1px 0 rgb(255 255 255 / .6) inset, 0 14px 30px -18px rgb(30 25 10 / .35);
  --up: #0A7656;
  --down: #C2372B;
  --danger: #C2372B;
  --focus: #2B49E6;
  --blue-text: #2B49E6; /* blue as text: the dark theme needs a lighter blue than the fill */
  --shadow: 0 1px 2px rgb(14 23 38 / .06), 0 8px 24px -12px rgb(14 23 38 / .18);
  --display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --ui: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
}
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F17; --surface: #131B26; --surface-2: #1B2532; --ink: #EEF2F7; --muted: #8E9BAD; --line: #243142;
    --blue: #3D5BFF; --green: #0B8562; --ball: #DDF247; --ball-ink: #1B2104;
    --up: #3DD69E; --down: #FF7A6B; --danger: #FF7A6B; --focus: #9DB0FF; --blue-text: #9DB0FF;
    --court: #0F6B4B; --court-2: #0A4A34; --lift: 0 1px 0 rgb(255 255 255 / .05) inset, 0 18px 36px -18px rgb(0 0 0 / .8);
    --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 30px -14px rgb(0 0 0 / .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F17; --surface: #131B26; --surface-2: #1B2532; --ink: #EEF2F7; --muted: #8E9BAD; --line: #243142;
  --blue: #3D5BFF; --green: #0B8562; --ball: #DDF247; --ball-ink: #1B2104;
  --up: #3DD69E; --down: #FF7A6B; --danger: #FF7A6B; --focus: #9DB0FF; --blue-text: #9DB0FF;
  --court: #0F6B4B; --court-2: #0A4A34; --lift: 0 1px 0 rgb(255 255 255 / .05) inset, 0 18px 36px -18px rgb(0 0 0 / .8);
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 30px -14px rgb(0 0 0 / .7);
  color-scheme: dark;
}
/* Outdoor display (a per-device setting): maximum contrast in direct sun, whatever the phone's own theme. */
:root[data-outdoor] {
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #E8E8E8; --ink: #000000; --muted: #2B2B2B; --line: #5A5A5A;
  --blue: #0A28B8; --green: #00593F; --up: #00593F; --down: #A80000; --danger: #A80000; --focus: #0A28B8; --blue-text: #0A28B8;
  --court: #00593F; --court-2: #00593F; --court-line: rgb(255 255 255 / .9); --lift: none;
  --shadow: none;
  color-scheme: light;
}
/*TOKENS-END*/
html { height: 100%; height: 100dvh; overflow: hidden; background: var(--bg); }
body { height: 100%; height: 100dvh; margin: 0; overflow-y: auto; overscroll-behavior-y: none; -webkit-overflow-scrolling: touch; scrollbar-gutter: stable; }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: inherit; z-index: 15; pointer-events: none; }
/* A soft floodlight at the top of every page: court green from the left, ball lime from the right. It is gone by 130 px, before any muted text. */
body { background: radial-gradient(90% 190px at 50% -40px, color-mix(in srgb, var(--court) 22%, transparent), transparent 70%), radial-gradient(55% 150px at 100% -30px, color-mix(in srgb, var(--ball) 14%, transparent), transparent 70%), var(--bg); background-attachment: fixed; color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, .n { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(136px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.wordmark { display: flex; align-items: center; gap: 10px; flex: none; }
.wordmark svg { width: 34px; height: 34px; flex: none; }
.wordmark h1 { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 28px; letter-spacing: -.02em; line-height: 1; margin: 0; white-space: nowrap; }
.top-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; flex: 1; }
.top-right .sync { min-width: 0; }
.you-list { display: grid; gap: 8px; margin: 4px 0 14px; }
.you-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.you-row > span:first-child { flex: 1; min-width: 0; display: grid; gap: 2px; }
.you-row b { font-size: 16px; font-weight: 700; }
.you-row small { font-size: 13px; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }
.you-row .chev { font-size: 22px; color: var(--muted); }
.me-btn { position: relative; --r: 26px; width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; padding: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; box-shadow: 0 0 0 2px var(--surface), var(--rw-ring, 0 0 0 0 transparent), 0 4px 12px -4px rgb(0 0 0 / .35); }
.me-btn svg { width: 22px; height: 22px; }
.me-btn .av-emoji { font-size: 22px; }
.me-btn .av-icon { width: 60%; height: 60%; }
.me-btn .rw-flame { position: absolute; right: -6px; bottom: -6px; min-width: 22px; height: 22px; padding: 0 5px 0 3px; display: inline-flex; align-items: center; gap: 1px; border-radius: 999px; background: var(--court-2); color: var(--ball); box-shadow: 0 0 0 2px var(--surface); font-size: 12px; line-height: 1; }
.me-btn .rw-flame svg { width: 12px; height: 12px; }
.card.rw-card { display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; color: var(--on-court); background: linear-gradient(160deg, var(--court) 0%, var(--court-2) 100%); box-shadow: var(--lift); }
.rw-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rw-day, .rw-bal { display: inline-flex; align-items: center; gap: 10px; }
.rw-day svg { width: 32px; height: 32px; color: var(--ball); }
.rw-day b, .rw-bal b { display: block; font-size: 32px; line-height: 1; }
.rw-day small, .rw-bal small { display: block; font-size: 12px; color: rgb(255 255 255 / .92); }
.rw-bal { text-align: right; }
.rw-line { margin: 0; font-size: 14px; }
.rw-fine { margin: 0; font-size: 12px; color: rgb(255 255 255 / .92); }
.rw-hide { align-self: flex-start; min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--on-court); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; }
.rw-acts { display: flex; flex-wrap: wrap; gap: 0 20px; } .rw-acts .rw-hide { min-width: 44px; }
/* Worn looks, set on <html> (data-rw-frame, data-rw-skin) while rewards are shown, and on the swatches in the sheet. Colours are the app's own tokens, so both themes follow. */
[data-rw-frame="court"] { --rw-ring: 0 0 0 5px var(--court); } [data-rw-frame="blue"] { --rw-ring: 0 0 0 5px var(--blue); } [data-rw-frame="ink"] { --rw-ring: 0 0 0 5px var(--ink); }
[data-rw-frame="double"] { --rw-ring: 0 0 0 4px var(--court), 0 0 0 6px var(--surface), 0 0 0 8px var(--blue); }
[data-rw-skin="court"] { --rw-pad-bg: var(--court); --rw-pad-fg: var(--on-court); --rw-pad-ring: 0 0 0 2px var(--court); }
[data-rw-skin="blue"] { --rw-pad-bg: var(--blue); --rw-pad-fg: var(--on-court); --rw-pad-ring: 0 0 0 2px var(--blue); }
[data-rw-skin="ink"] { --rw-pad-bg: var(--ink); --rw-pad-fg: var(--bg); --rw-pad-ring: 0 0 0 2px var(--ink); }
[data-rw-skin="stripe"] { --rw-pad-bg: var(--court); --rw-pad-fg: var(--on-court); --rw-pad-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--blue); }
html[data-rw-skin] .pd-thumb { background: var(--rw-pad-bg); color: var(--rw-pad-fg); box-shadow: var(--rw-pad-ring); }
.rw-bal-line { margin: 0 0 4px; font-size: 14px; } .rw-bal-line b { font-family: var(--display); font-size: 34px; font-weight: 800; font-stretch: 75%; font-variant-numeric: tabular-nums; }
.rw-h { margin: 18px 0 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
.rw-pick { border: 0; margin: 0 0 8px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; } .rw-pick legend { padding: 0; margin-bottom: 4px; font-size: 13px; font-weight: 600; }
.rw-opt { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
.rw-opt[aria-pressed="true"] { border-color: var(--court); background: var(--surface-2); font-weight: 700; } .rw-opt[aria-pressed="true"]::after { content: "\2713"; }
.rw-item { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.rw-name { flex: 1; min-width: 0; } .rw-name b { display: block; font-size: 15px; } .rw-name small { display: block; font-size: 13px; color: var(--muted); }
.rw-item .btn { min-height: 44px; min-width: 64px; }
.rw-sw { width: 30px; height: 30px; margin: 8px 8px 8px 0; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 12px; box-shadow: 0 0 0 2px var(--surface), var(--rw-ring, 0 0 0 0 transparent); }
.rw-sw svg { width: 62%; height: 62%; }
.rw-sw.pad { background: var(--rw-pad-bg); color: var(--rw-pad-fg); box-shadow: var(--rw-pad-ring); }
.me-btn.frame-crown::before { top: -13px; width: 22px; height: 14px; }
@media (max-width: 380px) { .wordmark h1 { font-size: 24px; } .wordmark svg { width: 30px; height: 30px; } }
/* Narrow phones: keep the mark, hide the wordmark text (still the page's h1 for screen readers) so the club chip keeps room for its name. */
@media (max-width: 399px) { .wordmark h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } }
.top { flex-wrap: nowrap; }
.top-right .sync.club-btn { flex: 0 1 auto; min-width: 44px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-btn, .bell-btn, .sync { box-shadow: var(--shadow); }
.sync { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.sync.on::before { background: var(--up); }
h2 { font-family: var(--display); font-weight: 700; font-stretch: 90%; font-size: 26px; letter-spacing: -.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 700; font-stretch: 90%; font-size: 19px; letter-spacing: -.01em; margin: 0; }
.sub { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.card { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--lift); }

/* Home tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 0; border-radius: 22px; padding: 16px; box-shadow: var(--lift); text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 132px; }
.tile .t-k { font-size: 13px; color: var(--muted); font-weight: 500; }
.tile .t-big { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: .95; letter-spacing: -.02em; }
.tile .t-name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; line-height: 1.2; }
.tile .t-foot { margin-top: auto; font-size: 13px; color: var(--muted); }
.tile.wide { grid-column: 1 / -1; }
.tile.live { background: var(--ink); color: var(--bg); min-height: 0; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 14px; }
.tile.live .t-k { color: inherit; opacity: .65; display: flex; align-items: center; gap: 8px; }
.tile.live .t-k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 0 4px rgb(221 242 71 / .25); }
.tile.live .t-big { font-size: 54px; grid-column: 1; }
.tile.live .t-name { grid-column: 1; font-weight: 500; opacity: .8; font-size: 14px; }
.tile.live .go { grid-column: 2; grid-row: 1 / span 3; background: var(--ball); color: var(--ball-ink); border-radius: 999px; padding: 12px 18px; font-weight: 700; }
.tile.log { background: linear-gradient(135deg, var(--ball-hi), var(--ball) 60%, var(--ball-lo)); color: var(--ball-ink); box-shadow: 0 14px 30px -14px rgb(180 200 20 / .7), 0 1px 0 rgb(255 255 255 / .5) inset; }
.tile.log .t-k { color: rgb(27 33 4 / .82); }
.tile.log .plus { width: 34px; height: 34px; border-radius: 50%; background: var(--ball-ink); color: var(--ball); display: grid; place-items: center; font-size: 22px; line-height: 1; }
.tile.log .t-name { margin-top: auto; font-size: 17px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 58px; margin-top: 4px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.week i { display: block; width: 100%; max-width: 26px; border-radius: 6px; background: var(--surface-2); min-height: 4px; }
.week i.has { background: var(--green); }
.week i.today { outline: 2px solid var(--ball); outline-offset: 1px; }
.week span { font-size: 12px; color: var(--muted); }
/* Hero: a little court seen from above (faint lines), a pickleball in the corner, the week as bars. The art is icons/pickleball.svg, drawn for this app. */
.hero { position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; gap: 10px; padding: 22px 20px 20px; color: var(--on-court); background: linear-gradient(160deg, var(--court) 0%, var(--court-2) 100%); box-shadow: var(--lift); }
.hero::before { content: ""; position: absolute; inset: 12px; z-index: -1; border: 2px solid var(--court-line); border-radius: 6px; opacity: .35;
  background: linear-gradient(var(--court-line), var(--court-line)) 50% 0 / 2px 34% no-repeat, linear-gradient(var(--court-line), var(--court-line)) 50% 100% / 2px 34% no-repeat,
    linear-gradient(90deg, transparent calc(34% - 1px), var(--court-line) calc(34% - 1px) calc(34% + 1px), transparent calc(34% + 1px) calc(66% - 1px), var(--court-line) calc(66% - 1px) calc(66% + 1px), transparent calc(66% + 1px)); }
.hero-ball { position: absolute; z-index: -1; right: -22px; top: -22px; width: 124px; height: 124px; transform: rotate(-8deg); pointer-events: none; filter: drop-shadow(0 12px 20px rgb(0 0 0 / .35)) drop-shadow(0 0 24px rgb(221 242 71 / .3)); }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero-txt { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding-right: 88px; }
.hero .play-greeting { font-size: 22px; color: var(--on-court); }
.hero-club { margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--on-court); background: rgb(0 0 0 / .22); padding: 6px 12px 6px 10px; border-radius: 999px; overflow-wrap: anywhere; }
.hero-club::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 0 4px rgb(221 242 71 / .25); }
.hero-total { display: flex; align-items: baseline; gap: 8px; }
.hero-total .n { font-size: 44px; line-height: 1; }
.hero .t-k { color: rgb(255 255 255 / .92); }
.hero .week { margin-top: 8px; height: 62px; }
.hero .week i { background: rgb(255 255 255 / .18); }
.hero .week i.has { background: rgb(255 255 255 / .9); }
.hero .week i.today { outline: 0; background: var(--ball); box-shadow: 0 0 0 3px rgb(221 242 71 / .3); }
.hero .week span { color: rgb(255 255 255 / .92); }
.tile.newg { background: linear-gradient(160deg, var(--court), var(--court-2)); color: var(--on-court); box-shadow: 0 14px 30px -16px color-mix(in srgb, var(--court) 90%, transparent); }
.tile.newg .t-k { color: rgb(255 255 255 / .92); }
.tile.newg .plus { width: 34px; height: 34px; border-radius: 50%; background: rgb(255 255 255 / .16); display: grid; place-items: center; }
.tile.newg .plus img { width: 22px; height: 22px; display: block; }
.tile.newg .t-name { margin-top: auto; font-size: 17px; }
.sh-end { display: flex; align-items: center; gap: 8px; }
.sheet.newgame .setup-opts, .sheet.newgame .teams, .sheet.newgame .roster { margin-top: 0; }
.sheet.newgame .start { margin-top: 0; }
.chip-btn.add { border-style: dashed; color: var(--blue-text); font-weight: 600; }
.play-greeting { font-family: var(--display); font-weight: 700; font-stretch: 90%; font-size: 19px; line-height: 1.2; letter-spacing: -.01em; color: var(--ink); margin: 0; overflow-wrap: anywhere; }

/* Setup */
.field { display: flex; flex-direction: column; gap: 8px; }
.field + .field { margin-top: 14px; }
.lab { font-size: 13px; font-weight: 500; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { min-width: 0; border: 0; background: transparent; border-radius: 10px; padding: 10px 6px; font-weight: 600; font-size: 15px; line-height: 1.2; color: var(--muted); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(14 23 38 / .14); }
.seg.sm button { padding: 7px 10px; font-size: 14px; }
.seg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
/* Skeletons: placeholder shapes while data loads. Hidden for the first 250 ms so cached or instant data never flashes one; the shimmer only runs when motion is allowed. */
.skel-wrap { display: flex; flex-direction: column; gap: 10px; opacity: 0; animation: skel-in .01s linear .25s forwards; }
.skel { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--surface); }
.skel i { grid-row: span 2; width: 44px; height: 44px; border-radius: 50%; }
.skel b { display: block; height: 12px; border-radius: 6px; }
.skel b + b { width: 55%; }
.skel-card { grid-template-columns: minmax(0, 1fr); padding: 16px; border-radius: 22px; gap: 10px; }
.skel-card i { display: none; }
.skel i, .skel b { background: var(--surface-2); }
@keyframes skel-in { to { opacity: 1; } }
@keyframes skel-shimmer { to { background-position: -300% 0; } }
@media (prefers-reduced-motion: no-preference) { .skel i, .skel b { background: linear-gradient(90deg, var(--surface-2) 35%, var(--line) 50%, var(--surface-2) 65%) 0 0 / 300% 100%; animation: skel-shimmer 1.4s linear infinite; } }
@media (prefers-reduced-motion: reduce) { .skel-wrap { animation: skel-in .01s linear .25s forwards !important; } }
.setup-opts { margin-top: 12px; }
.setup-opts-toggle { width: 100%; min-height: 44px; padding: 10px 12px; border: 0; border-radius: 14px; background: var(--surface-2); color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; }
.setup-opts-toggle:active { transform: scale(.99); }
.setup-opts-summary { font-size: 13px; font-weight: 600; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.setup-opts-act { display: inline-flex; align-items: center; gap: 3px; flex: none; font-size: 13px; font-weight: 600; color: var(--muted); }
.setup-opts-chev { width: 16px; height: 16px; flex: none; transition: transform .18s; }
.setup-opts-toggle[aria-expanded="true"] .setup-opts-chev { transform: rotate(180deg); }
.setup-opts-panel { margin-top: 14px; }

.teams { display: grid; gap: 10px; margin-top: 14px; position: relative; }
.team { border-radius: 18px; padding: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }
.team::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--c); }
.team .thead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.team .tname { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.team .tname::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.team input { width: 100%; min-width: 0; border: 1px solid transparent; background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.team input:focus-visible { outline: none; border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.serve-pick { border: 0; background: transparent; border-radius: 999px; padding: 5px 10px 5px 6px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.serve-pick .ball { opacity: .35; }
.serve-pick[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink); }
.serve-pick[aria-pressed="true"] .ball { opacity: 1; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .25); }
.swap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--surface); background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 16px; padding: 0; }
.ball { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; background: radial-gradient(circle at 35% 35%, #F4FAB8 0 16%, var(--ball) 17%); }

.roster { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.roster .rhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; max-width: 100%; overflow-wrap: anywhere; }
.chip-btn .r { font-family: var(--display); font-stretch: 75%; font-weight: 700; font-size: 14px; color: var(--muted); }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-btn[aria-pressed="true"] .r { color: inherit; opacity: .65; }
.chip-btn.editing { border-style: dashed; }
.chip-btn.editing::after { content: "✕"; font-size: 12px; color: var(--danger); }
.add-player { display: flex; gap: 8px; }
.add-player input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.new-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.link { border: 0; background: transparent; padding: 4px 2px; font-size: 14px; font-weight: 600; color: var(--blue-text); }
.link.armed { color: var(--danger); }

.forecast { margin-top: 16px; border-radius: 16px; background: var(--surface-2); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
.forecast .fc-k { font-size: 12px; color: var(--muted); font-weight: 500; }
.forecast .fc-who { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.forecast .fc-score { grid-row: 1 / span 2; grid-column: 2; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 34px; line-height: 1; }
.forecast .fc-note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin: 4px 0 0; }

.btn { border: 0; border-radius: 16px; padding: 16px 20px; font-weight: 700; font-size: 16px; display: inline-flex; justify-content: center; align-items: center; gap: 10px; }
.btn:active { transform: scale(.985); }
.btn-ink { background: var(--ink); color: var(--bg); }
.btn-ball { background: var(--ball); color: var(--ball-ink); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-soft { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--danger); color: #fff; }
.btn.block { width: 100%; }
.start { margin-top: 18px; }

/* Lists */
.games { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.game { background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; }
.game .lines { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.game .line { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; }
.game .tick { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.game .who { min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
.game .win .who { color: var(--ink); font-weight: 600; }
.game .pts { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 26px; line-height: 1; min-width: 2ch; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.game .win .pts { color: var(--ink); }
.game .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-left: 18px; }
.g-reacts { grid-column: 1 / -1; padding-left: 18px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.rx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: 600 14px/1 var(--body); cursor: pointer; }
.rx-btn:active { transform: scale(.97); }
.rx-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rx-btn.rx-add { color: var(--muted); font-size: 13px; padding: 0 13px; }
.rx-btn.rx-add[aria-expanded="true"] { background: var(--surface); color: var(--ink); border-color: var(--ink); }
.rx-emoji { font-size: 16px; line-height: 1; }
.rx-n { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 15px; line-height: 1; font-variant-numeric: tabular-nums; }
.tag { background: var(--surface-2); border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 500; }
.month { display: flex; flex-direction: column; gap: 12px; }
.month-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.month-stats div { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; }
.month-stats b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.month-stats span { font-size: 12px; color: var(--muted); }
.month-facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.month-facts li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.month-facts .mk { color: var(--muted); flex: none; }
.month-facts .mv { text-align: right; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.pl-link { border: 0; background: transparent; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.g-actions { display: flex; gap: 12px; align-self: start; }
.g-actions .link { font-size: 13px; padding: 2px 0; }
.tag.warn { background: color-mix(in srgb, var(--down) 14%, transparent); color: var(--down); }
.tag.confirmed { background: color-mix(in srgb, var(--up, #1f9d55) 14%, transparent); color: var(--up, #1f9d55); }
.tag.logged { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue-text); }

.empty { background: var(--surface); border-radius: 22px; padding: 24px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty p { margin: 0; color: var(--muted); max-width: 42ch; }

.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.totals div { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.totals b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.totals span { font-size: 13px; color: var(--muted); }

/* Leaders */
.podium { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; align-items: end; }
.step { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.step-main { border: 0; background: transparent; font: inherit; color: inherit; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; width: 100%; min-width: 0; }
.step .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 17px; margin-bottom: 6px; }
.step.s1 .avatar { width: 58px; height: 58px; font-size: 21px; box-shadow: 0 0 0 4px var(--ball); }
.step .pl-name { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; line-height: 1.2; }
.step .pl-rating { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.step.s1 .pl-rating { font-size: 38px; }
.step .block { border: 0; font: inherit; cursor: pointer; width: 100%; margin-top: 2px; border-radius: 16px 16px 6px 6px; display: flex; justify-content: center; padding: 8px 0 0; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 24px; background: var(--surface); box-shadow: var(--shadow); color: var(--muted); }
.step.s1 .block { height: 96px; background: var(--ink); color: var(--ball); }
.step.s2 .block { height: 70px; }
.step.s3 .block { height: 52px; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.prow .avatar-mini { width: 34px; height: 34px; font-size: 12px; --r: 23px; }
.prow { width: 100%; background: var(--surface); border-radius: 16px; padding: 6px 8px 6px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.prow-main { border: 0; background: transparent; font: inherit; color: inherit; text-align: left; width: 100%; min-width: 0; min-height: 44px; padding: 6px 0; cursor: pointer; display: grid; grid-template-columns: 2.2ch auto 1fr; gap: 10px; align-items: center; }
.prow .rank { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 20px; color: var(--muted); text-align: center; }
.prow:first-child .rank { color: var(--ink); }
.prow .pinfo { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.prow .pname { font-weight: 600; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.prow .pstats { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.prow .rel { display: inline-flex; align-items: center; gap: 6px; }
.prow .rel i { width: 44px; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; display: inline-block; position: relative; }
.prow .rel i b { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 2px; }
.prow .pr { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
.prow .rating { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; padding: 4px 6px 0; }
.badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
.badge.prov { background: var(--surface-2); color: var(--muted); }
.note-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); font-size: 14px; }
.note-card p { margin: 0; }
.badge.hot { background: var(--ball); color: var(--ball-ink); }
.streak-badge { display: inline-flex; align-items: center; gap: 2px; background: var(--ball); color: var(--ball-ink); border-radius: 999px; padding: 2px 7px 2px 5px; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.streak-badge svg { width: 14px; height: 14px; flex: none; }
.delta { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat { color: var(--muted); font-weight: 500; }
.delta-btn { border: 0; background: transparent; font: inherit; color: inherit; padding: 0 2px; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 999px; }
.delta-pill { display: inline-flex; align-items: center; gap: 3px; background: var(--surface-2); border-radius: 999px; padding: 4px 9px; line-height: 1.2; transition: transform .1s ease; }
.delta-btn:active .delta-pill { transform: scale(.96); }
.sheet-bg.explain { z-index: 94; }
.exp-hero { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.exp-move { display: inline-flex; align-items: baseline; gap: 8px; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 38px; line-height: .95; font-variant-numeric: tabular-nums; }
.exp-move .exp-before { color: var(--muted); font-size: 28px; }
.exp-move .exp-sep { color: var(--muted); font-size: 22px; font-family: var(--body); font-weight: 500; }
.exp-delta { font-size: 15px; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); }
.exp-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.exp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 340px) { .exp-grid { grid-template-columns: 1fr; } }
.exp-box { background: var(--surface-2); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.exp-box .exp-k { font-size: 12px; font-weight: 600; color: var(--muted); }
.exp-box b { font-size: 16px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.exp-box small { font-size: 13px; color: var(--muted); }
.exp-why { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.exp-why p { color: var(--ink); font-size: 15px; line-height: 1.45; }
.exp-why .exp-note { color: var(--muted); font-size: 13px; }
.awards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.awards > button { border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.awards .aw-k { font-size: 13px; color: var(--muted); }
.awards .aw-name { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; line-height: 1.2; }
.awards .aw-v { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 26px; line-height: 1; margin-top: auto; padding-top: 6px; }

/* Rules */
.rules { display: flex; flex-direction: column; gap: 10px; }
.rule { background: var(--surface); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.rule p, .rule ul { margin: 0; color: var(--muted); max-width: 62ch; }
.rule ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.rule b { color: var(--ink); }
.call-demo { display: flex; gap: 10px; }
.call-demo div { flex: 1; background: var(--surface-2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
.call-demo strong { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: 1; }
.call-demo small { font-size: 12px; color: var(--muted); text-align: center; }

/* Tab bar */
.tabs {
  position: fixed; left: 0; right: var(--sbw, 0px); bottom: 0; z-index: 20; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(10px, calc(env(safe-area-inset-bottom, 0px) - 14px));
}
.tabs::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(100% + 28px); background: linear-gradient(to top, var(--bg) 30%, transparent); pointer-events: none; z-index: -1; }
.tabs nav {
  pointer-events: auto; max-width: 420px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 6px;
  background: color-mix(in srgb, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 12px 34px -12px rgb(0 0 0 / .35);
}
.tabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
.tabs button[hidden] { display: none; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* Scoring screen: a floodlit night court. Two rounded team panels with glowing gradients and condensed numerals,
   a glass score-call capsule sitting on the net tape between them, and the serving side lit while the other dims. */
.court {
  position: fixed; inset: 0; z-index: 40; color: #fff;
  background: radial-gradient(120% 55% at 50% 50%, #132033 0%, #070B11 72%);
  display: grid; grid-template-rows: auto 1fr auto 1fr;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
.court-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 10px 0 12px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; color: #fff; background: rgb(255 255 255 / .08); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .1); display: inline-grid; place-items: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:disabled { opacity: .3; }
.icon-btn.wide { width: auto; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.match { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.match b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 24px; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.match span { font-size: 12px; color: rgb(255 255 255 / .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cright { display: flex; gap: 8px; }

.half {
  --c1: #4361FF; --c2: #1A2BA6;
  border: 0; padding: 0; color: #fff; text-align: left; display: block; position: relative; overflow: hidden; border-radius: 30px;
  background: linear-gradient(155deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow: 0 24px 48px -28px var(--c1), inset 0 1px 0 rgb(255 255 255 / .2);
  transition: transform .12s ease, filter .3s ease;
}
.half[data-k="b"] { --c1: #17B988; --c2: #07634A; }
.half::before { content: ""; position: absolute; inset: 0; background: rgb(6 10 16 / 0); transition: background .3s ease; pointer-events: none; }
.half.idle::before { background: rgb(6 10 16 / .3); }
.half.idle .big { color: rgb(255 255 255 / .82); }
.half:active { transform: scale(.985); }

.half .inner { position: absolute; inset: 0; padding: 18px 20px 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }

.team-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avs { display: flex; flex: none; }
.avs i { width: 34px; height: 34px; border-radius: 50%; background: rgb(255 255 255 / .2); display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 13px; box-shadow: 0 0 0 2px var(--c2); }

.names { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }

.badges { margin-left: auto; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex: none; }
.pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 5px 10px; background: rgb(255 255 255 / .16); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill.serve { background: var(--ball); color: var(--ball-ink); }
.pill.serve .ball { width: 10px; height: 10px; background: radial-gradient(circle at 35% 35%, #fff 0 18%, #B9CC22 19%); }
.pill.gp { background: #fff; color: #0E1726; animation: gp 1.6s ease-in-out infinite; }

.score-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }

.big { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: clamp(112px, 25vh, 240px); line-height: .78; letter-spacing: -.045em; font-variant-numeric: tabular-nums; text-shadow: 0 8px 30px rgb(0 0 0 / .2); }
.big.bump { animation: bump .36s cubic-bezier(.2, .9, .3, 1.25); }
@keyframes bump { 0% { transform: translateY(18px) scale(.9); opacity: .3; } 100% { transform: none; opacity: 1; } }
.side-mini { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; font-weight: 500; color: rgb(255 255 255 / .78); padding-bottom: 4px; }

.progress { height: 4px; border-radius: 2px; background: rgb(255 255 255 / .16); overflow: hidden; }
.progress b { display: block; height: 100%; background: #fff; border-radius: 2px; transition: width .35s ease; }
.ripple { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: rgb(255 255 255 / .5); pointer-events: none; animation: ripple .65s ease-out forwards; }
@keyframes ripple { to { transform: scale(20); opacity: 0; } }
.celebration-confetti { position: fixed; inset: 0; z-index: 96; overflow: hidden; pointer-events: none; }
.celebration-confetti i { position: absolute; left: 50%; top: 38%; width: 9px; height: 6px; border-radius: 2px; background: var(--confetti); transform: translate(-50%, -50%) rotate(0deg); }
@media (prefers-reduced-motion: no-preference) {
  .celebration-confetti i { animation: confetti-burst 900ms cubic-bezier(.16, .8, .3, 1) var(--d, 0ms) forwards; }
}
@keyframes confetti-burst { to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .celebration-confetti { display: none; } }

.net { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; }
.net::before { content: ""; position: absolute; left: -12px; right: -12px; top: 42px; height: 3px; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .6) 18%, rgb(255 255 255 / .6) 82%, transparent); }
.call { position: relative; display: flex; gap: 4px; padding: 5px; border-radius: 22px; background: rgb(15 22 34 / .86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .12), 0 14px 34px -12px rgb(0 0 0 / .9); }
.call div { width: 60px; display: flex; flex-direction: column; align-items: center; padding: 7px 0 6px; border-radius: 17px; }
.call b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }

.call div:first-child small { color: rgb(27 33 4 / .7); }
.net .who { font-size: 13px; color: rgb(255 255 255 / .72); text-align: center; }
.net .who b { color: #fff; font-weight: 600; }
.net .watch-chip { min-height: 44px; max-width: calc(100vw - 32px); padding: 6px 16px; line-height: 1.2; text-wrap: balance; border: 0; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff; background: rgb(0 0 0 / .38); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .22); }
.net .first-hint { font-size: 12px; font-weight: 600; color: var(--ball); text-align: center; }
@media (orientation: landscape) and (min-width: 640px) {
  .court { grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr; column-gap: 12px; }
  .court-top { grid-column: 1 / -1; }

  .court > .half[data-k="b"] { grid-column: 3; grid-row: 2; }
  .net::before { left: 50%; right: auto; top: -10px; bottom: -10px; width: 3px; height: auto; transform: translateX(-50%); background: linear-gradient(transparent, rgb(255 255 255 / .6) 15%, rgb(255 255 255 / .6) 85%, transparent); }
  .call { flex-direction: column; }
  .half[data-k="b"] .inner { flex-direction: column; padding: 18px 20px 22px; }
  .half[data-k="b"] .score-row { align-items: flex-end; }
  .net .who, .net .first-hint { max-width: 150px; text-align: center; position: relative; background: #0A111B; border-radius: 10px; padding: 4px 8px; }
  .court .big { font-size: min(44vh, 17vw); }
}
@media (max-height: 640px) { .big { font-size: clamp(84px, 22vh, 200px); } .avs i { width: 28px; height: 28px; font-size: 12px; } }

.toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 95; background: var(--ball); color: var(--ball-ink); font-weight: 700; font-size: 15px; padding: 11px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgb(0 0 0 / .35); max-width: calc(100% - 32px); text-align: center; animation: drop .3s ease-out; }
@keyframes drop { from { transform: translate(-50%, -10px); opacity: 0; } }

/* Replay of a game scored live */
.rp-title { font-weight: 600; color: var(--ink) !important; overflow-wrap: anywhere; }
.rp-chart .rp-sum { font-size: 14px; margin: 6px 2px 0; color: var(--ink); }
/*REPLAYCHART-CSS-START*/
.rp-svg { display: block; width: 100%; height: auto; touch-action: pan-y; cursor: pointer; }
.rp-zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
.rp-ax { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.rp-line { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; opacity: .6; }
.rp-run { fill: none; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
.rp-run.t0 { stroke: var(--blue); }
.rp-run.t1 { stroke: var(--green); }
.rp-so { stroke: var(--muted); stroke-width: 2; }
.rp-cur { stroke: var(--ink); stroke-width: 1; }
.rp-dot { fill: var(--ball); stroke: var(--ink); stroke-width: 2.5; }
/*REPLAYCHART-CSS-END*/
.rp-key { display: flex; flex-direction: column; gap: 4px; margin: 8px 2px 6px; font-size: 13px; color: var(--muted); }
.rp-key i { display: inline-block; width: 18px; margin-right: 8px; vertical-align: middle; }
.rp-key .line-sw { height: 0; border-top: 2px solid var(--ink); opacity: .6; }
.rp-key .run-sw { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--blue) 50%, var(--green) 50%); }
.rp-key .so-sw { height: 9px; width: 0; border-left: 2px solid var(--muted); margin-left: 8px; margin-right: 16px; }
.rp-board { display: grid; gap: 6px; }
.rp-team { display: grid; grid-template-columns: 8px 1fr auto; gap: 12px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 10px 14px; }
.rp-team.on { box-shadow: inset 0 0 0 2px var(--c); }
.rp-team .tick { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.rp-team .who { min-width: 0; overflow-wrap: anywhere; font-weight: 600; display: flex; flex-direction: column; }
.rp-team .who small { font-weight: 500; font-size: 13px; color: var(--muted); }
.rp-team .pts { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: .95; font-variant-numeric: tabular-nums; }
.sheet p.rp-say { color: var(--ink); font-size: 16px; min-height: 4.4em; }
.rp-scrub { width: 100%; height: 32px; margin: 0; accent-color: var(--blue); }
.rp-ctl { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; }
.rp-ctl .btn { min-height: 52px; padding: 12px 10px; justify-content: center; gap: 6px; }
.rp-ctl .btn svg { width: 20px; height: 20px; flex: none; }

/* Sheets */
.sheet-bg { position: fixed; inset: 0; z-index: 70; background: rgb(5 9 15 / .55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg.top { z-index: 90; }
.sheet-bg.share { z-index: 92; }
/* Share a result: preview of the card image (4:5), with the image's own rounded corners */
.share-prev { align-self: center; flex: none; width: min(100%, 300px, calc((100dvh - 380px) * .8)); aspect-ratio: 4 / 5; border-radius: 7.8% / 6.2%; overflow: hidden; box-shadow: 0 18px 40px -22px rgb(5 9 15 / .55); }
.share-prev.busy { background: var(--surface-2); }
.share-prev img { display: block; width: 100%; height: 100%; transition: opacity .2s; }
.share-prev.busy img { opacity: .45; }
.share-prev img:not([src]) { visibility: hidden; }
.share-pill { padding: 9px 14px; border-radius: 999px; font-size: 14px; gap: 6px; flex: none; }
.share-pill svg, .share-ic { width: 16px; height: 16px; flex: none; }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; border-radius: 28px 28px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; animation: rise .32s cubic-bezier(.2, .8, .2, 1); }

.sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-top: -10px; flex: none; }
.sheet p { margin: 0; color: var(--muted); }
.sheet .btns { display: flex; flex-direction: column; gap: 8px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 16px; display: grid; place-items: center; padding: 0; flex: none; }
.result { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 20px; padding: 16px; }
.result .side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.result .side:last-child { text-align: right; align-items: flex-end; }
.result .side small { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.result .side b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; }
.result .side.won b { color: var(--c); }
.result .vs { font-size: 13px; color: var(--muted); }
.winner-line { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 30px; letter-spacing: -.02em; line-height: 1.05; margin: 0; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; }
.facts b { font-weight: 700; font-variant-numeric: tabular-nums; }
.facts small { font-size: 12px; color: var(--muted); }
.changes { display: flex; flex-direction: column; gap: 6px; }
.ch { display: grid; grid-template-columns: 8px 1fr auto auto; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 9px 12px; }
.ch .tick { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.ch .nm { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.ch .rt { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 22px; font-variant-numeric: tabular-nums; }
.expect { font-size: 14px; color: var(--muted); }

/* Log a result */
.log-teams { display: grid; gap: 10px; }
.log-team { border-radius: 18px; background: var(--surface-2); padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; position: relative; overflow: hidden; }
.log-team::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--c); }
.log-team .names { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.log-team input[type="text"] { width: 100%; min-width: 0; border: 1px solid transparent; background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.stepper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stepper input { width: 76px; text-align: center; border: 1px solid transparent; background: var(--surface); border-radius: 14px; padding: 4px 0; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: 1.1; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .sb { display: flex; gap: 4px; }
.stepper .sb button { width: 36px; height: 32px; border-radius: 10px; border: 0; background: var(--surface); font-size: 18px; font-weight: 700; padding: 0; }
.when { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.when input { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px; font-size: 15px; }
.err { color: var(--danger); font-size: 14px; font-weight: 600; margin: 0; }

/* Club */
button.sync { cursor: pointer; font-weight: 600; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: block; }
.sync.warn::before { background: var(--down); }
.code-card { background: var(--surface-2); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.org-card .code { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: .08em; user-select: all; }

.code-card p { font-size: 14px; }
.share-card { align-items: center; text-align: center; }
.share-card .invite, .share-card .btn.block { align-self: stretch; }
.share-qr { background: #fff; border-radius: 16px; padding: 10px; width: min(280px, 100%); box-sizing: border-box; }
.share-qr svg { display: block; width: 100%; height: auto; }
.invite { display: flex; gap: 8px; }
.invite input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.pk-banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 44px; margin: 12px 0 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
.ann-banner { display: flex; align-items: flex-start; gap: 8px; margin: 12px 0 0; padding: 4px 4px 4px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-2); color: var(--ink); }

.ann-x { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; }
.ann-x:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.pk-banner .pk-code { font-family: var(--display); letter-spacing: .08em; color: var(--blue-text); }
.pk-banner > span:last-child { color: var(--muted); text-align: right; }
.pk-h { margin: 16px 0 6px; font-size: 15px; }
.pk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pk-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; }
.pk-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.pk-table th, .pk-table td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
.pk-table th:first-child, .pk-table td:first-child { text-align: left; }
.upload-card { border: 2px dashed color-mix(in srgb, var(--blue) 45%, transparent); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

.club-form { display: flex; flex-direction: column; gap: 8px; }

.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.deleted li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
.deleted li span { min-width: 0; overflow-wrap: anywhere; }
.field-input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.org-card { background: var(--surface-2); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.org-head { display: flex; justify-content: space-between; align-items: center; }
.org-card p { font-size: 14px; }
.ot-card { background: var(--surface-2); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.ot-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.ot-row { justify-content: space-between; text-align: left; margin-top: 8px; min-width: 0; }

.ot-card .mem-acts .btn { padding: 12px 18px; }
.ot-entry { margin-top: 10px; }
.ot-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ot-t small { font-size: 13px; font-weight: 500; color: var(--muted); }
.ot-chev { font-size: 22px; line-height: 1; color: var(--muted); flex: none; }
.bell-btn { position: relative; width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--line); padding: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center; }
.bell-btn svg { width: 20px; height: 20px; }
.bell-n { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--ink); color: var(--bg); box-shadow: 0 0 0 2px var(--bg); font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
.inbox-sec { margin: 14px 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.inbox-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.inbox-item { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }

(function () {
  var left = 5;
  function send(o) {
    if (left-- <= 0) return;
    try { o.page = location.pathname; fetch('/api/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o), keepalive: true }).catch(function () {}); } catch (e) {}

})();

<script>
// Club display mode: /?display=CODE turns the page into a full-screen join sign for a TV or
// monitor at the courts. The QR code is the club's invite link (/?club=CODE), drawn with the
// qrcode-generator library above (MIT License, (c) Kazuhiko Arase). The club name comes from
// the same club lookup the invite flow uses, and is refreshed every 5 minutes.
(function () {
  var code = (new URLSearchParams(location.search).get('display') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!code) return;
  var el = document.getElementById('club-display');
  if (!el) return;
  document.documentElement.classList.add('dsp-lock');
  el.hidden = false;
  var link = location.origin + '/?club=' + code;
  document.getElementById('dsp-code').textContent = code;
  document.getElementById('dsp-exit').href = link;
  try {
    var qr = qrcode(0, 'M');
    qr.addData(link);
    qr.make();
    document.getElementById('dsp-qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 12, scalable: true });
  } catch (e) { document.getElementById('dsp-qr').style.display = 'none'; }
  var nameEl = document.getElementById('dsp-name');
  var named = false;
  function loadName() {
    fetch('/api/club?code=' + code, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.club && d.club.name) { named = true; nameEl.textContent = d.club.name; }
        else if (!named) nameEl.textContent = 'Join our club';
      })
      .catch(function () { if (!named) nameEl.textContent = 'Join our club'; });
  }
  loadName();
  setInterval(loadName, 5 * 60 * 1000);
  // The open play court board, when the club has one on: courts with live scores, and who is up next. Names are only ever
  // put on the page as text. A failed poll keeps what is showing.
  var boardEl = document.getElementById('dsp-board');
  function mk(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  var team = function (t) { return (t || []).join(' & '); };
  function drawBoard(b) {
    boardEl.textContent = '';
    el.classList.toggle('dsp-has-board', !!b);
    boardEl.hidden = !b;
    if (!b) return;
    var courts = mk('div', 'dsp-courts');
    b.courts.forEach(function (ct) {
      var card = mk('section', 'dsp-court');
      var sug = (b.suggestions || []).filter(function (s) { return s.court === ct.court; })[0];
      var h = mk('h2'); h.appendChild(mk('span', '', 'Court ' + ct.court)); card.appendChild(h);
      if (ct.teams) {
        var lv = ct.live;
        [0, 1].forEach(function (i) {
          var row = mk('div', 'dsp-team' + (lv && lv.winner === i ? ' win' : ''));
          row.appendChild(mk('span', '', team(ct.teams[i])));
          if (lv) row.appendChild(mk('span', 'dsp-score', String(lv.score[i])));
          card.appendChild(row);
          if (i === 0) card.appendChild(mk('div', 'dsp-vs', 'vs'));
        });
      } else {
        card.appendChild(mk('div', 'dsp-free', ct.hold ? 'Winners stay: ' + team(ct.hold) : 'Free'));
        if (sug) card.appendChild(mk('div', 'dsp-free', 'Next: ' + team(sug.teams[0]) + ' vs ' + team(sug.teams[1])));
      }
      courts.appendChild(card);
    });
    boardEl.appendChild(courts);
    var q = mk('section', 'dsp-queue');
    q.appendChild(mk('h2', '', 'Waiting' + (b.queue.length ? ' (' + b.queue.length + ')' : '')));
    var chips = mk('div', 'dsp-chips'), next = {};
    (b.suggestions || []).forEach(function (s) { s.teams.forEach(function (t) { t.forEach(function (p) { next[p] = true; }); }); });
    b.queue.slice(0, 30).forEach(function (p) { chips.appendChild(mk('span', 'dsp-chip' + (next[p] ? ' next' : ''), p)); });
    if (b.queue.length > 30) chips.appendChild(mk('span', 'dsp-chip', '+' + (b.queue.length - 30) + ' more'));
    if (!b.queue.length) chips.appendChild(mk('span', 'dsp-chip', 'Nobody waiting'));
    q.appendChild(chips);
    boardEl.appendChild(q);
  }
  // Sends the last answer's ETag back: an unchanged board comes back as an empty 304 and is not redrawn (Sync v2).
  var boardTag = '';
  function loadBoard() {
    fetch('/api/live?code=' + code + '&board=1', { cache: 'no-store', headers: boardTag ? { 'If-None-Match': boardTag } : {} })
      .then(function (r) {
        if (r.status === 304) return null;
        if (!r.ok) return null;
        boardTag = r.headers.get('ETag') || '';
        return r.json();
      })
      .then(function (d) { if (d) drawBoard(d.board); })
      .catch(function () {});
  }
  loadBoard();
  setInterval(loadBoard, 5000);
})();
</script>

async function moveIn(raw) {
  const code = Move.clean(raw);
  if (!code) { clubSheet.error = 'Transfer codes are 12 letters and numbers.'; renderClub(); return; }
  clubSheet.busy = true; clubSheet.error = ''; renderClub();
  try {
    const data = await api('transfer', { method: 'POST', body: JSON.stringify({ action: 'claim', id: await Move.id(code) }) });
    let payload; try { payload = await Move.open(code, data.blob); } catch { throw new Error('That code did not unlock the transfer.'); }

    clubSheet = { view: 'club', msg: `Moved ${added} club${added === 1 ? '' : 's'} to this phone. Organizer access and player claims came with them.` };

const toBuf = s => Uint8Array.from(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')), ch => ch.charCodeAt(0)).buffer;

function credJson(c) {

  if (r.attestationObject) { response.attestationObject = fromBuf(r.attestationObject); response.transports = r.getTransports ? r.getTransports() : []; }

// Hands the server this phone's own tokens, once, so the account can bring the same clubs and names to another phone.
async function acctClaim(only) { // `only`: just that club code
  const items = clubs.filter(c => !only || c.code === only).map(c => ({ code: c.code, ownerToken: owners[c.code] || '', playerName: (me[c.code] || {}).name || '', playerToken: (me[c.code] || {}).token || '' })).filter(i => i.ownerToken || i.playerToken);

async function acctRestore(only, force) {
  const want = (force ? acctLive() : acctMissing()).filter(i => !only || i.code === only);
  let n = 0;
  for (let i = 0; i < want.length; i += 30) {
    const d = await acctPost({ action: 'restore', items: want.slice(i, i + 30).map(w => ({ code: w.code, kind: w.kind, name: w.name })) });

async function pinSet(oldPin, pin, again) {

  if (pin !== String(again || '').trim()) { clubSheet.error = "The two PINs don't match."; renderClub(); return; }
  clubSheet.busy = true; clubSheet.error = ''; renderClub();
  try {
    const data = await api('club', { method: 'POST', body: JSON.stringify(Object.assign({ code: club.code, action: 'set-pin', pin, oldPin: String(oldPin || '').trim() || (pins[club.code] || ''), ownerToken: owners[club.code] || '', device: true }, odWho())) });
    rememberOwner(club.code, data.ownerToken);
    club.hasPin = true; club.openClaim = false; saveClubs();
    rememberPin(club.code, data.organizerKey ? ':' + data.organizerKey : data.deviceKey ? pin + ':' + data.deviceKey : pin);
    club.shortPin = false; saveClubs();
    clubSheet = { view: 'club', msg: 'Organizer PIN saved. Share it only with organizers.' };
    render();
  } catch (err) { clubSheet.busy = false; clubSheet.error = err.message; renderClub(); }
}

function failAct(kind, uid, el) {
  const op = outbox.find(o => o.uid === uid);
  if (kind === 'export') {
    const url = URL.createObjectURL(new Blob([Outbox.exportJson(failedOps(), club.code)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `dink-score-unsent-${club.code}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    return;
  }
  if (!op) return;
  if (kind === 'discard') { if (!confirm('Discard this change for good? It will not be sent to the club.')) return; outbox.splice(outbox.indexOf(op), 1); }
  else if (kind === 'save') {
    const row = el.closest('li'), v = [...row.querySelectorAll('[data-fs]')].map(i => i.value);
    if (!Outbox.rescore(op, v[0], v[1])) { showToast('Enter the two scores as whole numbers.', false); return; }
  } else { Outbox.retry(op); if (Outbox.pinOp(op) && pins[op.code]) op.pin = pins[op.code]; }
  store.set('pb.outbox', outbox); renderClub(); updateSyncPill(); flush();
}

async function clubJoinByCode(raw) {
  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6) { clubSheet.error = 'Club codes are 6 letters and numbers.'; renderClub(); return; }
  clubSheet.busy = true; clubSheet.error = ''; renderClub();
  try {
    const data = await api('club?code=' + code);
    await joinClub(data.club.code, data.club.name);
    clubSheet = { view: 'club' };
    showToast(`Joined ${data.club.name}`, false);
  } catch (err) { clubSheet.busy = false; clubSheet.error = err.message; }
  afterJoin();
}
// After joining: first "Who are you?", then on to whatever brought them here (logging a result, starting a game).
function afterJoin() {
  if (club && !myName() && !whoamiSkipped()) { clubSheet = { view: 'whoami', afterJoin: true }; render(); renderClub(); return; }
  if (club && pickup && pickupSaveAfter) { pickupSaveAfter = false; clubSheet = { view: 'pickup' }; render(); renderClub(); pickupSaveToClub(); return; }
  if (club && saveAfterJoin) { const ids = saveAfterJoin; saveAfterJoin = null; clubSheet = { view: 'club', msg: 'Adding your game…' }; render(); renderClub(); uploadLocalGames(ids); return; }
  render(); renderClub();
}
async function clubCreate(name, pin) {
  name = String(name || '').trim();
  pin = String(pin || '').trim();
  if (!name) { clubSheet.error = 'Give your club a name.'; renderClub(); return; }
  if (pin && !/^\d{6,8}$/.test(pin)) { clubSheet.error = 'Organizer PINs are 6 to 8 digits. Leave it blank and we will make a code for you.'; renderClub(); return; }
  if (!clubs.length && acctIn() && acctClubs().size && !clubSheet.confirmNew) { // signed in, nothing here yet: likely a new phone, not a new club
    const n = acctClubs().size;
    clubSheet.confirmNew = true; clubSheet.error = `Your account already has ${n} club${n === 1 ? '' : 's'}. Tap Bring my clubs to this phone above to get ${n === 1 ? 'it' : 'them'} back, or tap Create again to start a new club.`; renderClub(); return;
  }
  clubSheet.busy = true; clubSheet.error = ''; renderClub();
  try {
    const data = await api('club', { method: 'POST', body: JSON.stringify(pin ? { name, pin } : { name }) });
    rememberOwner(data.club.code, data.ownerToken);
    rememberPin(data.club.code, pin || data.organizerCode);
    await joinClub(data.club.code, data.club.name);
    clubSheet = { view: 'club', ...(data.organizerCode ? { newOrganizerCode: data.organizerCode } : {}) };
    acctAutoLink(data.club.code);
  } catch (err) { clubSheet.busy = false; clubSheet.error = err.message; }
  afterJoin();
}

// "This month" on the home screen: the club's (or this phone's) games since the 1st of the month.
function monthCard(games) {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const month = now.toLocaleDateString(undefined, { month: 'long' });
  const mine = games.filter(g => g.endedAt >= start);
  const title = club ? `${esc(club.name)} in ${esc(month)}` : `This month`;
  if (!mine.length) return `<section class="card month"><div class="sec-head"><h2 class="h-sub">${title}</h2></div><p class="note">No games yet in ${esc(month)}. Finished and logged games will show up here.</p></section>`;
  const players = new Map();
  let points = 0;
  for (const g of mine) {
    points += Number(g.score[0]) + Number(g.score[1]);
    for (const t of [0, 1]) for (const n of g.teams[t]) {
      if (isDefaultName(n)) continue;
      const k = n.trim().toLowerCase();
      const e = players.get(k) || { name: n.trim(), g: 0, w: 0 };
      e.g++; if (g.winner === t) e.w++;
      players.set(k, e);
    }
  }
  const list = [...players.values()];
  const active = [...list].sort((a, b) => b.g - a.g || b.w - a.w)[0];
  const winner = [...list].sort((a, b) => b.w - a.w || a.g - b.g)[0];
  const margin = g => Math.abs(Number(g.score[0]) - Number(g.score[1]));
  const biggest = [...mine].sort((a, b) => margin(b) - margin(a) || b.endedAt - a.endedAt)[0];
  const closest = [...mine].sort((a, b) => margin(a) - margin(b) || Math.max(...b.score) - Math.max(...a.score))[0];
  const who = n => `<button class="pl-link" data-player="${esc(n)}">${esc(n)}</button>`;
  const res = g => { const w = g.winner, l = 1 - w; return `${esc(teamLabel(g.teams[w]))} ${Number(g.score[w])}–${Number(g.score[l])}`; };
  const facts = [
    active ? `<li><span class="mk">Most active</span><span class="mv">${who(active.name)}, ${active.g} game${active.g === 1 ? '' : 's'}</span></li>` : '',
    winner && winner.w ? `<li><span class="mk">Most wins</span><span class="mv">${who(winner.name)}, ${winner.w} win${winner.w === 1 ? '' : 's'}</span></li>` : '',
    `<li><span class="mk">Biggest win</span><span class="mv">${res(biggest)}</span></li>`,
    mine.length > 1 ? `<li><span class="mk">Closest game</span><span class="mv">${res(closest)}</span></li>` : ''
  ].join('');
  return `<section class="card month"><div class="sec-head"><h2 class="h-sub">${title}</h2>${club ? '' : '<span class="note">On this phone</span>'}</div>
    <div class="month-stats"><div><b>${mine.length}</b><span>Games</span></div><div><b>${list.length}</b><span>Players</span></div><div><b>${points}</b><span>Points</span></div></div>
    <ul class="month-facts">${facts}</ul></section>`;
}

function leaderStats(games, mode) {
  const { tables } = DR.compute(games);
  const now = Date.now();
  const extra = new Map();
  for (const g of [...games].sort((a, b) => a.endedAt - b.endedAt)) {
    if ((g.mode === 'singles' ? 'singles' : 'doubles') !== mode) continue;
    for (const t of [0, 1]) for (const n of g.teams[t]) {
      const k = n.trim().toLowerCase();
      const e = extra.get(k) || { streak: 0, best: 0, diff: 0 };
      e.streak = g.winner === t ? e.streak + 1 : 0; e.best = Math.max(e.best, e.streak);
      e.diff += g.score[t] - g.score[1 - t];
      extra.set(k, e);
    }
  }
  return [...tables[mode].values()].filter(p => !isDefaultName(p.name)).map(p => {
    const e = extra.get(p.name.toLowerCase()) || { streak: 0, best: 0, diff: 0 };
    return Object.assign({}, p, e, { rel: Math.round(DR.reliability(p, now) * 100) });
  }).sort((a, b) => b.rating - a.rating);
}

}

    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }

}

// Would winning the next rally end the game for team t?
function isGamePoint(s, t) {
  if (s.winner !== null) return false;
  if (s.cfg.scoring !== 'rally' && s.serving !== t) return false; // side-out: only the serving side can score
  const next = s.score[t] + 1;
  return next >= s.cfg.target && next - s.score[1 - t] >= s.cfg.winBy;
}

// The server works these out (so they can't be faked); the app shows what it sends.
const progressInfo = () => (clubData && clubData.progress) || null;
function progressOf(name) {
  const p = progressInfo();
  return p && name ? p.players[String(name).trim().toLowerCase()] || null : null;
}
const ACH_ICON = { 'first-win': '🎉', 'games-10': '🏓', 'games-50': '🐀', 'games-100': '💯', 'streak-5': '🔥', 'streak-10': '☄️', 'shutout': '🧱',
  'marathon': '⏱️', 'giant-killer': '🗡️', 'partners-5': '🦋', 'rating-4': '📈', 'rating-45': '👑' };
const PLACE = ['Champion', 'Runner-up', 'Third place'];
const MEDAL = ['🥇', '🥈', '🥉'];
const daysLeft = end => Math.max(0, Math.ceil((end - Date.now()) / DAY));

// Weekly challenges, half-width tile beside Top player on the home screen.
function challengesTile() {
  const info = progressInfo();
  if (!club || !info || !myName()) return '';
  const mine = (progressOf(myName()) || {}).week || [];
  const items = info.week.challenges.map(c => {
    const st = mine.find(x => x.id === c.id) || { progress: 0, done: false };
    return `<li class="${st.done ? 'done' : ''}"><b>${st.done ? '✓ ' : ''}${esc(c.name)}</b><span class="ch-bar" aria-hidden="true"><i style="width:${Math.round(100 * st.progress / c.goal)}%"></i></span></li>`;
  }).join('');
  const d = daysLeft(info.week.end);
  return `<section class="tile ch-tile" aria-label="This week's challenges"><span class="t-k">This week's challenges</span><ul>${items}</ul><span class="t-foot">${d <= 1 ? 'New ones tomorrow' : `New ones in ${d} days`}</span></section>`;
}

// Tell the player when something new unlocks (checked after each refresh from the server).
function announceUnlocks() {
  if (!club || !myName()) return;
  const p = progressOf(myName()), info = progressInfo();
  if (!p || !info) return;
  const seenAll = store.get('pb.seenProgress', {});
  const seenKey = club.code + '|' + myName().toLowerCase();
  const seen = seenAll[seenKey];
  const now = { ach: p.achievements.map(a => a.id), ch: (p.week || []).filter(x => x.done).map(x => info.week.id + ':' + x.id), tr: p.trophies.map(t => t.season + t.mode) };
  seenAll[seenKey] = now; store.set('pb.seenProgress', seenAll);
  if (!seen) return; // first time on this phone: don't replay old unlocks
  const msgs = [];
  for (const id of now.ach) if (!seen.ach.includes(id)) { const a = info.achievements.find(x => x.id === id); if (a) msgs.push(`${ACH_ICON[id] || '🏅'} Achievement: ${a.name}!`); }
  for (const k of now.ch) if (!(seen.ch || []).includes(k)) { const c = info.week.challenges.find(x => k.endsWith(':' + x.id)); if (c) msgs.push(`✓ Challenge done: ${c.name}`); }
  for (const k of now.tr) if (!(seen.tr || []).includes(k)) { const t = p.trophies.find(x => x.season + x.mode === k); if (t) msgs.push(`${MEDAL[t.place - 1]} ${t.name} ${t.mode} ${PLACE[t.place - 1]}!`); }
  msgs.slice(0, 3).forEach((m, i) => setTimeout(() => showToast(m, false), i * 3200));
}

function rivalriesHTML(name, mode) {
  const k = name.trim().toLowerCase();
  const opp = new Map();
  for (const g of allGames()) {
    if ((g.mode === 'singles' ? 'singles' : 'doubles') !== mode) continue;
    const t = g.teams[0].some(n => n.trim().toLowerCase() === k) ? 0 : g.teams[1].some(n => n.trim().toLowerCase() === k) ? 1 : -1;
    if (t < 0) continue;
    for (const n of g.teams[1 - t]) {
      if (isDefaultName(n)) continue;
      const ok = n.trim().toLowerCase();
      const e = opp.get(ok) || { name: n.trim(), w: 0, l: 0, last: 0 };
      if (g.winner === t) e.w++; else e.l++;
      e.last = Math.max(e.last, g.endedAt);
      opp.set(ok, e);
    }
  }
  const rivals = [...opp.values()].filter(e => e.w + e.l >= 3).sort((a, b) => (b.w + b.l) - (a.w + a.l) || b.last - a.last).slice(0, 3);
  if (!rivals.length) return '';
  return `<div class="field" style="margin:0"><span class="lab">Rivalries</span><div class="rivals">${rivals.map((e, i) => {
    const lead = e.w > e.l ? 'leads' : e.w < e.l ? 'trails' : 'tied';
    return `<button class="rival ${lead}" data-player="${esc(e.name)}"><span class="avatar-mini">${avatarInner(e.name)}</span>

      <span class="rv-score">${e.w}–${e.l}</span></button>`;
  }).join('')}</div></div>`;
}
