<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pickleball scorekeeper with server tracking, saved players, a Dink Rating leaderboard and a game record.">
<meta name="theme-color" content="#0F241E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dink Score">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<title>Dink Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Layout: a members'-club scorecard. Setup reads like a ruled card, left-aligned; the scoring screen is the one bold moment:
   two painted court halves with real lines, serif numerals, and a dark net band carrying the score call. */
:root {
  --chalk: #EDF0EB;      /* page ground, cool chalk with a green bias */
  --card: #F8FAF6;       /* raised surfaces */
  --ink: #0F241E;        /* bottle green, text and net band */
  --ink-soft: #5B6E66;   /* secondary text */
  --rule: #D3DBD5;       /* hairlines */
  --cobalt: #2445B5;     /* team 1 court */
  --forest: #1D5A43;     /* team 2 court */
  --brass: #A88B4E;      /* wins, quiet emphasis */
  --ball: #D8E55A;       /* serve indicator only */
  --ball-ink: #20280A;
  --on-court: #FFFFFF;
  --danger: #A9381F;
  --up: #1B6A48;
  --down: #A9381F;
  --focus: #2445B5;
  --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chalk: #0B1612; --card: #12201B; --ink: #E6ECE8; --ink-soft: #92A49C; --rule: #22342D;
    --cobalt: #2D50C4; --forest: #22694F; --brass: #C7A866; --ball: #D8E55A; --ball-ink: #20280A;
    --on-court: #FFFFFF; --danger: #E06A4F; --up: #6FCB9F; --down: #EE8A72; --focus: #9DB4F2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chalk: #0B1612; --card: #12201B; --ink: #E6ECE8; --ink-soft: #92A49C; --rule: #22342D;
  --cobalt: #2D50C4; --forest: #22694F; --brass: #C7A866; --ball: #D8E55A; --ball-ink: #20280A;
  --on-court: #FFFFFF; --danger: #E06A4F; --up: #6FCB9F; --down: #EE8A72; --focus: #9DB4F2; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--chalk); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }

.app {
  max-width: 540px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 28px calc(104px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 32px;
}
.masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.wordmark { display: flex; align-items: center; gap: 10px; }
.wordmark svg { width: 30px; height: 30px; flex: none; }
.wordmark h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1; margin: 0; letter-spacing: -.01em; }
.sync { font-size: 12px; color: var(--ink-soft); text-align: right; max-width: 18ch; line-height: 1.3; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -.005em; text-wrap: balance; }
.sub { font-size: 14px; color: var(--ink-soft); margin: 4px 0 0; }

/* Resume banner */
.resume { background: var(--ink); color: var(--chalk); border-radius: 18px; padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; }
.resume .rs-label { font-size: 13px; opacity: .7; }
.resume .rs-score { font-family: var(--serif); font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
.resume button { grid-row: 1 / span 2; grid-column: 2; background: var(--ball); color: var(--ball-ink); border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 600; font-size: 15px; }

/* Scorecard form */
.card-form { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 7.5rem 1fr; gap: 12px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--rule); }
.row:first-of-type { border-top: 1px solid var(--rule); }
.row > .k { font-size: 14px; color: var(--ink-soft); }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opts button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; color: var(--ink); transition: background .15s, color .15s, border-color .15s; }
.opts button[aria-pressed="true"] { background: var(--ink); color: var(--chalk); border-color: var(--ink); }
.row .note { grid-column: 2; font-size: 13px; color: var(--ink-soft); margin: -4px 0 0; }

.matchup { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
.side { display: grid; grid-template-columns: 6px 1fr; gap: 0 14px; }
.side .swatch { border-radius: 3px; background: var(--c); }
.side .body { display: flex; flex-direction: column; gap: 8px; padding-block: 4px; }
.side .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.side .head span { font-size: 14px; color: var(--ink-soft); }
.side input { width: 100%; min-width: 0; border: 0; border-bottom: 1px solid var(--rule); background: transparent; padding: 8px 0; font-size: 17px; border-radius: 0; }
.side input::placeholder { color: color-mix(in srgb, var(--ink-soft) 70%, transparent); }
.side input:focus-visible { outline: none; border-bottom: 2px solid var(--c); padding-bottom: 7px; }
.serve-pick { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 13px; font-weight: 500; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px; }
.serve-pick .ball { opacity: .35; }
.serve-pick[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.serve-pick[aria-pressed="true"] .ball { opacity: 1; }
.versus { display: flex; align-items: center; gap: 12px; padding-left: 20px; }
.versus::before, .versus::after { content: ""; height: 1px; background: var(--rule); flex: 1; }
.versus span { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--ink-soft); }
.versus button { border: 1px solid var(--rule); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink-soft); }

.ball { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block;
  background: radial-gradient(circle at 35% 35%, #F1F7A6 0 18%, var(--ball) 19%); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .18); }

.start { margin-top: 26px; background: var(--ink); color: var(--chalk); border: 0; border-radius: 999px; padding: 17px 22px; font-weight: 600; font-size: 17px; display: flex; justify-content: center; align-items: center; gap: 10px; }
.start:active { transform: scale(.99); }

/* Games list */
.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.games { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.game { padding-block: 16px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; }
.game:first-child { border-top: 1px solid var(--rule); }
.game .lines { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.game .line { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; }
.game .tick { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.game .who { min-width: 0; overflow-wrap: anywhere; color: var(--ink-soft); }
.game .win .who { color: var(--ink); font-weight: 600; }
.game .pts { font-family: var(--serif); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; color: var(--ink-soft); }
.game .win .pts { color: var(--ink); }
.game .meta { grid-column: 1 / -1; font-size: 13px; color: var(--ink-soft); padding-left: 18px; }
.del { border: 0; background: transparent; padding: 4px 2px; font-size: 13px; color: var(--ink-soft); align-self: start; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
.del.armed { color: var(--danger); text-decoration-color: currentColor; font-weight: 600; }

.empty { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 28px 0; border-block: 1px solid var(--rule); }
.empty p { margin: 0; color: var(--ink-soft); max-width: 40ch; }
.link-btn { background: var(--ink); color: var(--chalk); border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 600; font-size: 15px; }

/* Stats */
.totals { display: grid; grid-template-columns: repeat(3, 1fr); border-block: 1px solid var(--rule); }
.totals div { padding: 16px 0 14px; display: flex; flex-direction: column; gap: 2px; }
.totals div + div { padding-left: 16px; border-left: 1px solid var(--rule); }
.totals b { font-family: var(--serif); font-weight: 400; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.totals span { font-size: 13px; color: var(--ink-soft); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 12px 4px; border-bottom: 1px solid var(--rule); font-size: 15px; }
th { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
td.num, th.num { text-align: right; }
td.name { font-weight: 500; }
.pct { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.pct .bar { width: 64px; height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.pct .bar i { display: block; height: 100%; background: var(--brass); }
.lead-star { color: var(--brass); margin-left: 6px; font-size: 13px; }

/* Rules */
.rules { display: flex; flex-direction: column; }
.rule { padding-block: 18px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr; gap: 6px; }
.rule:first-child { border-top: 1px solid var(--rule); }
.rule h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 23px; line-height: 1.15; }
.rule p, .rule ul { margin: 0; color: var(--ink-soft); max-width: 62ch; }
.rule ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.rule b { color: var(--ink); font-weight: 600; }
.call-demo { display: flex; gap: 14px; align-items: flex-end; margin: 6px 0 4px; }
.call-demo div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.call-demo strong { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1; color: var(--ink); }
.call-demo small { font-size: 12px; color: var(--ink-soft); }

/* Tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--chalk) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--rule);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-top: 6px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
.tabs nav { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { border: 0; background: transparent; padding: 8px 4px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--ink-soft); position: relative; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: -7px; width: 22px; height: 2px; border-radius: 1px; background: var(--ink); }

/* ---------- Scoring screen ---------- */
.court {
  position: fixed; inset: 0; z-index: 40; background: var(--ink);
  display: grid; grid-template-rows: auto 1fr auto 1fr;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  color: var(--on-court);
}
.court-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: #0A1A15; color: #E6ECE8; }
.court-top .info { font-size: 13px; opacity: .7; text-align: center; min-width: 0; }
.court-top button { border: 1px solid rgb(230 236 232 / .25); background: transparent; color: #E6ECE8; border-radius: 999px; padding: 7px 15px; font-weight: 500; font-size: 14px; }
.court-top button:disabled { opacity: .3; }
.half {
  border: 0; text-align: left; padding: 0; color: var(--on-court); background: var(--c);
  position: relative; overflow: hidden; display: block; transition: filter .1s;
}
.half:active { filter: brightness(1.08); }
.half[data-k="a"] { --c: var(--cobalt); }
.half[data-k="b"] { --c: var(--forest); }
/* Painted court: baseline and sidelines, kitchen line 30% from the net, centerline from kitchen to baseline. */
.half .paint { position: absolute; inset: 16px 16px 0 16px; border: 2px solid rgb(255 255 255 / .42); border-bottom: 0; pointer-events: none; }
.half[data-k="b"] .paint { inset: 0 16px 16px 16px; border-top: 0; border-bottom: 2px solid rgb(255 255 255 / .42); }
.half .paint::before { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: rgb(255 255 255 / .42); bottom: 30%; }
.half .paint::after { content: ""; position: absolute; width: 2px; left: calc(50% - 1px); background: rgb(255 255 255 / .42); top: 0; bottom: 30%; }
.half[data-k="b"] .paint::before { bottom: auto; top: 30%; }
.half[data-k="b"] .paint::after { top: 30%; bottom: 0; }
.half .kitchen { position: absolute; left: 18px; right: 18px; height: calc(30% - 2px); background: rgb(255 255 255 / .06); pointer-events: none; }
.half[data-k="a"] .kitchen { bottom: 0; }
.half[data-k="b"] .kitchen { top: 0; }
.half .content { position: absolute; inset: 0; padding: 30px 34px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 8px; }
.half[data-k="a"] .content { padding-bottom: calc(30% + 14px); }
.half[data-k="b"] .content { padding-top: calc(30% + 14px); align-items: start; }
.half[data-k="b"] .content { grid-template-areas: "players score"; }
.players { display: flex; flex-direction: column; gap: 6px; align-self: start; min-width: 0; }
.half[data-k="b"] .players { align-self: end; }
.player { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 500; opacity: .78; min-width: 0; overflow-wrap: anywhere; }
.player .ball { visibility: hidden; width: 14px; height: 14px; }
.player.serving { opacity: 1; font-weight: 600; }
.player.serving .ball { visibility: visible; }
.half .score { font-family: var(--serif); font-weight: 400; font-size: clamp(110px, 27vh, 240px); line-height: .78; font-variant-numeric: tabular-nums; letter-spacing: -.03em; text-shadow: 0 2px 24px rgb(0 0 0 / .18); }
.half[data-k="a"] .score { align-self: end; }
.half[data-k="b"] .score { align-self: start; }
.score.bump { animation: bump .32s cubic-bezier(.2, .8, .3, 1.2); }
@keyframes bump { 0% { transform: translateY(14px) scale(.94); opacity: .4; } 100% { transform: none; opacity: 1; } }
.half .hint { position: absolute; font-size: 12px; opacity: .55; left: 34px; }
.half[data-k="a"] .hint { top: 28px; right: 34px; text-align: right; left: auto; }
.half[data-k="b"] .hint { bottom: 28px; right: 34px; text-align: right; left: auto; }

.net {
  color: #E6ECE8; padding: 12px 16px; text-align: center; display: flex; flex-direction: column; gap: 3px; align-items: center;
  background:
    repeating-linear-gradient(90deg, rgb(255 255 255 / .05) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(0deg, rgb(255 255 255 / .05) 0 1px, transparent 1px 9px),
    #0A1A15;
  border-top: 3px solid #F4F6F2; /* net tape */
}
.net .call { font-family: var(--serif); font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; gap: 16px; align-items: baseline; }
.net .call .sep { width: 6px; height: 6px; border-radius: 50%; background: rgb(230 236 232 / .35); align-self: center; }
.net .who { font-size: 13px; opacity: .72; display: flex; align-items: center; gap: 8px; }
@media (orientation: landscape) and (min-width: 640px) {
  .court { grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr; }
  .court-top { grid-column: 1 / -1; }
  .court > .half[data-k="a"] { grid-column: 1; grid-row: 2; }
  .court > .net { grid-column: 2; grid-row: 2; justify-content: center; border-top: 0; border-inline: 3px solid #F4F6F2; min-width: 190px; }
  .half .paint, .half .kitchen { display: none; }
  .half .content, .half[data-k="a"] .content, .half[data-k="b"] .content { padding: 30px; align-items: end; }
  .half[data-k="b"] .score, .half[data-k="b"] .players { align-self: end; }
  .court > .half[data-k="b"] { grid-column: 3; grid-row: 2; }
}

.toast { position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; background: #F4F6F2; color: #0F241E; font-weight: 600; font-size: 15px; padding: 11px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgb(0 0 0 / .3); max-width: calc(100% - 32px); text-align: center; display: flex; gap: 10px; align-items: center; animation: drop .3s ease-out; }
@keyframes drop { from { transform: translate(-50%, -10px); opacity: 0; } }

.sheet-bg { position: fixed; inset: 0; z-index: 70; background: rgb(4 12 9 / .6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); color: var(--ink); width: 100%; max-width: 540px; border-radius: 26px 26px 0 0; padding: 26px max(22px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; animation: rise .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--rule); align-self: center; margin-top: -12px; }
.sheet .kicker { font-size: 14px; color: var(--brass); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sheet .kicker::after { content: ""; height: 1px; flex: 1; background: color-mix(in srgb, var(--brass) 45%, transparent); }
.sheet .winner { font-family: var(--serif); font-size: 36px; line-height: 1.05; text-wrap: balance; margin: 0; }
.sheet .final { font-family: var(--serif); font-size: 72px; line-height: .9; font-variant-numeric: tabular-nums; display: flex; gap: 18px; align-items: baseline; }
.sheet .final span { font-size: 30px; color: var(--ink-soft); }
.sheet .facts { display: grid; grid-template-columns: repeat(3, 1fr); border-block: 1px solid var(--rule); }
.sheet .facts div { padding: 10px 0; display: flex; flex-direction: column; }
.sheet .facts div + div { padding-left: 14px; border-left: 1px solid var(--rule); }
.sheet .facts b { font-weight: 600; font-variant-numeric: tabular-nums; }
.sheet .facts small { font-size: 12px; color: var(--ink-soft); }
.sheet p { margin: 0; color: var(--ink-soft); }
.sheet .btns { display: flex; flex-direction: column; gap: 8px; }
.btn { border: 0; border-radius: 999px; padding: 15px 20px; font-weight: 600; font-size: 16px; }
.btn-ink { background: var(--ink); color: var(--chalk); }
.btn-ball { background: var(--ball); color: var(--ball-ink); }
.btn-line { background: transparent; border: 1px solid var(--rule); color: var(--ink); }
.btn-danger { background: var(--danger); color: #fff; }

/* Dink Rating */
.forecast { margin-top: 18px; padding: 14px 0; border-block: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: center; }
.forecast .fc-k { font-size: 14px; color: var(--ink-soft); }
.forecast .fc-who { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.forecast .fc-score { grid-row: 1 / span 2; grid-column: 2; font-family: var(--serif); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.forecast .fc-note { grid-column: 1 / -1; font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
.rating { font-family: var(--serif); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.delta { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }

<script id="engine">
/*ENGINE-START*/
const PB = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));
  function newGame(cfg) {
    const doubles = cfg.mode === 'doubles';
    const first = cfg.first || 0;
    return {
      cfg: clone(cfg), score: [0, 0], serving: first,
      // Side-out doubles starts at 0-0-2: only one server on the first service turn.
      serverNum: doubles && cfg.scoring === 'sideout' ? 2 : 1,
      right: [0, 0],   // index of the player standing in the right-hand court, per team
      server: 0,       // index of the serving player within the serving team
      rallies: 0, switched: false, justSwitched: false, winner: null,
      startedAt: Date.now(), endedAt: null
    };
  }
  function switchAt(target) { return Math.ceil(target / 2); }
  function rally(prev, w) {
    const s = clone(prev);
    s.justSwitched = false;
    if (s.winner !== null) return s;
    const doubles = s.cfg.mode === 'doubles';
    s.rallies++;
    if (s.cfg.scoring === 'rally') {
      s.score[w]++;
      if (w === s.serving) { if (doubles) s.right[w] = 1 - s.right[w]; }
      else { s.serving = w; s.server = doubles ? s.right[w] : 0; }
    } else if (w === s.serving) {
      s.score[w]++;
      if (doubles) s.right[w] = 1 - s.right[w]; // server moves to the other side and serves again
    } else if (doubles && s.serverNum === 1) {
      s.serverNum = 2; s.server = 1 - s.server; // partner serves from where they stand
    } else {
      s.serving = 1 - s.serving; s.serverNum = 1;
      s.server = doubles ? s.right[s.serving] : 0; // side out: player on the right serves first
    }
    const hi = Math.max(s.score[0], s.score[1]);
    if (!s.switched && hi >= switchAt(s.cfg.target)) { s.switched = true; s.justSwitched = true; }
    for (const t of [0, 1]) {
      if (s.score[t] >= s.cfg.target && s.score[t] - s.score[1 - t] >= s.cfg.winBy) { s.winner = t; s.endedAt = Date.now(); }
    }
    return s;
  }
  function call(s) {
    const a = s.score[s.serving], b = s.score[1 - s.serving];
    if (s.cfg.mode === 'doubles' && s.cfg.scoring === 'sideout') return [a, b, s.serverNum];
    return [a, b];
  }
  function serverSide(s) {
    if (s.cfg.mode === 'doubles') return s.server === s.right[s.serving] ? 'right' : 'left';
    return s.score[s.serving] % 2 === 0 ? 'right' : 'left';
  }
  return { newGame, rally, call, serverSide, switchAt };
})();

/* Dink Rating: our own performance rating, inspired by how DUPR is publicly described.
   - Scale 2.00 to 8.00. New players start at 3.50. Doubles and singles are rated separately.
   - A team's rating is the average of its players.
   - Each game has an expected share of points: share = 1 / (1 + 10^(-gap / 2.8)).
     A 0.50 rating gap expects roughly 11-7.
   - After the game: change = K x (actual share - expected share). Beat the forecast and you go up, even in a loss.
   - K shrinks as reliability grows: K = 0.06 + 0.24 x (1 - reliability).
   - Reliability = min(1, games / 20), fading after 30 days without a game (never below 40% of its value).
   Ratings are always recomputed by replaying saved games in order, so deleting a game corrects everything after it. */
const DR = (() => {
  const START = 3.5, MIN = 2, MAX = 8, SCALE = 2.8, FULL = 20;
  const DAY = 864e5;
  const key = n => String(n).trim().toLowerCase();
  const expShare = gap => 1 / (1 + Math.pow(10, -gap / SCALE));
  function reliability(p, now) {
    if (!p || !p.games) return 0;
    const volume = Math.min(1, p.games / FULL);
    const days = (now - p.last) / DAY;
    const recency = days <= 30 ? 1 : Math.max(0.4, 1 - (days - 30) / 180);
    return volume * recency;
  }
  const kFactor = rel => 0.06 + 0.24 * (1 - rel);
  const clamp = r => Math.min(MAX, Math.max(MIN, r));
  function compute(games) {
    const tables = { doubles: new Map(), singles: new Map() };
    const changes = {};
    const sorted = [...games].sort((a, b) => a.endedAt - b.endedAt);
    for (const g of sorted) {
      const tot = g.score[0] + g.score[1];
      if (!tot) continue;
      const T = tables[g.mode === 'singles' ? 'singles' : 'doubles'];
      const get = n => {
        const k = key(n);
        if (!T.has(k)) T.set(k, { name: String(n).trim(), rating: START, games: 0, wins: 0, last: g.endedAt, delta: 0 });
        return T.get(k);
      };
      const teams = g.teams.map(t => t.map(get));
      const tr = teams.map(t => t.reduce((s, p) => s + p.rating, 0) / t.length);
      const pA = expShare(tr[0] - tr[1]);
      const sA = g.score[0] / tot;
      const list = [];
      const updates = [];
      teams.forEach((t, ti) => {
        const surprise = ti === 0 ? sA - pA : pA - sA;
        t.forEach(p => {
          const rel = reliability(p, g.endedAt);
          updates.push([p, clamp(p.rating + kFactor(rel) * surprise), ti]);
        });
      });
      // apply after computing, so partners and opponents all use pre-game ratings
      for (const [p, next, ti] of updates) {
        const before = p.rating;
        p.rating = next; p.delta = next - before; p.games++; p.last = g.endedAt;
        if (g.winner === ti) p.wins++;
        list.push({ name: p.name, team: ti, before, after: next });
      }
      changes[g.id] = { expected: pA, list };
    }
    return { tables, changes };
  }
  function lookup(tables, mode, name) {
    return tables[mode === 'singles' ? 'singles' : 'doubles'].get(key(name)) || null;
  }
  function forecast(tables, mode, teams, target) {
    const tr = teams.map(t => t.reduce((s, n) => s + ((lookup(tables, mode, n) || {}).rating ?? START), 0) / t.length);
    const pA = expShare(tr[0] - tr[1]);
    const fav = pA >= 0.5 ? 0 : 1;
    const pf = fav === 0 ? pA : 1 - pA;
    const loser = Math.min(target - 1, Math.round(target * (1 - pf) / pf));
    return { pA, fav, score: fav === 0 ? [target, loser] : [loser, target], ratings: tr };
  }
  return { compute, forecast, lookup, reliability, expShare, START };
})();
/*ENGINE-END*/
</script>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };
const TEAM_COLOR = ['var(--cobalt)', 'var(--forest)'];

/* ---------- state ---------- */
const defaults = { mode: 'doubles', scoring: 'sideout', target: 11, winBy: 2, first: 0, names: [['', ''], ['', '']] };
let setup = Object.assign({}, defaults, store.get('pb.setup', {}));
let tab = store.get('pb.tab', 'play');
if (!['play', 'leaders', 'history', 'rules'].includes(tab)) tab = 'play';
let live = store.get('pb.live', null); // { state, stack, open }
if (live) live.stack = live.stack || [];
let localGames = store.get('pb.games', []);
let cloudGames = null;
let gamesCol = null;
let syncNote = 'Saved on this device';
let armedDelete = null;
let bumpTeam = null;

function teamPlayers(t, cfg = setup) {
  const n = cfg.mode === 'doubles' ? 2 : 1;
  return Array.from({ length: n }, (_, i) => (cfg.names[t][i] || '').trim() || `Player ${t * 2 + i + 1}`);
}
function teamLabel(players) { return players.join(' & '); }
function allGames() {
  const map = new Map();
  for (const g of localGames) map.set(g.id, g);
  if (cloudGames) for (const g of cloudGames) map.set(g.id, g);
  return [...map.values()].sort((a, b) => b.endedAt - a.endedAt);
}
const minutes = g => Math.max(1, Math.round((g.endedAt - g.startedAt) / 60000));
let ratingMode = store.get('pb.rmode', 'doubles');

/* ---------- saved players ---------- */
let roster = store.get('pb.roster', []);
let rosterEdit = false;
let profileDoc = null;
let rosterWriting = Promise.resolve();
const sameName = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
function persistRoster() {
  roster.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
  store.set('pb.roster', roster);
  if (profileDoc) { const snapshot = roster.slice(); rosterWriting = rosterWriting.then(() => profileDoc.set({ roster: snapshot })).catch(() => {}); }
}
function addToRoster(names) {
  let changed = false;
  for (const raw of names) {
    const n = String(raw || '').trim().slice(0, 40);
    if (!n || isDefaultName(n) || roster.some(r => sameName(r, n))) continue;
    roster.push(n); changed = true;
  }
  if (changed) persistRoster();
  return changed;
}
function removeFromRoster(name) { roster = roster.filter(r => !sameName(r, name)); persistRoster(); }
function slotCount() { return setup.mode === 'doubles' ? 2 : 1; }
function pickPlayer(name) {
  const n = slotCount();
  for (const t of [0, 1]) for (let i = 0; i < n; i++) {
    if (sameName(setup.names[t][i] || '', name)) { setup.names[t][i] = ''; store.set('pb.setup', setup); return; }
  }
  for (const t of [0, 1]) for (let i = 0; i < n; i++) {
    if (!(setup.names[t][i] || '').trim()) { setup.names[t][i] = name; store.set('pb.setup', setup); return; }
  }
}
function rosterHTML() {
  const { tables } = DR.compute(allGames());
  const n = slotCount();
  const inUse = name => [0, 1].some(t => setup.names[t].slice(0, n).some(v => sameName(v || '', name)));
  const chips = roster.map(name => {
    const p = DR.lookup(tables, setup.mode, name);
    return `<button type="button" class="chip-btn ${rosterEdit ? 'editing' : ''}" data-pick="${esc(name)}" aria-pressed="${!rosterEdit && inUse(name)}" ${rosterEdit ? `aria-label="Remove ${esc(name)}"` : ''}>${esc(name)}${p && p.games && !rosterEdit ? `<span class="r">${r2(p.rating)}</span>` : ''}</button>`;
  }).join('');
  return `<div class="roster">
    <div class="rhead"><span>${roster.length ? (rosterEdit ? 'Tap a name to remove it' : 'Saved players. Tap to add to the next open spot.') : 'Saved players'}</span>
      ${roster.length ? `<button type="button" class="del" data-act="roster-edit">${rosterEdit ? 'Done' : 'Edit'}</button>` : ''}</div>
    ${roster.length ? `<div class="chips">${chips}</div>` : `<p class="hint" style="margin:0;font-size:13px;color:var(--ink-soft)">Names you play with are saved here automatically.</p>`}
    <form class="add-player" data-form="add-player"><input id="new-player" placeholder="Add a player" autocomplete="off" aria-label="New player name" maxlength="40"><button type="submit">Save</button></form>
  </div>`;
}
const r2 = n => n.toFixed(2);
function deltaHTML(d) {
  const v = Math.round(d * 100) / 100;
  if (v === 0) return `<span class="delta flat">±0.00</span>`;
  return `<span class="delta ${v > 0 ? 'up' : 'down'}">${v > 0 ? '▲ +' : '▼ −'}${Math.abs(v).toFixed(2)}</span>`;
}
const isDefaultName = n => /^Player \d+$/.test(n);

function forecastHTML() {
  const { tables } = DR.compute(allGames());
  const teams = [teamPlayers(0), teamPlayers(1)];
  const known = teams.flat().filter(n => !isDefaultName(n) && (DR.lookup(tables, setup.mode, n) || {}).games);
  if (!known.length) return `<div class="forecast"><span class="fc-k">Forecast</span><span class="fc-who">No ratings yet</span><p class="fc-note">Every saved game builds each player's Dink Rating. New players start at ${r2(DR.START)}.</p></div>`;
  const f = DR.forecast(tables, setup.mode, teams, +setup.target);
  const close = Math.abs(f.pA - 0.5) < 0.02;
  return `<div class="forecast"><span class="fc-k">Forecast</span>
    <span class="fc-who">${close ? 'Too close to call' : `${esc(teamLabel(teams[f.fav]))} favored`}</span>
    <span class="fc-score">${f.score[0]} – ${f.score[1]}</span>
    <p class="fc-note">Team ratings ${r2(f.ratings[0])} and ${r2(f.ratings[1])}. Beat the forecast and your rating rises, even in a loss.</p></div>`;
}

/* ---------- account history (private to each signed-in viewer) ---------- */
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    profileDoc = db.doc('data/users/' + uid + '/profile');
    gamesCol = profileDoc.collection('games');
    let rosterSynced = false;
    profileDoc.onSnapshot(snap => {
      const remote = snap.exists && Array.isArray((snap.data() || {}).roster) ? snap.data().roster : [];
      const before = roster.length;
      const merged = roster.slice();
      for (const n of remote) if (typeof n === 'string' && !merged.some(r => sameName(r, n))) merged.push(n);
      roster = merged;
      store.set('pb.roster', roster);
      if (!snap.metadata.fromCache && !rosterSynced) {
        rosterSynced = true;
        if (roster.length !== remote.length) persistRoster(); // upload names saved only on this device
      }
      if (roster.length !== before && tab === 'play' && !(live && live.open)) render();
    }, () => {});
    let first = true;
    const timer = setTimeout(() => { syncNote = 'Saved on this device. Account sync not reachable.'; render(); }, 10000);
    gamesCol.orderBy('endedAt', 'desc').limit(500).onSnapshot(snap => {
      cloudGames = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      if (!snap.metadata.fromCache) {
        clearTimeout(timer);
        syncNote = 'Synced to your account';
        if (first) { first = false; uploadLocalOnly(); }
      }
      render();
    }, () => { clearTimeout(timer); gamesCol = null; syncNote = 'Saved on this device'; render(); });
  } catch {}
})();
async function uploadLocalOnly() {
  const have = new Set((cloudGames || []).map(g => g.id));
  for (const g of localGames) {
    if (have.has(g.id)) continue;
    try { const { id, ...rest } = g; await gamesCol.doc(id).set(rest); } catch { break; }
  }
}
async function saveGame(rec) {
  localGames = [rec, ...localGames.filter(g => g.id !== rec.id)].slice(0, 500);
  store.set('pb.games', localGames);
  if (gamesCol) { try { const { id, ...rest } = rec; await gamesCol.doc(id).set(rest); } catch {} }
}
async function deleteGame(id) {
  localGames = localGames.filter(g => g.id !== id);
  store.set('pb.games', localGames);
  if (cloudGames) cloudGames = cloudGames.filter(g => g.id !== id);
  render();
  if (gamesCol) { try { await gamesCol.doc(id).delete(); } catch {} }
}

/* ---------- views ---------- */
const MARK = `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--ball)"/><g fill="var(--ink)" opacity=".85"><circle cx="11" cy="11" r="1.7"/><circle cx="19" cy="9.5" r="1.7"/><circle cx="15.5" cy="16" r="1.7"/><circle cx="10" cy="19.5" r="1.7"/><circle cx="21.5" cy="17" r="1.7"/><circle cx="16.5" cy="23" r="1.7"/></g></svg>`;

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  const head = `<header class="masthead"><div class="wordmark">${MARK}<h1>Dink Score</h1></div><span class="sync">${esc(syncNote)}</span></header>`;
  $('#app').innerHTML = head + (tab === 'play' ? playView() : tab === 'leaders' ? leadersView() : tab === 'history' ? historyView() : rulesView());
  renderCourt();
}

function opts(name, options, value) {
  return `<div class="opts" role="group" aria-label="${esc(name)}">${options.map(([v, l]) =>
    `<button type="button" data-set="${name}" data-v="${v}" aria-pressed="${String(v) === String(value)}">${l}</button>`).join('')}</div>`;
}
function side(t) {
  const n = setup.mode === 'doubles' ? 2 : 1;
  const inputs = Array.from({ length: n }, (_, i) =>
    `<input id="name-${t}-${i}" data-name="${t}-${i}" list="roster-list" placeholder="Player ${t * 2 + i + 1}" value="${esc(setup.names[t][i])}" autocomplete="off" aria-label="Team ${t + 1}, player ${i + 1}">`).join('');
  return `<div class="side" style="--c: ${TEAM_COLOR[t]}"><span class="swatch"></span><div class="body">
    <div class="head"><span>${t ? 'Forest side' : 'Cobalt side'}</span>
      <button type="button" class="serve-pick" data-first="${t}" aria-pressed="${setup.first === t}"><span class="ball"></span>${setup.first === t ? 'Serves first' : 'Serve first'}</button></div>
    ${inputs}</div></div>`;
}
function playView() {
  const resume = live && live.state.winner === null ? `
    <section class="resume"><span class="rs-label">Paused game</span>
      <span class="rs-score">${live.state.score[0]} – ${live.state.score[1]}</span>
      <button data-act="resume">Resume</button></section>` : '';
  const recent = allGames().slice(0, 3);
  return `${resume}
  <section aria-labelledby="new-h">
    <h2 id="new-h">New game</h2>
    <p class="sub">Set the format, add the players, and take it to the court.</p>
    <div class="card-form" style="margin-top:18px">
      <div class="row"><span class="k">Format</span>${opts('mode', [['doubles', 'Doubles'], ['singles', 'Singles']], setup.mode)}</div>
      <div class="row"><span class="k">Scoring</span>${opts('scoring', [['sideout', 'Side-out'], ['rally', 'Rally']], setup.scoring)}
        <p class="note">${setup.scoring === 'sideout' ? 'Classic rules. Only the serving side scores.' : 'A point on every rally, whoever served.'}</p></div>
      <div class="row"><span class="k">Play to</span>${opts('target', [[11, '11'], [15, '15'], [21, '21']], setup.target)}</div>
      <div class="row"><span class="k">Win by</span>${opts('winBy', [[2, '2'], [1, '1']], setup.winBy)}</div>
    </div>
    <div class="matchup">${side(0)}<div class="versus"><span>vs</span><button type="button" data-act="swap">Swap sides</button></div>${side(1)}</div>
    ${rosterHTML()}
    <div id="forecast">${forecastHTML()}</div>
    <datalist id="roster-list">${roster.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist>
    <button class="start" data-act="start" style="width:100%"><span class="ball"></span>Start game</button>
  </section>
  ${recent.length ? `<section><div class="list-head"><h2 style="font-size:24px">Recent</h2><button class="del" data-tab-go="history">See full record</button></div><ul class="games" style="margin-top:10px">${recent.map(gameItem).join('')}</ul></section>` : ''}`;
}

function gameItem(g) {
  const d = new Date(g.endedAt);
  const date = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const line = t => `<div class="line ${g.winner === t ? 'win' : ''}" style="--c:${TEAM_COLOR[t]}"><span class="tick"></span><span class="who">${esc(teamLabel(g.teams[t]))}</span><span class="pts">${g.score[t]}</span></div>`;
  const armed = armedDelete === g.id;
  const fmt = `${g.mode === 'doubles' ? 'Doubles' : 'Singles'}, ${g.scoring === 'rally' ? 'rally' : 'side-out'} to ${g.target}`;
  return `<li class="game"><div class="lines">${line(0)}${line(1)}</div>
    <button class="del ${armed ? 'armed' : ''}" data-del="${esc(g.id)}">${armed ? 'Confirm delete' : 'Delete'}</button>
    <div class="meta">${esc(date)}. ${fmt}, ${minutes(g)} min.</div></li>`;
}

function historyView() {
  const games = allGames();
  if (!games.length) return `<section><h2>Record</h2><div class="empty" style="margin-top:18px"><p>Finished games land here, along with each player's wins, losses and point difference.</p><button class="link-btn" data-tab-go="play">Start a game</button></div></section>`;
  const totalRallies = games.reduce((s, g) => s + (g.rallies || 0), 0);
  const totalMin = games.reduce((s, g) => s + minutes(g), 0);
  return `<section><h2>Record</h2>
    <div class="totals" style="margin-top:18px"><div><b>${games.length}</b><span>Games</span></div><div><b>${totalRallies}</b><span>Rallies</span></div><div><b>${totalMin}</b><span>Minutes</span></div></div></section>
    <section><h2 style="font-size:24px">All games</h2><ul class="games" style="margin-top:10px">${games.map(gameItem).join('')}</ul></section>`;
}

function leaderStats(games, mode) {
  const { tables } = DR.compute(games);
  const now = Date.now();
  const extra = new Map();
  for (const g of [...games].sort((a, b) => a.endedAt - b.endedAt)) {
    if ((g.mode === 'singles' ? 'singles' : 'doubles') !== mode) continue;
    for (const t of [0, 1]) for (const n of g.teams[t]) {
      const k = n.trim().toLowerCase();
      const e = extra.get(k) || { streak: 0, best: 0, diff: 0 };
      const won = g.winner === t;
      e.streak = won ? e.streak + 1 : 0; e.best = Math.max(e.best, e.streak);
      e.diff += g.score[t] - g.score[1 - t];
      extra.set(k, e);
    }
  }
  return [...tables[mode].values()].filter(p => !isDefaultName(p.name)).map(p => {
    const e = extra.get(p.name.toLowerCase()) || { streak: 0, best: 0, diff: 0 };
    return Object.assign({}, p, e, { rel: Math.round(DR.reliability(p, now) * 100) });
  }).sort((a, b) => b.rating - a.rating);
}
function leadersView() {
  const rows = leaderStats(allGames(), ratingMode);
  const toggle = opts('rmode', [['doubles', 'Doubles'], ['singles', 'Singles']], ratingMode).replace(/data-set="rmode"/g, 'data-rmode="1"');
  const head = `<section><div class="list-head"><h2>Leaderboard</h2>${toggle}</div><p class="sub">Ranked by Dink Rating from every saved ${ratingMode} game.</p></section>`;
  if (!rows.length) return head + `<div class="empty"><p>No rated ${ratingMode} players yet. Name the players before a game and save it to put them on the board.</p><button class="link-btn" data-tab-go="play">Start a game</button></div>`;
  const podium = rows.slice(0, 3);
  const order = podium.length === 3 ? [1, 0, 2] : podium.map((_, i) => i);
  const podiumHTML = `<div class="podium" style="--n:${podium.length}">${order.map(i => { const p = podium[i]; return `<div class="step s${i + 1}">
      <span class="pl-name">${esc(p.name)}</span>
      <span class="pl-rating">${r2(p.rating)}</span>
      ${deltaHTML(p.delta)}
      <div class="block"><span>${i + 1}</span></div></div>`; }).join('')}</div>`;
  const table = `<div class="table-wrap"><table class="board">
    <thead><tr><th class="num">#</th><th>Player</th><th class="num">Rating</th><th class="num">W–L</th><th class="num">+/−</th><th class="num">Reliability</th></tr></thead>
    <tbody>${rows.map((p, i) => `<tr><td class="num rank">${i + 1}</td>
      <td class="name">${esc(p.name)}${p.rel < 60 ? '<span class="prov">provisional</span>' : ''}${p.streak >= 3 ? `<span class="streak" title="Current win streak">${p.streak} in a row</span>` : ''}</td>
      <td class="num"><span class="rating">${r2(p.rating)}</span><br>${deltaHTML(p.delta)}</td>
      <td class="num">${p.wins}–${p.games - p.wins}</td>
      <td class="num">${p.diff > 0 ? '+' : ''}${p.diff}</td>
      <td class="num"><div class="rel ${p.rel < 60 ? 'low' : ''}"><span class="bar"><i style="width:${p.rel}%"></i></span><span>${p.rel}%</span></div></td></tr>`).join('')}</tbody></table></div>`;
  const by = (f, label, fmt) => { const top = [...rows].sort((a, b) => f(b) - f(a))[0]; return top && f(top) > 0 ? `<div><span class="aw-k">${label}</span><span class="aw-name">${esc(top.name)}</span><span class="aw-v">${fmt(top)}</span></div>` : ''; };
  const awards = [
    by(p => p.wins, 'Most wins', p => `${p.wins} wins`),
    by(p => p.best, 'Longest win streak', p => `${p.best} in a row`),
    by(p => p.diff, 'Best point difference', p => `+${p.diff}`),
    by(p => p.games, 'Most games played', p => `${p.games} games`)
  ].join('');
  return head + `<section>${podiumHTML}</section><section>${table}</section>${awards ? `<section><h2 style="font-size:24px">Club honors</h2><div class="awards" style="margin-top:10px">${awards}</div></section>` : ''}`;
}

function rulesView() {
  return `<section><h2>Rules</h2><p class="sub">The essentials, for settling it at the kitchen line.</p></section>
  <div class="rules">
    <div class="rule"><h3>Calling the score</h3><p>In doubles, say three numbers before each serve.</p>
      <div class="call-demo"><div><strong>4</strong><small>Serving team</small></div><div><strong>2</strong><small>Receiving team</small></div><div><strong>1</strong><small>Server</small></div></div>
      <p>Games open at <b>0 – 0 – 2</b>, so the first team to serve gets only one server.</p></div>
    <div class="rule"><h3>Side-out scoring</h3><ul><li>Only the serving team scores.</li><li>Win the rally and the server swaps sides with their partner, then serves again.</li><li>Server 1 loses a rally and server 2 takes over. Server 2 loses and it's a side out.</li><li>After a side out, whoever stands on the right serves first.</li></ul></div>
    <div class="rule"><h3>Where to serve from</h3><p>Even score, serve from the right. Odd score, from the left. That holds for whoever started the game on the right. Dink Score shows the side on the scoring screen.</p></div>
    <div class="rule"><h3>The serve</h3><ul><li>Underhand, with contact below the waist and one foot behind the baseline.</li><li>Serve diagonally, deep of the kitchen. Landing on the kitchen line is a fault.</li></ul></div>
    <div class="rule"><h3>Two-bounce rule</h3><p>The return of serve must bounce, and so must the third shot. After that, volleys are open.</p></div>
    <div class="rule"><h3>The kitchen</h3><p>The non-volley zone runs 7 feet from the net on each side. No volleys while you're in it or touching its line, including momentum carrying you in after the shot. Step in any time to play a ball that has bounced.</p></div>
    <div class="rule"><h3>How Dink Rating works</h3>
      <p>Dink Rating is this app's own skill rating, built on the same ideas as the big rating systems. It runs from 2.00 to 8.00, and everyone starts at 3.50. Doubles and singles are rated separately.</p>
      <ul><li>Before each game, the app forecasts the score from the players' ratings. A team's rating is the average of its two players.</li>
        <li>After the game, your rating moves by how far you beat or missed that forecast. Losing 9 – 11 to a much stronger team can raise your rating. Winning 11 – 9 when you were expected to win 11 – 4 can lower it.</li>
        <li>Reliability grows with the number of games you play, up to 100% at 20 games, and fades after a month without playing. Below 60% your rating is provisional and moves faster.</li>
        <li>Ratings only reflect games saved in this app, so they're best for comparing your own group of players.</li></ul></div>
    <div class="rule"><h3>Winning and changing ends</h3><p>Games go to 11, win by 2, with 15 or 21 in some events. Change ends when the leading team first reaches 6, or 8 in a game to 15, or 11 in a game to 21.</p></div>
  </div>`;
}

/* ---------- scoring screen ---------- */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && live && live.open) keepAwake(true); });

function renderCourt() {
  const root = $('#overlay');
  if (!live || !live.open) { root.innerHTML = ''; document.body.style.overflow = ''; return; }
  document.body.style.overflow = 'hidden';
  const s = live.state, cfg = s.cfg;
  const callParts = PB.call(s);
  const serverName = cfg.teams[s.serving][s.server];
  const half = t => {
    const k = t ? 'b' : 'a';
    const players = cfg.teams[t].map((p, i) => `<span class="player ${s.serving === t && s.server === i ? 'serving' : ''}"><span class="ball"></span>${esc(p)}</span>`).join('');
    return `<button class="half" data-k="${k}" data-rally="${t}" aria-label="${esc(teamLabel(cfg.teams[t]))} won the rally. Their score is ${s.score[t]}">
      <span class="kitchen"></span><span class="paint"></span>
      <span class="hint">Tap when this side wins the rally</span>
      <span class="content"><span class="players">${players}</span><span class="score ${bumpTeam === t ? 'bump' : ''}">${s.score[t]}</span></span></button>`;
  };
  let sheet = '';
  if (s.winner !== null) {
    const w = s.winner;
    sheet = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="win-h"><span class="grip"></span>
      <span class="kicker">Game</span>
      <h2 class="winner" id="win-h">${esc(teamLabel(cfg.teams[w]))} ${cfg.teams[w].length > 1 ? 'take' : 'takes'} it</h2>
      <div class="final">${s.score[w]}<span>to</span>${s.score[1 - w]}</div>
      <div class="facts"><div><b>${s.rallies}</b><small>Rallies</small></div><div><b>${minutes(s)} min</b><small>Duration</small></div><div><b>${cfg.scoring === 'rally' ? 'Rally' : 'Side-out'}</b><small>To ${cfg.target}</small></div></div>
      ${ratingPreview(s)}
      <div class="btns"><button class="btn btn-ball" data-act="rematch">Save and rematch</button>
        <button class="btn btn-ink" data-act="finish">Save and finish</button>
        <button class="btn btn-line" data-act="undo">Undo last rally</button></div></div></div>`;
  } else if (live.confirmEnd) {
    sheet = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="end-h"><span class="grip"></span>
      <h2 class="winner" id="end-h">Leave this game?</h2>
      <p>It's ${s.score[0]} – ${s.score[1]}. Pause to pick it up later, or end it. Unfinished games stay out of your record.</p>
      <div class="btns"><button class="btn btn-ink" data-act="minimize">Pause game</button>
        <button class="btn btn-line" data-act="keep">Keep playing</button>
        <button class="btn btn-danger" data-act="discard">End without saving</button></div></div></div>`;
  }
  root.innerHTML = `<div class="court">
    <div class="court-top"><button data-act="end">Leave</button>
      <div class="info">${cfg.mode === 'doubles' ? 'Doubles' : 'Singles'}, ${cfg.scoring === 'rally' ? 'rally' : 'side-out'} to ${cfg.target}</div>
      <button data-act="undo" ${live.stack.length ? '' : 'disabled'}>Undo</button></div>
    ${half(0)}
    <div class="net" aria-live="polite"><div class="call" aria-label="Score call ${callParts.join(' ')}">${callParts.map(n => `<span>${n}</span>`).join('<span class="sep"></span>')}</div>
      <div class="who"><span class="ball"></span>${esc(serverName)} serves from the ${PB.serverSide(s)}</div></div>
    ${half(1)}
  </div>${live.toast ? `<div class="toast" role="status"><span class="ball"></span>${esc(live.toast)}</div>` : ''}${sheet}`;
  bumpTeam = null;
}

function ratingPreview(s) {
  const rec = Object.assign(record(s), { id: '__pending' });
  const { changes } = DR.compute([...allGames(), rec]);
  const c = changes.__pending;
  if (!c) return '';
  const named = c.list.filter(x => !isDefaultName(x.name));
  if (!named.length) return `<p class="expect">Add player names next time to track Dink Ratings.</p>`;
  const fav = c.expected >= 0.5 ? 0 : 1;
  const pf = fav === 0 ? c.expected : 1 - c.expected;
  const exp = Math.min(cfg_target(s) - 1, Math.round(cfg_target(s) * (1 - pf) / pf));
  const expText = Math.abs(c.expected - 0.5) < 0.02 ? 'The forecast called it even.' : `The forecast had ${esc(teamLabel(s.cfg.teams[fav]))} winning ${cfg_target(s)} – ${exp}.`;
  return `<div><p class="expect">${expText} Rating changes once saved:</p>
    <div class="changes">${named.map(x => `<div class="ch" style="--c:${TEAM_COLOR[x.team]}"><span class="tick"></span><span class="nm">${esc(x.name)}</span><span class="rt">${r2(x.after)}</span>${deltaHTML(x.after - x.before)}</div>`).join('')}</div></div>`;
}
const cfg_target = s => s.cfg.target;
function persistLive() { store.set('pb.live', live ? { state: live.state, stack: live.stack.slice(-200), open: live.open } : null); }
let toastTimer;
function showToast(msg) {
  live.toast = msg; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if (live) { live.toast = null; renderCourt(); } }, 3500);
}
function startGame(cfgOverride) {
  const cfg = cfgOverride || {
    mode: setup.mode, scoring: setup.scoring, target: +setup.target, winBy: +setup.winBy, first: setup.first,
    teams: [teamPlayers(0), teamPlayers(1)]
  };
  live = { state: PB.newGame(cfg), stack: [], open: true };
  persistLive(); keepAwake(true); render();
}
function record(s) {
  return {
    id: 'g' + s.startedAt.toString(36) + Math.random().toString(36).slice(2, 6),
    startedAt: s.startedAt, endedAt: s.endedAt, mode: s.cfg.mode, scoring: s.cfg.scoring, target: s.cfg.target, winBy: s.cfg.winBy,
    teams: s.cfg.teams, score: s.score, winner: s.winner, rallies: s.rallies
  };
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el) return;
  if (el.dataset.tab) { tab = el.dataset.tab; store.set('pb.tab', tab); armedDelete = null; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.tabGo) { tab = el.dataset.tabGo; store.set('pb.tab', tab); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.set) {
    const k = el.dataset.set; setup[k] = ['target', 'winBy'].includes(k) ? +el.dataset.v : el.dataset.v;
    store.set('pb.setup', setup); render(); return;
  }
  if (el.dataset.pick !== undefined) {
    if (rosterEdit) { removeFromRoster(el.dataset.pick); if (!roster.length) rosterEdit = false; }
    else pickPlayer(el.dataset.pick);
    render(); return;
  }
  if (el.dataset.rmode) { ratingMode = el.dataset.v; store.set('pb.rmode', ratingMode); render(); return; }
  if (el.dataset.first) { setup.first = +el.dataset.first; store.set('pb.setup', setup); render(); return; }
  if (el.dataset.del) {
    const id = el.dataset.del;
    if (armedDelete === id) { armedDelete = null; deleteGame(id); } else { armedDelete = id; render(); }
    return;
  }
  if (el.dataset.rally !== undefined && live && live.state.winner === null && !live.confirmEnd) {
    buzz();
    const before = live.state.score.slice();
    live.stack.push(live.state);
    live.state = PB.rally(live.state, +el.dataset.rally);
    bumpTeam = live.state.score[0] !== before[0] ? 0 : live.state.score[1] !== before[1] ? 1 : null;
    if (live.state.justSwitched && live.state.winner === null) showToast(`Change ends. A team reached ${PB.switchAt(live.state.cfg.target)}.`);
    persistLive(); renderCourt(); return;
  }
  const act = el.dataset.act;
  if (!act) return;
  if (act === 'swap') { setup.names = [setup.names[1], setup.names[0]]; setup.first = 1 - setup.first; store.set('pb.setup', setup); render(); }
  if (act === 'roster-edit') { rosterEdit = !rosterEdit; render(); }
  if (act === 'start') { addToRoster([...teamPlayers(0), ...teamPlayers(1)]); startGame(); }
  if (act === 'resume') { live.open = true; persistLive(); keepAwake(true); render(); }
  if (act === 'undo' && live && live.stack.length) { live.state = live.stack.pop(); live.toast = null; persistLive(); renderCourt(); }
  if (act === 'end') { live.confirmEnd = true; renderCourt(); }
  if (act === 'keep') { live.confirmEnd = false; renderCourt(); }
  if (act === 'minimize') { live.confirmEnd = false; live.open = false; persistLive(); keepAwake(false); render(); }
  if (act === 'discard') { live = null; persistLive(); keepAwake(false); render(); }
  if (act === 'finish' || act === 'rematch') {
    const s = live.state;
    saveGame(record(s));
    if (act === 'rematch') {
      startGame(Object.assign({}, s.cfg, { first: 1 - (s.cfg.first || 0) }));
    } else { live = null; persistLive(); keepAwake(false); tab = 'history'; store.set('pb.tab', tab); render(); window.scrollTo(0, 0); }
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.name;
  if (!k) return;
  const [t, i] = k.split('-').map(Number);
  setup.names[t][i] = e.target.value;
  store.set('pb.setup', setup);
  clearTimeout(fcTimer);
  fcTimer = setTimeout(() => { const el = $('#forecast'); if (el) el.innerHTML = forecastHTML(); }, 250);
});
let fcTimer;
document.addEventListener('submit', e => {
  if (!e.target.matches('[data-form="add-player"]')) return;
  e.preventDefault();
  const input = $('#new-player');
  const name = input.value.trim();
  if (!name) return;
  addToRoster([name]);
  render();
  const again = $('#new-player'); if (again) again.focus();
});
document.addEventListener('keydown', e => {
  if (!live || !live.open || live.state.winner !== null || live.confirmEnd) return;
  if (e.target.matches && e.target.matches('input')) return;
  if (e.key === '1' || e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); document.querySelector('[data-rally="0"]').click(); }
  if (e.key === '2' || e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); document.querySelector('[data-rally="1"]').click(); }
  if ((e.key === 'z' && (e.ctrlKey || e.metaKey)) || e.key === 'Backspace') { e.preventDefault(); document.querySelector('[data-act="undo"]').click(); }
});

if (live && live.state.winner === null && live.open) keepAwake(true);
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
