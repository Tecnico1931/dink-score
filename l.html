<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F4F7">
<script src="/analytics.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<title>League table · Dink Score</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* The public, read-only league or ladder page (served at /l/<token>). Built by build.cjs from this file plus the shared colour tokens of dink-score.html. */

:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #E9EDF2;
  --ink: #0E1726;
  --muted: #5D6A7B;
  --line: #DEE4EA;
  --blue: #2B49E6;      /* team 1 court */
  --green: #0B8562;     /* team 2 court */
  --ball: #DDF247;      /* serve, highlights */
  --ball-ink: #1B2104;
  --ball-hi: #E7FA5C;   /* the lime tile's gradient ends */
  --ball-lo: #CFE43A;
  --court: #0E7A55;     /* hero card and New game tile: a court seen from above */
  --court-2: #0A5E42;
  --court-ring: #0E7A55;
  --court-line: rgb(255 255 255 / .55);
  --on-court: #FFFFFF;
  --on-court-muted: rgb(255 255 255 / .92);
  --court-pill: rgb(0 0 0 / .22);
  --accent: #2B49E6;
  --accent-text: #2B49E6;
  --dsp-bg: #0F241E;
  --dsp-surface: #17372E;
  --dsp-ink: #F4F7EE;
  --dsp-muted: #B9C8BE;
  --dsp-dim: #859B8C;
  --lift: 0 1px 0 rgb(255 255 255 / .6) inset, 0 14px 30px -18px rgb(30 25 10 / .35);
  --up: #0A7656;
  --down: #C2372B;
  --danger: #C2372B;
  --focus: #2B49E6;
  --blue-text: #2B49E6; /* blue as text: the dark theme needs a lighter blue than the fill */
  --shadow: 0 1px 2px rgb(14 23 38 / .06), 0 8px 24px -12px rgb(14 23 38 / .18);
  --display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --ui: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
}
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F17; --surface: #131B26; --surface-2: #1B2532; --ink: #EEF2F7; --muted: #8E9BAD; --line: #243142;
    --blue: #3D5BFF; --green: #0B8562; --ball: #DDF247; --ball-ink: #1B2104;
    --up: #3DD69E; --down: #FF7A6B; --danger: #FF7A6B; --focus: #9DB0FF; --blue-text: #9DB0FF;
    --court: #0F6B4B; --court-2: #0A4A34; --court-ring: #0F6B4B; --accent: #3D5BFF; --accent-text: #9DB0FF; --lift: 0 1px 0 rgb(255 255 255 / .05) inset, 0 18px 36px -18px rgb(0 0 0 / .8);
    --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 30px -14px rgb(0 0 0 / .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F17; --surface: #131B26; --surface-2: #1B2532; --ink: #EEF2F7; --muted: #8E9BAD; --line: #243142;
  --blue: #3D5BFF; --green: #0B8562; --ball: #DDF247; --ball-ink: #1B2104;
  --up: #3DD69E; --down: #FF7A6B; --danger: #FF7A6B; --focus: #9DB0FF; --blue-text: #9DB0FF;
  --court: #0F6B4B; --court-2: #0A4A34; --court-ring: #0F6B4B; --accent: #3D5BFF; --accent-text: #9DB0FF; --lift: 0 1px 0 rgb(255 255 255 / .05) inset, 0 18px 36px -18px rgb(0 0 0 / .8);
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 30px -14px rgb(0 0 0 / .7);
  color-scheme: dark;
}
/* Outdoor display (a per-device setting): maximum contrast in direct sun, whatever the phone's own theme. */
:root[data-outdoor] {
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #E8E8E8; --ink: #000000; --muted: #2B2B2B; --line: #5A5A5A;
  --blue: #0A28B8; --green: #00593F; --up: #00593F; --down: #A80000; --danger: #A80000; --focus: #0A28B8; --blue-text: #0A28B8;
  --court: #00593F; --court-2: #00593F; --court-ring: #00593F; --accent: #0A28B8; --accent-text: #0A28B8; --court-line: rgb(255 255 255 / .9); --lift: none;
  --shadow: none;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: light dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.pub { max-width: 900px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 18px; min-height: 100vh; min-height: 100dvh; }
.pub-brand { margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.pub h1 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: clamp(28px, 4.2vw, 48px); line-height: 1.05; letter-spacing: -.02em; overflow-wrap: anywhere; text-wrap: balance; }
.pub-meta { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.pub-status { margin: 0; font-size: 13px; color: var(--muted); }
.pub-status.warn { color: var(--ink); font-weight: 600; }
.card { background: var(--surface); border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 700; font-stretch: 90%; font-size: 19px; letter-spacing: -.01em; }
.pub-note { margin: 0; font-size: 14px; color: var(--muted); }
.pub-champ { display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--bg); border-radius: 22px; padding: 16px 20px; }
.pub-champ .ball { width: 26px; height: 26px; flex: none; display: inline-block; background: url(/icons/pickleball.svg) center / contain no-repeat; }
.pub-champ small { display: block; font-size: 13px; opacity: .75; }
.pub-champ b { font-size: 20px; overflow-wrap: anywhere; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
th.who, td.who { text-align: left; white-space: normal; overflow-wrap: anywhere; }
tr:last-child td { border-bottom: 0; }
.fx { list-style: none; margin: 0; padding: 0; }
.fx li { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.fx li:last-child { border-bottom: 0; }
.fx .t { min-width: 0; overflow-wrap: anywhere; }
.fx .win { font-weight: 700; }
.fx .sc { flex: none; font-size: 18px; }
.fx .tag { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); }
details summary { cursor: pointer; padding: 6px 0; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.pub-dead { max-width: 520px; margin: 18vh auto 0; text-align: center; }
.pub-dead h1 { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 30px; margin: 0 0 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="pub" id="pub">
  <header>
    <p class="pub-brand">Dink Score · league</p>
    <h1 id="pub-name">Loading…</h1>
    <p class="pub-meta" id="pub-meta"></p>
  </header>
  <div id="pub-body" style="display:flex;flex-direction:column;gap:18px"></div>
  <p class="pub-status" id="pub-status" role="status"></p>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const root = document.documentElement;
  const q = new URLSearchParams(location.search);
  const token = (location.pathname.match(/^\/l\/([A-Za-z0-9_-]{32})\/?$/) || [])[1];
  if (q.get('theme') === 'dark' || q.get('theme') === 'light') root.dataset.theme = q.get('theme');
  if (/^(blue|clay|violet|sunset|slate)$/.test(q.get('palette') || '')) root.dataset.palette = q.get('palette');
  const tc = $('meta[name="theme-color"]'), bg = getComputedStyle(root).getPropertyValue('--bg').trim();
  if (tc && bg) tc.content = bg;
  let data = null, json = '', dead = false, failed = 0, lastCheck = 0, timer = 0;
  const POLL = 15000;
  const time = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  const names = t => esc((t || []).join(' & '));
  const sign = n => (n > 0 ? '+' : '') + n;
  const tbShort = { diff: '+/−', pf: 'points for', h2h: 'head-to-head' };
  const tbCustom = tb => Array.isArray(tb) && tb.join(',') !== 'diff,pf' && tb.join(',') !== 'diff,pf,h2h';
  const tbText = tb => (Array.isArray(tb) ? tb : []).map(k => tbShort[k] || k).join(', ');

  function table(rows, cols, zone) {
    const head = cols.map(c => `<th scope="col"${c.k === 'name' ? ' class="who"' : ''}>${c.h}</th>`).join('');
    return `<div class="tbl"><table><tr>${head}</tr>${rows.map((r, i) => {
      const z = zone ? (zone.up && i < zone.n ? ' <small class="tag">Up</small>' : zone.down && i >= rows.length - zone.n ? ' <small class="tag">Down</small>' : '') : '';
      return '<tr>' + cols.map(c => c.k === 'name' ? `<td class="who">${r.rank}. ${esc(r.name)}${z}</td>` : `<td class="num">${c.k === 'diff' ? sign(r.diff) : r[c.k]}</td>`).join('') + '</tr>';
    }).join('')}</table></div>`;
  }
  // The day, time and court of a match still to play, as the organizer typed them (a calendar date, never moved by the viewer's time zone).
  const when = m => { const x = m.when || {}, p = /^(\d{4})-(\d\d)-(\d\d)$/.exec(x.date || ''), day = p ? new Date(+p[1], +p[2] - 1, +p[3]).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }) : '';
    return [day && (x.moved ? 'Moved to ' : '') + day + (x.time ? ' ' + x.time : ''), x.court ? 'Court ' + x.court : ''].filter(Boolean).map(esc).join(' · '); };
  const match = m => { const done = m.status === 'done' && m.score, w = done ? (m.score[0] > m.score[1] ? 0 : 1) : -1, wh = done ? '' : when(m);
    return `<li><span class="t"><span class="${w === 0 ? 'win' : ''}">${names(m.teams[0])}</span> vs <span class="${w === 1 ? 'win' : ''}">${names(m.teams[1])}</span>${wh ? `<br><small class="tag">${wh}</small>` : ''}</span>${done ? `<span class="sc num">${m.score[0]}–${m.score[1]}${m.forfeit ? ' <small class="tag">Forfeit</small>' : ''}</span>` : '<span class="tag">To play</span>'}</li>`; };
  const weekList = w => `<ul class="fx">${w.matches.map(match).join('')}</ul>${w.byes && w.byes.length ? `<p class="pub-note">Bye: ${w.byes.map(b => esc(b.name)).join(', ')}</p>` : ''}`;

  function render() {
    const d = data;
    document.title = d.name + ' · Dink Score';
    $('#pub-name').textContent = d.name;
    const rule = `${d.mode === 'doubles' ? 'Doubles' : 'Singles'}, ${d.scoring === 'rally' ? 'rally scoring' : 'side-out'} to ${d.target}`;
    const meta = [d.season, rule, d.kind === 'ladder' ? `challenge up to ${d.jump} above${d.decayDays ? `, idle ${d.decayDays} days = one place down` : ''}` : d.status === 'done' ? 'Season finished' : `Week ${d.current} of ${d.weeks.length}`];
    if (d.kind === 'league' && tbCustom(d.tiebreak)) meta.push(`tie-break: ${tbText(d.tiebreak)}`);
    if (d.kind === 'league' && d.divisions.length > 1) meta.push(d.move ? `${d.move} up / ${d.move} down` : 'no promotion');
    $('#pub-meta').textContent = meta.join(' · ');
    const out = [];
    if (d.kind === 'league') {
      const showPf = Array.isArray(d.tiebreak) && d.tiebreak.indexOf('pf') >= 0 && d.tiebreak.indexOf('pf') < d.tiebreak.indexOf('diff');
      const cols = [{ k: 'name', h: d.mode === 'doubles' ? 'Team' : 'Player' }, { k: 'played', h: 'P' }, { k: 'wins', h: 'W' }, { k: 'losses', h: 'L' }, { k: 'diff', h: '+/−' }, ...(showPf ? [{ k: 'pf', h: 'PF' }] : [])];
      if (d.status === 'done' && d.champions) d.champions.forEach((c, i) => { if (c) out.push(`<div class="pub-champ"><span class="ball" aria-hidden="true"></span><div><small>${d.divisions.length > 1 ? esc(d.divisions[i].label) + ' winner' : 'Season winner'}</small><b>${names(c)}</b></div></div>`); });
      d.divisions.forEach((dv, i) => out.push(`<section class="card" aria-labelledby="d-${esc(dv.label)}"><h2 id="d-${esc(dv.label)}">${d.divisions.length > 1 ? esc(dv.label) : 'Standings'}</h2>${table(dv.rows, cols, d.divisions.length > 1 && d.move > 0 ? { n: d.move, up: i > 0, down: i < d.divisions.length - 1 } : null)}</section>`));
      const wk = d.status === 'live' && d.weeks.find(w => w.n === d.current);
      if (wk) out.push(`<section class="card" aria-labelledby="wk-now"><h2 id="wk-now">${esc(wk.title)}</h2>${weekList(wk)}</section>`);
      out.push(`<section class="card"><h2>All weeks</h2>${d.weeks.map(w => `<details><summary>${esc(w.title)}</summary>${weekList(w)}</details>`).join('')}</section>`);
    } else {
      out.push(`<section class="card" aria-labelledby="lad"><h2 id="lad">Ladder</h2>${table(d.rows, [{ k: 'name', h: d.mode === 'doubles' ? 'Team' : 'Player' }, { k: 'played', h: 'P' }, { k: 'wins', h: 'W' }, { k: 'losses', h: 'L' }])}</section>`);
      if (d.results.length) out.push(`<section class="card" aria-labelledby="rec"><h2 id="rec">Recent results</h2><ul class="fx">${d.results.map(r => match({ teams: r.teams, score: r.score, status: 'done' })).join('')}</ul></section>`);
    }
    $('#pub-body').innerHTML = out.join('');
  }

  function status() {
    const el = $('#pub-status');
    if (dead) { el.textContent = ''; return; }
    el.classList.toggle('warn', failed > 1);
    el.textContent = failed > 1 ? `Can't reach the server. Showing the last update; trying again.` : lastCheck ? `Checked ${time(lastCheck)}. Updates by itself.` : '';
  }
  function showDead() {
    dead = true; clearTimeout(timer);
    $('#pub-meta').textContent = ''; $('#pub-name').textContent = '';
    document.title = 'League link not active · Dink Score';
    $('#pub-body').innerHTML = `<div class="pub-dead card" role="alert"><h1>This league link is not active</h1><p class="pub-note">It may have been turned off or replaced. Ask the organizer for the current link.</p></div>`;
    status();
  }
  async function load() {
    if (dead) return;
    try {
      const r = await fetch('/api/bracket?league=' + encodeURIComponent(token), { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
      if (r.status === 404) return showDead();
      if (!r.ok) throw new Error('bad status');
      const text = await r.text();
      failed = 0; lastCheck = Date.now();
      if (text !== json) { json = text; data = JSON.parse(text); render(); }
    } catch { failed++; }
    status();
  }
  function loop() { clearTimeout(timer); if (dead || document.hidden) return; timer = setTimeout(async () => { await load(); loop(); }, POLL + Math.floor(Math.random() * 3000)); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(timer); else { load().then(loop); } });
  if (!token) showDead(); else load().then(loop);
})();
</script>
</body>
</html>
