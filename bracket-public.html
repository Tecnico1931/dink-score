<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F241E">
<title>Live bracket · Dink Score</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist:wght@400..700&display=swap">
<style>
/* The public, read-only bracket page (served at /b/<token>). Built by build.cjs from this file plus the shared blocks of dink-score.html. */
/*@TOKENS*/
* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: light dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ball { display: inline-block; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F4FF9E, var(--ball) 55%, #B9CF22); }
/*@BRACKET-CSS*/
.pub { max-width: 1840px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 18px; min-height: 100vh; min-height: 100dvh; }
.pub-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.pub-brand { margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.pub-top h1 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: clamp(28px, 4.2vw, 56px); line-height: 1.05; letter-spacing: -.02em; overflow-wrap: anywhere; text-wrap: balance; }
.pub-meta { margin: 6px 0 0; display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); color: var(--muted); }
.badge.hot { background: var(--ball); color: var(--ball-ink); }
.pub-btn { min-height: 44px; border: 0; border-radius: 16px; padding: 10px 18px; font: 700 15px var(--ui); background: var(--ink); color: var(--bg); cursor: pointer; }
.pub-status { margin: 0; font-size: 13px; color: var(--muted); }
.pub-status.warn { color: var(--ink); font-weight: 600; }
.card { background: var(--surface); border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 700; font-stretch: 90%; font-size: 19px; letter-spacing: -.01em; }
.pub-champ { display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--bg); border-radius: 22px; padding: 16px 20px; }
.pub-champ .ball { width: 26px; height: 26px; flex: none; }
.pub-champ small { display: block; font-size: 13px; opacity: .75; }
.pub-champ b { font-size: 22px; overflow-wrap: anywhere; }
.pub-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; min-height: 0; }
.pub-grid > * { min-width: 0; }
.pub-main { display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.pub-sec > h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 700; font-stretch: 90%; font-size: 21px; letter-spacing: -.01em; }
.pub-rounds { list-style: none; margin: 0; padding: 0; }
.pub-rounds > li { margin-bottom: 14px; }
.pub-rounds ul { list-style: none; margin: 0; padding: 0; }
.pub-note { margin: 0; font-size: 14px; color: var(--muted); }
.pub-dead { max-width: 520px; margin: 18vh auto 0; text-align: center; }
.pub-dead h1 { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 30px; margin: 0 0 8px; }
@media (min-width: 1000px) {
  .bk-scroll { --bleed: 0px; }
  .pub-grid.pool { grid-template-columns: minmax(300px, 27%) minmax(0, 1fr); }
}
/* TV mode: nothing but the bracket, as large as the screen allows. */
html.tv, html.tv body { height: 100%; overflow: hidden; }
html.tv .pub { max-width: none; height: 100vh; height: 100dvh; min-height: 0; padding: clamp(10px, 1.6vw, 28px); gap: clamp(8px, 1.2vw, 20px); }
html.tv .pub-brand, html.tv .pub-status.idle { display: none; }
html.tv .pub-top h1 { font-size: clamp(28px, 3.4vw, 72px); }
html.tv .pub-meta { font-size: clamp(16px, 1.5vw, 32px); }
html.tv .badge { font-size: clamp(14px, 1.3vw, 28px); }
html.tv .pub-main { flex: 1; }
html.tv .pub-grid { flex: 1; align-items: stretch; }
html.tv .pub-grid > .pub-sec { display: flex; flex-direction: column; min-height: 0; }
html.tv .bk-host { flex: 1; min-height: 0; }
html.tv .bk-scroll { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding-block: 0; overflow: hidden !important; --bleed: 0px; }
html.tv .bk-fit { margin: 0; flex: none; }
html.tv .pub-champ { padding: clamp(10px, 1.4vw, 24px) clamp(14px, 2vw, 32px); }
html.tv .pub-champ b { font-size: clamp(22px, 2.6vw, 56px); }
html.tv .pub-champ small { font-size: clamp(14px, 1.3vw, 26px); }
html.tv .bk-table td { font-size: clamp(16px, calc((100vh - 300px) / (var(--rows, 8) * 1.9)), 44px); padding-block: clamp(4px, calc((100vh - 300px) / (var(--rows, 8) * 7)), 14px); }
html.tv .bk-table td.who { font-size: clamp(15px, calc((100vh - 300px) / (var(--rows, 8) * 2.1)), 38px); }
html.tv .bk-mline { padding-block: clamp(8px, 1vw, 18px); }
html.tv .bk-mline .r { font-size: clamp(18px, 2vw, 40px); }
html.tv .bk-mline .r .num { font-size: clamp(22px, 2.4vw, 48px); }
html.tv .bk-mline .c { font-size: clamp(14px, 1.3vw, 26px); }
html.tv .pub-grid.pool .bk-scroll { align-items: flex-start; }
html.tv .bk-table th { font-size: clamp(14px, 1.2vw, 24px); }
html.tv .bk-rank { font-size: clamp(16px, 1.6vw, 32px); }
html.tv .bk-tag { font-size: clamp(13px, 1.1vw, 22px); }
html.tv .pub-sec > h2 { font-size: clamp(20px, 2vw, 40px); }
html.tv .pub-sec > .pub-note { display: none; }
html.tv .card h2 { font-size: clamp(20px, 2vw, 40px); }
html.tv .card .pub-note { font-size: clamp(16px, 1.6vw, 34px); }
html.tv .pub-btn { position: fixed; right: 12px; bottom: 12px; opacity: .55; z-index: 5; }
html.tv .pub-btn:hover, html.tv .pub-btn:focus-visible { opacity: 1; }
html.tv .pub-top .pub-btn { position: fixed; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="pub" id="pub">
  <header class="pub-top">
    <div>
      <p class="pub-brand">Dink Score · live bracket</p>
      <h1 id="pub-name">Loading…</h1>
      <p class="pub-meta" id="pub-meta"></p>
    </div>
    <button type="button" class="pub-btn" id="pub-tv" aria-pressed="false" hidden>TV mode</button>
  </header>
  <div class="pub-main" id="pub-body"></div>
  <p class="pub-status idle" id="pub-status" role="status"></p>
</main>
<script>
/*@BRACKETVIEW*/
(() => {
  const FORMAT = { roundrobin: 'Round robin', pool_knockout: 'Pool play + knockout', single_elim: 'Single elimination', double_elim: 'Double elimination' };
  const $ = s => document.querySelector(s);
  const esc = BK.esc;
  const root = document.documentElement;
  const q = new URLSearchParams(location.search);
  const token = (location.pathname.match(/^\/b\/([A-Za-z0-9_-]{32})\/?$/) || [])[1];
  if (q.get('theme') === 'dark' || q.get('theme') === 'light') root.dataset.theme = q.get('theme');
  let tv = q.get('tv') === '1', data = null, json = '', dead = false, failed = 0, lastCheck = 0, timer = 0;
  const POLL = 8000;

  const time = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  BK.watchLogos();

  function setTv(on, fullscreen) {
    tv = on; root.classList.toggle('tv', on);
    const b = $('#pub-tv'); b.textContent = on ? 'Exit TV mode' : 'TV mode'; b.setAttribute('aria-pressed', String(on));
    if (fullscreen) {
      try { if (on && !document.fullscreenElement && root.requestFullscreen) root.requestFullscreen().catch(() => {}); else if (!on && document.fullscreenElement) document.exitFullscreen(); } catch {}
    }
    fit();
  }
  function fit() { BK.fitAll($('#pub-body'), { tv, max: tv ? 3 : 1.6 }); }

  function status() {
    const el = $('#pub-status');
    if (dead) { el.textContent = ''; return; }
    el.classList.toggle('warn', failed > 1);
    el.textContent = failed > 1 ? `Can't reach the server. Showing the last update; trying again.` : lastCheck ? `Checked ${time(lastCheck)}. Updates by itself every few seconds.` : '';
  }

  function render() {
    const d = data;
    document.title = `${d.name} · Dink Score`;
    $('#pub-name').textContent = d.name;
    const live = d.status === 'live';
    $('#pub-meta').innerHTML = `<span class="badge ${live ? 'hot' : ''}">${live ? 'Live' : 'Finished'}</span><span>${esc(FORMAT[d.format] || '')}</span>${d.courts ? `<span>${d.courts} court${d.courts === 1 ? '' : 's'}</span>` : ''}${d.updatedAt ? `<span>Last change <time datetime="${new Date(d.updatedAt).toISOString()}">${esc(time(d.updatedAt))}</time></span>` : ''}`;
    $('#pub-tv').hidden = false;
    const pool = d.format === 'pool_knockout', main = $('#pub-body');
    const sx = [...main.querySelectorAll('.bk-scroll')].map(e => e.scrollLeft);
    const parts = [];
    if (d.status === 'done' && d.champion) parts.push(`<div class="pub-champ" role="status">${BK.logoHTML(d, d.champion, true) || '<span class="ball"></span>'}<div><small>${d.tree ? 'Champions' : d.partners === 'fixed' ? 'Top team' : 'Top player'}</small><b>${esc(BK.teamName(d, d.champion))}</b></div></div>`);
    const standings = () => `<section class="pub-sec" aria-labelledby="pub-st"><h2 id="pub-st">${pool ? 'Pool standings' : 'Standings'}</h2><div class="card" style="--rows:${d.standings.length}">${BK.standingsHTML(d)}</div>${pool ? `<p class="pub-note" style="margin-top:8px">The top ${d.advance} ${d.partners === 'fixed' ? 'teams' : 'teams of players'} go into the knockout.</p>` : ''}</section>`;
    const bracket = () => `<section class="pub-sec" aria-labelledby="pub-br"><h2 id="pub-br">${pool ? 'Knockout' : 'Bracket'}</h2>${BK.bracketHTML(d, {})}</section>`;
    if (d.tree && pool) parts.push(`<div class="pub-grid pool">${standings()}${bracket()}</div>`);
    else if (d.tree) parts.push(`<div class="pub-grid">${bracket()}</div>`);
    else if (pool) parts.push(`<div class="pub-grid pool">${standings()}<section class="pub-sec"><div class="card"><h2>Knockout</h2><p class="pub-note">The bracket appears here when pool play ends: the top ${d.advance} ${d.partners === 'fixed' ? 'teams' : 'teams of players'} play single elimination.</p></div></section></div>`);
    else if (tv && d.rounds.length) {
      const cur = d.rounds.find(r => r.status !== 'done') || d.rounds[d.rounds.length - 1];
      parts.push(`<div class="pub-grid pool">${standings()}<section class="pub-sec" aria-labelledby="pub-rd"><h2 id="pub-rd">${esc(cur.title)}${d.status === 'live' ? ' · now' : ''}</h2><div class="card"><ul class="pub-rounds">${cur.matches.map(m => BK.lineHTML(m, d)).join('')}</ul></div></section></div>`);
    } else parts.push(`<div class="pub-grid">${standings()}</div>`);
    // Round by round results, for events that are played in rounds.
    if (d.rounds.length && !tv) {
      const cur = d.rounds.find(r => r.status !== 'done') || d.rounds[d.rounds.length - 1];
      parts.push(`<section class="pub-sec" aria-labelledby="pub-rd"><h2 id="pub-rd">${pool ? 'Pool rounds' : 'Rounds'}</h2><ol class="pub-rounds">${d.rounds.slice().reverse().map(r => `<li><div class="card"><h2>${esc(r.title)}${r === cur && d.status === 'live' ? ' · now' : ''}</h2><ul>${r.matches.map(m => BK.lineHTML(m, d)).join('')}</ul>${r.byes.length ? `<p class="pub-note">Sitting out: ${esc(r.byes.join(', '))}</p>` : ''}</div></li>`).join('')}</ol></section>`);
    }
    main.innerHTML = parts.join('');
    fit();
    main.querySelectorAll('.bk-scroll').forEach((e, i) => { if (sx[i]) e.scrollLeft = sx[i]; });
  }

  function showDead() {
    dead = true; clearTimeout(timer);
    root.classList.remove('tv');
    $('#pub-tv').hidden = true; $('#pub-meta').textContent = ''; $('#pub-name').textContent = '';
    document.title = 'Bracket link not active · Dink Score';
    $('#pub-body').innerHTML = `<div class="pub-dead card" role="alert"><h1>This bracket link is not active</h1><p class="pub-note">It may have been turned off or replaced. Ask the organizer for the current link.</p></div>`;
    status();
  }

  async function load() {
    if (dead) return;
    try {
      const r = await fetch('/api/bracket?token=' + encodeURIComponent(token), { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
      if (r.status === 404) return showDead();
      if (!r.ok) throw new Error('bad status');
      const text = await r.text();
      failed = 0; lastCheck = Date.now();
      if (text !== json) { json = text; data = JSON.parse(text); render(); }
    } catch { failed++; }
    status();
  }
  // Poll every few seconds while the page is on screen; stop while it is hidden and catch up the moment it is shown.
  function loop() { clearTimeout(timer); if (dead || document.hidden) return; timer = setTimeout(async () => { await load(); loop(); }, POLL + Math.floor(Math.random() * 1500)); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(timer); else { load().then(loop); } });
  window.addEventListener('resize', () => { if (data) requestAnimationFrame(fit); });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && tv && root.dataset.fs) { delete root.dataset.fs; setTv(false); } else if (document.fullscreenElement) root.dataset.fs = '1'; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && tv && !document.fullscreenElement) setTv(false); if ((e.key === 't' || e.key === 'T') && !e.metaKey && !e.ctrlKey && data) setTv(!tv, true); });
  $('#pub-tv').addEventListener('click', () => setTv(!tv, true));

  if (!token) showDead();
  else { setTv(tv, false); load().then(loop); }
})();
</script>
</body>
</html>
