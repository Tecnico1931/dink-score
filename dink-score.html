}

/* ---------- scoring screen ---------- */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && live && live.open) keepAwake(true); });

function resultBlock(teams, score, winner) {
  const side = t => `<div class="side ${winner === t ? 'won' : ''}" style="--c:${TEAM_COLOR[t]}"><b>${score[t]}</b><small>${esc(teamLabel(teams[t]))}</small></div>`;
  return `<div class="result">${side(0)}<span class="vs">to</span>${side(1)}</div>`;
}

// Would winning the next rally end the game for team t?
function isGamePoint(s, t) {
  if (s.winner !== null) return false;
  if (s.cfg.scoring !== 'rally' && s.serving !== t) return false; // side-out: only the serving side can score
  const next = s.score[t] + 1;
  return next >= s.cfg.target && next - s.score[1 - t] >= s.cfg.winBy;
}
const clock = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
let lastTap = null; // where the last rally tap landed, for the ripple

function renderCourt() {
  const root = $('#overlay');
  if (!live || !live.open) { root.innerHTML = ''; document.body.style.overflow = logForm ? 'hidden' : ''; return; }
  document.body.style.overflow = 'hidden';
  const s = live.state, cfg = s.cfg;
  const callParts = PB.call(s);
  const callLabels = callParts.length === 3 ? ['Serving', 'Receiving', 'Server'] : ['Serving', 'Receiving'];
  const serverName = cfg.teams[s.serving][s.server];
  const side = PB.serverSide(s);
  const half = t => {
    const k = t ? 'b' : 'a';
    const serving = s.serving === t;
    const avs = cfg.teams[t].map((p, i) => `<i class="${serving && s.server === i ? 'srv' : ''}">${esc(initials(p))}</i>`).join('');
    const names = cfg.teams[t].map((p, i) => `<span class="${serving && s.server === i ? 'srv' : ''}">${esc(p)}</span>`).join('');
    const serverTag = cfg.mode === 'doubles' && cfg.scoring === 'sideout' ? ` ${s.serverNum === 1 ? '1st' : '2nd'}` : '';
    const badges = [
      serving ? `<span class="pill serve"><span class="ball"></span>Serving${serverTag}</span>` : '',
      isGamePoint(s, t) ? '<span class="pill gp">Game point</span>' : ''
    ].join('');
    const sideMini = serving ? `<div class="side-mini"><span>From the ${side}</span><div class="boxes" aria-hidden="true">${t === 0 ? `<i class="${side === 'left' ? 'on' : ''}"></i><i class="${side === 'right' ? 'on' : ''}"></i>` : `<i class="${side === 'right' ? 'on' : ''}"></i><i class="${side === 'left' ? 'on' : ''}"></i>`}</div></div>` : '<span></span>';
    const pct = Math.min(100, Math.round(100 * s.score[t] / cfg.target));
    return `<button class="half ${serving ? '' : 'idle'}" data-k="${k}" data-rally="${t}" aria-label="${esc(teamLabel(cfg.teams[t]))} won the rally. Their score is ${s.score[t]}${serving ? ', serving' : ''}">
      <span class="glow"></span>
      <span class="inner">
        <span class="team-row"><span class="avs">${avs}</span><span class="names">${names}</span><span class="badges">${badges}</span></span>
        <span class="score-row"><span class="big ${bumpTeam === t ? 'bump' : ''}">${s.score[t]}</span>${sideMini}</span>
        <span class="progress" aria-hidden="true"><b style="width:${pct}%"></b></span>
      </span></button>`;
  };
  let sheet = '';
  if (s.winner !== null) {
    const w = s.winner;
    sheet = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="win-h"><span class="grip"></span>
      <h2 class="winner-line" id="win-h">${esc(teamLabel(cfg.teams[w]))} ${cfg.teams[w].length > 1 ? 'win' : 'wins'}</h2>
      ${resultBlock(cfg.teams, s.score, w)}
      <div class="facts"><div><b>${s.rallies}</b><small>Rallies</small></div><div><b>${minutes(s)} min</b><small>Duration</small></div><div><b>${cfg.scoring === 'rally' ? 'Rally' : 'Side-out'}</b><small>To ${cfg.target}</small></div></div>
      ${ratingPreview(s)}
      <div class="btns"><button class="btn btn-ball" data-act="rematch">Save and rematch</button>
        <button class="btn btn-ink" data-act="finish">Save and finish</button>
        <button class="btn btn-soft" data-act="undo">Undo last rally</button></div></div></div>`;
  } else if (live.confirmEnd) {
    sheet = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="end-h"><span class="grip"></span>
      <h2 class="winner-line" id="end-h">Leave this game?</h2>
      <p>It's ${s.score[0]}–${s.score[1]}. Pause to pick it up later, or end it. Unfinished games stay out of your record.</p>
      <div class="btns"><button class="btn btn-ink" data-act="minimize">Pause game</button>
        <button class="btn btn-soft" data-act="keep">Keep playing</button>
        <button class="btn btn-danger" data-act="discard">End without saving</button></div></div></div>`;
  }
  const fresh = s.rallies === 0;
  root.innerHTML = `<div class="court">
    <div class="court-top">
      <button class="icon-btn" data-act="end" aria-label="Leave game">${ICON.back}</button>
      <div class="match"><b id="court-clock">${clock(Date.now() - s.startedAt)}</b><span>${cfg.mode === 'doubles' ? 'Doubles' : 'Singles'}, ${cfg.scoring === 'rally' ? 'rally scoring' : 'side-out'} to ${cfg.target}, rally ${s.rallies + 1}</span></div>
      <div class="cright"><button class="icon-btn" data-act="log-open" aria-label="Log a result from another court">${ICON.plus}</button><button class="icon-btn" data-act="undo" aria-label="Undo last rally" ${live.stack.length ? '' : 'disabled'}>${ICON.undo}</button></div>
    </div>
    ${half(0)}
    <div class="net" aria-live="polite">
      <div class="call" aria-label="Score call ${callParts.join(' ')}">${callParts.map((n, i) => `<div><b>${n}</b><small>${callLabels[i]}</small></div>`).join('')}</div>
      ${fresh ? '<div class="first-hint">Tap the side that wins each rally</div>' : `<div class="who"><b>${esc(serverName)}</b> serves from the ${side}</div>`}
    </div>
    ${half(1)}
  </div>${live.toast ? `<div class="toast" role="status">${esc(live.toast)}</div>` : ''}${sheet}`;
  bumpTeam = null;
  if (lastTap) {
    const el = root.querySelector(`.half[data-rally="${lastTap.t}"]`);
    if (el) { const r = document.createElement('span'); r.className = 'ripple'; r.style.left = lastTap.x + 'px'; r.style.top = lastTap.y + 'px'; el.appendChild(r); }
    lastTap = null;
  }
}
// The game clock ticks without redrawing the court.
setInterval(() => { const el = document.getElementById('court-clock'); if (el && live && live.open && live.state.winner === null) el.textContent = clock(Date.now() - live.state.startedAt); }, 1000);
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('.half[data-rally]');
  if (!h) return;
  const r = h.getBoundingClientRect();
  lastTap = { t: h.dataset.rally, x: e.clientX - r.left, y: e.clientY - r.top };
});

function ratingPreview(s) {
  const rec = Object.assign(record(s), { id: '__pending' });
  const { changes } = DR.compute([...allGames(), rec]);
  const c = changes.__pending;
  if (!c) return '';
  const named = c.list.filter(x => !isDefaultName(x.name));
  if (!named.length) return `<p class="expect">Add player names next time to track Dink Ratings.</p>`;
  const fav = c.expected >= 0.5 ? 0 : 1;

  const target = s.cfg.target;
  const exp = Math.min(target - 1, Math.round(target * (1 - pf) / pf));
  const expText = Math.abs(c.expected - 0.5) < 0.02 ? 'The forecast called it even.' : `The forecast had ${esc(teamLabel(s.cfg.teams[fav]))} winning ${target}–${exp}.`;
  return `<div style="display:flex;flex-direction:column;gap:8px"><p class="expect">${expText} Rating changes once saved:</p>
    <div class="changes">${named.map(x => `<div class="ch" style="--c:${TEAM_COLOR[x.team]}"><span class="tick"></span><span class="nm">${esc(x.name)}</span><span class="rt">${r2(x.after)}</span>${deltaHTML(x.after - x.before)}</div>`).join('')}</div></div>`;
}

function submitLog() {
  if (needsClubToLog()) { logForm = null; openLog(); return; }
  const f = logForm;
  const n = f.mode === 'doubles' ? 2 : 1;
  const teams = [0, 1].map(t => Array.from({ length: n }, (_, i) => (f.names[t][i] || '').trim()));
  const score = f.score.map(v => parseInt(v, 10));
  const err = msg => { f.error = msg; renderLog(); };
  if (teams.flat().some(x => !x)) return err(`Add a name for all ${n * 2} players.`);
  const flat = teams.flat().map(x => x.toLowerCase());
  if (new Set(flat).size !== flat.length) return err('Each player can only appear once.');
  if (score.some(v => !Number.isFinite(v) || v < 0 || v > 99)) return err('Enter both scores, from 0 to 99.');
  if (score[0] === score[1]) return err("Scores can't be tied. Pickleball games need a winner.");
  const endedAt = f.when ? new Date(f.when).getTime() : Date.now();
  if (!Number.isFinite(endedAt)) return err('Pick when the game finished.');
  const winner = score[0] > score[1] ? 0 : 1;
  saveGame({ id: newId(endedAt), startedAt: endedAt, endedAt, mode: f.mode, scoring: 'sideout', target: f.target, winBy: 2, teams, score, winner, rallies: 0, logged: true });
  logForm = null;
  render();

}

/* ---------- player profiles ---------- */
let profile = null; // { name, mode } when a profile is open
function playerProfile(name, mode, games) {
  const key = name.trim().toLowerCase();
  const isMe = n => n.trim().toLowerCase() === key;
  const { tables, changes } = DR.compute(games);
  const asc = [...games].sort((a, b) => a.endedAt - b.endedAt)
    .filter(g => (g.mode === 'singles' ? 'singles' : 'doubles') === mode && g.teams.some(t => t.some(isMe)));
  const series = [{ r: DR.START }];
  const partners = new Map(), opps = new Map();
  let w = 0, l = 0, pf = 0, pa = 0;
  const tally = (map, n, won) => { const k = n.trim().toLowerCase(); const e = map.get(k) || { name: n.trim(), g: 0, w: 0 }; e.g++; if (won) e.w++; map.set(k, e); };
  for (const g of asc) {
    const t = g.teams[0].some(isMe) ? 0 : 1;
    const won = g.winner === t;
    if (won) w++; else l++;
    pf += Number(g.score[t]); pa += Number(g.score[1 - t]);
    const ch = changes[g.id] && changes[g.id].list.find(x => isMe(x.name));
    series.push({ r: ch ? ch.after : series[series.length - 1].r, g, t, won });
    for (const n of g.teams[t]) if (!isMe(n)) tally(partners, n, won);
    for (const n of g.teams[1 - t]) tally(opps, n, won);
  }
  const p = DR.lookup(tables, mode, name);
  const byGames = m => [...m.values()].filter(e => !isDefaultName(e.name)).sort((a, b) => b.g - a.g || b.w / b.g - a.w / a.g);
  const partnerList = byGames(partners);
  const best = partnerList.filter(e => e.g >= 2).sort((a, b) => b.w / b.g - a.w / a.g || b.g - a.g)[0];
  return { name: p ? p.name : name, p, rel: p ? Math.round(DR.reliability(p, Date.now()) * 100) : 0, series, w, l, pf, pa, partners: partnerList, best, opps: byGames(opps), recent: asc.slice(-5).reverse() };
}
// Rating over time: one series, so no legend; the heading names it. Hover or drag to read each game.
function ratingChart(series) {
  const W = 320, H = 140, L = 34, R = 12, T = 12, B = 20;
  const rs = series.map(s => s.r);
  let lo = Math.min(...rs, DR.START), hi = Math.max(...rs, DR.START);
  if (hi - lo < 0.2) { const m = (hi + lo) / 2; lo = m - 0.1; hi = m + 0.1; }
  lo -= (hi - lo) * 0.1; hi += (hi - lo) * 0.1;
  const x = i => L + (series.length === 1 ? 0 : (i / (series.length - 1)) * (W - L - R));
  const y = r => T + (1 - (r - lo) / (hi - lo)) * (H - T - B);
  const step = (hi - lo) > 1 ? 0.5 : (hi - lo) > 0.4 ? 0.2 : 0.1;
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(2));
  const pts = series.map((s, i) => `${x(i).toFixed(1)},${y(s.r).toFixed(1)}`);
  const last = series.length - 1;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rating over ${last} games, from ${r2(DR.START)} to ${r2(series[last].r)}" data-chart>
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="axis" x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${v.toFixed(step < 0.2 ? 1 : 1)}</text>`).join('')}
    <line class="base" x1="${L}" x2="${W - R}" y1="${y(DR.START).toFixed(1)}" y2="${y(DR.START).toFixed(1)}"/>
    <path class="area" d="M${pts[0]} L${pts.join(' L')} L${x(last).toFixed(1)},${H - B} L${L},${H - B} Z"/>
    <polyline class="line" points="${pts.join(' ')}"/>
    <circle class="end" cx="${x(last).toFixed(1)}" cy="${y(series[last].r).toFixed(1)}" r="4.5"/>
    <text class="axis" x="${L}" y="${H - 4}">Start</text><text class="axis" x="${W - R}" y="${H - 4}" text-anchor="end">Game ${last}</text>
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="hover-dot" r="4" visibility="hidden"/>
  </svg>`;
  return { svg, geo: { W, L, R, n: series.length, x, y } };
}
let chartGeo = null, chartSeries = null;
function wireChart() {
  const card = document.querySelector('#sheet4 .chart-card');
  const svgEl = card && card.querySelector('svg');
  if (!svgEl || !chartGeo) return;
  const tip = card.querySelector('.chart-tip'), cross = svgEl.querySelector('.cross'), dot = svgEl.querySelector('.hover-dot');
  const show = clientX => {
    const box = svgEl.getBoundingClientRect();
    const vx = (clientX - box.left) / box.width * chartGeo.W;
    const i = Math.max(0, Math.min(chartGeo.n - 1, Math.round((vx - chartGeo.L) / ((chartGeo.W - chartGeo.L - chartGeo.R) / Math.max(1, chartGeo.n - 1)))));
    const s = chartSeries[i];
    const cx = chartGeo.x(i), cy = chartGeo.y(s.r);
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('visibility', 'visible');
    const prev = i > 0 ? chartSeries[i - 1].r : s.r;
    const d = Math.round((s.r - prev) * 100) / 100;
    tip.innerHTML = i === 0 ? `<b>${r2(s.r)}</b> starting rating`
      : `<b>${r2(s.r)}</b> ${d === 0 ? '±0.00' : (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2)}<br>${s.won ? 'Won' : 'Lost'} ${Number(s.g.score[s.t])}–${Number(s.g.score[1 - s.t])} vs ${esc(teamLabel(s.g.teams[1 - s.t]))}`;
    tip.hidden = false;
    // Keep the readout inside the card: centre it on the point, then nudge it in from either edge.
    const px = (cx / chartGeo.W) * box.width + (box.left - card.getBoundingClientRect().left);
    const half = tip.offsetWidth / 2, cw = card.clientWidth;
    tip.style.left = Math.max(half + 6, Math.min(cw - half - 6, px)) + 'px';
  };
  const hide = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  svgEl.addEventListener('pointermove', e => show(e.clientX));
  svgEl.addEventListener('pointerdown', e => show(e.clientX));
  svgEl.addEventListener('pointerleave', hide);
}
function renderProfile() {
  const root = $('#sheet4');
  if (!profile) { root.innerHTML = ''; return; }
  const pr = playerProfile(profile.name, profile.mode, allGames());
  const games = pr.w + pr.l;
  const diff = pr.pf - pr.pa;
  const row = (e, extra = '') => `<div class="pf-row"><span class="who"><button data-player="${esc(e.name)}">${esc(e.name)}</button>${extra}</span><span class="n">${e.w}–${e.g - e.w}</span><span class="pct">${Math.round(100 * e.w / e.g)}%</span></div>`;

  }
  root.innerHTML = `<div class="sheet-bg top"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pf-h"><span class="grip"></span>
    <div class="pf-head"><span class="av">${esc(initials(pr.name))}</span><h2 id="pf-h">${esc(pr.name)}</h2><button type="button" class="x" data-act="profile-close" aria-label="Close">✕</button></div>
    ${seg('data-pmode', [['doubles', 'Doubles'], ['singles', 'Singles']], profile.mode, 'sm')}
    ${body}</div></div>`;
  wireChart();
}

  if (tourStep === null || tourTouchX === null) return;
  const dx = e.changedTouches[0].clientX - tourTouchX; tourTouchX = null;
  if (Math.abs(dx) < 50) return;
  if (dx < 0 && tourStep < tourSteps().length - 1) tourStep++; else if (dx > 0 && tourStep > 0) tourStep--;
  renderTour();
}, { passive: true });

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el) {
    if (profile && e.target.closest && e.target.closest('#sheet4') && e.target.classList.contains('sheet-bg')) { profile = null; renderProfile(); return; }
    if (logForm && e.target.classList && e.target.classList.contains('sheet-bg') && e.target.classList.contains('top')) { logForm = null; render(); }
    return;
  }
  const ds = el.dataset;
  if (ds.tour) {
    if (ds.tour === 'next') tourStep++;
    else if (ds.tour === 'back') tourStep--;
    else if (ds.tour === 'open') tourStep = 0;
    if (ds.tour === 'done') closeTour(); else renderTour();
    return;
  }
  if (ds.player) { profile = { name: ds.player, mode: profile ? profile.mode : ratingMode }; renderProfile(); const sh = $('#sheet4 .sheet'); if (sh) sh.scrollTop = 0; return; }
  if (ds.pmode) { profile.mode = ds.pmode; renderProfile(); return; }
  if (ds.act === 'profile-close') { profile = null; renderProfile(); return; }
  if (ds.restore) { withPin({ type: 'restore', id: ds.restore }); return; }
  if (ds.act && ds.act.startsWith('pin-')) {
    const a = ds.act;
    if (a === 'pin-cancel') clubSheet = clubSheet && clubSheet.back === 'club' || (clubSheet && clubSheet.view === 'setpin') ? { view: 'club' } : null;
    if (a === 'pin-set-open') clubSheet = { view: 'setpin' };
    if (a === 'pin-unlock-open') clubSheet = { view: 'unlock', back: 'club' };
    if (a === 'pin-lock') { forgetPin(); clubSheet = { view: 'club', msg: 'This phone is locked. Deleting games needs the PIN again.' }; }
    renderClub(); if (!clubSheet) render(); return;
  }
  if (ds.act && ds.act.startsWith('club-')) {
    const a = ds.act;
    if (a === 'club-open') { logAfterJoin = false; startAfterJoin = false; clubSheet = { view: 'club' }; }
    if (a === 'club-close') { logAfterJoin = false; startAfterJoin = false; clubSheet = null; if (renderPending) safeRender(); }
    if (a === 'club-join-invite') { const code = clubSheet.joinCode; clubSheet = { view: 'club', joinCode: code }; renderClub(); clubJoinByCode(code); return; }
    if (a === 'club-upload') { uploadLocalGames(); return; }
    if (a === 'club-leave') {
      if (!clubSheet.confirmLeave) { clubSheet.confirmLeave = true; clubSheet.msg = `Tap again to leave. ${club.name}'s games stay in the club. This phone goes back to its own games.`; renderClub(); return; }
      leaveClub(); clubSheet = null;
    }
    if (a === 'club-copy') {
      const link = inviteLink();
      const done = () => { clubSheet.copied = true; renderClub(); setTimeout(() => { if (clubSheet) { clubSheet.copied = false; renderClub(); } }, 2000); };
      try { navigator.clipboard.writeText(link).then(done, () => { const i = $('#invite-link'); if (i) i.select(); }); } catch { const i = $('#invite-link'); if (i) i.select(); }
      return;
    }
    renderClub(); return;
  }
  if (ds.tab) { tab = ds.tab; store.set('pb.tab', tab); armedDelete = null; render(); try { window.scrollTo(0, 0); } catch {} return; }
  if (ds.tabGo) { tab = ds.tabGo; store.set('pb.tab', tab); render(); try { window.scrollTo(0, 0); } catch {} return; }
  for (const k of ['mode', 'scoring', 'target', 'winBy']) {
    const v = el.getAttribute('data-set-' + k);
    if (v !== null) { setup[k] = (k === 'target' || k === 'winBy') ? +v : v; store.set('pb.setup', setup); render(); return; }
  }
  if (ds.logMode) { logForm.mode = ds.logMode; renderLog(); return; }
  if (ds.logTarget) { logForm.target = +ds.logTarget; renderLog(); return; }
  if (ds.step !== undefined) {
    const t = +ds.step; const cur = parseInt(logForm.score[t], 10);
    logForm.score[t] = String(Math.min(99, Math.max(0, (Number.isFinite(cur) ? cur : (+ds.d > 0 ? -1 : 1)) + +ds.d)));
    const input = $('#log-score-' + t); if (input) input.value = logForm.score[t];
    return;
  }
  if (ds.pick !== undefined) {
    if (ds.scope === 'log') { pickInto(logForm.names, logForm.mode, ds.pick); renderLog(); return; }
    if (rosterEdit) { removeFromRoster(ds.pick); if (!roster.length) rosterEdit = false; }
    else { pickInto(setup.names, setup.mode, ds.pick); store.set('pb.setup', setup); }
    render(); return;
  }
  if (ds.rmode) { ratingMode = ds.rmode; store.set('pb.rmode', ratingMode); render(); return; }
  if (ds.first) { setup.first = +ds.first; store.set('pb.setup', setup); render(); return; }
  if (ds.del) {
    if (armedDelete === ds.del) { armedDelete = null; deleteGame(ds.del); } else { armedDelete = ds.del; render(); }
    return;
  }
  if (ds.rally !== undefined && live && live.state.winner === null && !live.confirmEnd && !logForm) {
    buzz();
    const before = live.state.score.slice();
    live.stack.push(live.state);
    live.state = PB.rally(live.state, +ds.rally);
    bumpTeam = live.state.score[0] !== before[0] ? 0 : live.state.score[1] !== before[1] ? 1 : null;
    if (live.state.justSwitched && live.state.winner === null) showToast(`Change ends. A team reached ${PB.switchAt(live.state.cfg.target)}.`);
    persistLive(); renderCourt(); return;
  }
  const act = ds.act;
  if (!act) return;
  if (act === 'log-open') { openLog(); return; }
  if (act === 'log-close') { logForm = null; render(); return; }
  if (act === 'swap') { setup.names = [setup.names[1], setup.names[0]]; setup.first = 1 - setup.first; store.set('pb.setup', setup); render(); }
  if (act === 'roster-edit') { rosterEdit = !rosterEdit; render(); }
  if (act === 'start') beginGame();
  if (act === 'resume') { live.open = true; persistLive(); keepAwake(true); render(); }
  if (act === 'undo' && live && live.stack.length) { live.state = live.stack.pop(); live.toast = null; persistLive(); renderCourt(); }
  if (act === 'end') { live.confirmEnd = true; renderCourt(); }
  if (act === 'keep') { live.confirmEnd = false; renderCourt(); }
  if (act === 'minimize') { live.confirmEnd = false; live.open = false; persistLive(); keepAwake(false); render(); }
  if (act === 'discard') { live = null; persistLive(); keepAwake(false); render(); }
  if (act === 'finish' || act === 'rematch') {
    const s = live.state;
    saveGame(record(s));
    if (act === 'rematch') startGame(Object.assign({}, s.cfg, { first: 1 - (s.cfg.first || 0) }));
    else { live = null; persistLive(); keepAwake(false); tab = 'history'; store.set('pb.tab', tab); render(); try { window.scrollTo(0, 0); } catch {} }
  }
});
let fcTimer;
document.addEventListener('input', e => {
  const d = e.target.dataset || {};
  if (d.name) {
    const [t, i] = d.name.split('-').map(Number);
    setup.names[t][i] = e.target.value; store.set('pb.setup', setup);
    clearTimeout(fcTimer);
    fcTimer = setTimeout(() => { const el = $('#forecast'); if (el) el.innerHTML = forecastHTML(); }, 250);
  } else if (d.logName && logForm) {
    const [t, i] = d.logName.split('-').map(Number); logForm.names[t][i] = e.target.value;
  } else if (d.logScore !== undefined && logForm) {
    logForm.score[+d.logScore] = e.target.value;
  } else if (e.target.hasAttribute && e.target.hasAttribute('data-log-when') && logForm) {
    logForm.when = e.target.value;
  }
});
document.addEventListener('submit', e => {
  const form = e.target;
  if (form.matches('[data-form="log"]')) { e.preventDefault(); submitLog(); return; }
  if (form.matches('[data-form="club-join"]')) { e.preventDefault(); clubSheet.joinCode = $('#club-code').value; clubJoinByCode(clubSheet.joinCode); return; }
  if (form.matches('[data-form="club-create"]')) { e.preventDefault(); clubCreate($('#club-name').value, $('#club-new-pin').value); return; }
  if (form.matches('[data-form="pin-unlock"]')) { e.preventDefault(); pinUnlock($('#pin-input').value); return; }
  if (form.matches('[data-form="pin-set"]')) { e.preventDefault(); pinSet($('#pin-old') ? $('#pin-old').value : '', $('#pin-new').value, $('#pin-new2').value); return; }
  if (!form.matches('[data-form="add-player"]')) return;
  e.preventDefault();
  const name = $('#new-player').value.trim();
  if (!name) return;
  addToRoster([name]); render();
  const again = $('#new-player'); if (again) again.focus();
});
document.addEventListener('keydown', e => {
  if (tourStep !== null) {
    if (e.key === 'Escape') closeTour();
    else if (e.key === 'ArrowRight' && tourStep < tourSteps().length - 1) { tourStep++; renderTour(); }
    else if (e.key === 'ArrowLeft' && tourStep > 0) { tourStep--; renderTour(); }
    return;
  }
  if (e.key === 'Escape' && profile) { profile = null; renderProfile(); return; }
  if (e.key === 'Escape' && clubSheet) { clubSheet = null; renderClub(); if (renderPending) safeRender(); return; }
  if (e.key === 'Escape' && logForm) { logForm = null; render(); return; }
  if (!live || !live.open || live.state.winner !== null || live.confirmEnd || logForm || clubSheet || profile) return;
  if (e.target.matches && e.target.matches('input')) return;
  if (e.key === '1' || e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); document.querySelector('[data-rally="0"]').click(); }
  if (e.key === '2' || e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); document.querySelector('[data-rally="1"]').click(); }
  if ((e.key === 'z' && (e.ctrlKey || e.metaKey)) || e.key === 'Backspace') { e.preventDefault(); document.querySelector('[data-act="undo"]').click(); }
});

if (live && live.state.winner === null && live.open) keepAwake(true);
render();
if (importedCount) showToast(`Moved ${importedCount} game${importedCount === 1 ? '' : 's'} from the old site`, false);
if (club) { flush(); refreshClub(); }
checkInvite();
</script>
