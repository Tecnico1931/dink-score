<title>Dink Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist:wght@400..700&display=swap">
<style>
/* Layout: phone-first app. Home is a tile grid (now playing, log a result, top player, this week) over the game setup card.
   A floating pill tab bar. Scoring is two rounded court panels with condensed numerals and a score-call pill between them.
   One bold idea: the variable grotesque squeezed narrow and heavy for every number that matters. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #E9EDF2;
  --ink: #0E1726;
  --muted: #5D6A7B;
  --line: #DEE4EA;
  --blue: #2B49E6;      /* team 1 court */
  --green: #0B8562;     /* team 2 court */
  --ball: #DDF247;      /* serve, highlights */
  --ball-ink: #1B2104;
  --up: #0B8562;
  --down: #C2372B;
  --danger: #C2372B;
  --focus: #2B49E6;
  --shadow: 0 1px 2px rgb(14 23 38 / .06), 0 8px 24px -12px rgb(14 23 38 / .18);
  --display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --ui: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F17; --surface: #131B26; --surface-2: #1B2532; --ink: #EEF2F7; --muted: #8E9BAD; --line: #243142;
    --blue: #3D5BFF; --green: #12A578; --ball: #DDF247; --ball-ink: #1B2104;
    --up: #3DD69E; --down: #FF7A6B; --danger: #FF7A6B; --focus: #9DB0FF;
    --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 30px -14px rgb(0 0 0 / .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F17; --surface: #131B26; --surface-2: #1B2532; --ink: #EEF2F7; --muted: #8E9BAD; --line: #243142;
  --blue: #3D5BFF; --green: #12A578; --ball: #DDF247; --ball-ink: #1B2104;
  --up: #3DD69E; --down: #FF7A6B; --danger: #FF7A6B; --focus: #9DB0FF;
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 30px -14px rgb(0 0 0 / .7);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, .n { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(112px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark { display: flex; align-items: center; gap: 10px; }
.wordmark svg { width: 34px; height: 34px; flex: none; }
.wordmark h1 { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 28px; letter-spacing: -.02em; line-height: 1; margin: 0; }
.sync { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.sync.on::before { background: var(--up); }
h2 { font-family: var(--display); font-weight: 700; font-stretch: 90%; font-size: 26px; letter-spacing: -.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 700; font-stretch: 90%; font-size: 19px; letter-spacing: -.01em; margin: 0; }
.sub { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.card { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); }

/* Home tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 0; border-radius: 22px; padding: 16px; box-shadow: var(--shadow); text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 132px; }
.tile .t-k { font-size: 13px; color: var(--muted); font-weight: 500; }
.tile .t-big { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: .95; letter-spacing: -.02em; }
.tile .t-name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; line-height: 1.2; }
.tile .t-foot { margin-top: auto; font-size: 13px; color: var(--muted); }
.tile.wide { grid-column: 1 / -1; }
.tile.live { background: var(--ink); color: var(--bg); min-height: 0; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 14px; }
.tile.live .t-k { color: inherit; opacity: .65; display: flex; align-items: center; gap: 8px; }
.tile.live .t-k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ball); box-shadow: 0 0 0 4px rgb(221 242 71 / .25); }
.tile.live .t-big { font-size: 54px; grid-column: 1; }
.tile.live .t-name { grid-column: 1; font-weight: 500; opacity: .8; font-size: 14px; }
.tile.live .go { grid-column: 2; grid-row: 1 / span 3; background: var(--ball); color: var(--ball-ink); border-radius: 999px; padding: 12px 18px; font-weight: 700; }
.tile.log { background: var(--blue); color: #fff; }
.tile.log .t-k { color: rgb(255 255 255 / .8); }
.tile.log .plus { width: 34px; height: 34px; border-radius: 50%; background: rgb(255 255 255 / .18); display: grid; place-items: center; font-size: 22px; line-height: 1; }
.tile.log .t-name { margin-top: auto; font-size: 17px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 58px; margin-top: 4px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.week i { display: block; width: 100%; max-width: 26px; border-radius: 6px; background: var(--surface-2); min-height: 4px; }
.week i.has { background: var(--green); }
.week i.today { outline: 2px solid var(--ball); outline-offset: 1px; }
.week span { font-size: 11px; color: var(--muted); }

/* Setup */
.field { display: flex; flex-direction: column; gap: 8px; }
.field + .field { margin-top: 14px; }
.lab { font-size: 13px; font-weight: 500; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 10px 6px; font-weight: 600; font-size: 15px; color: var(--muted); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(14 23 38 / .14); }
.seg.sm button { padding: 7px 10px; font-size: 14px; }
.seg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.teams { display: grid; gap: 10px; margin-top: 18px; position: relative; }
.team { border-radius: 18px; padding: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }
.team::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--c); }
.team .thead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.team .tname { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.team .tname::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.team input { width: 100%; min-width: 0; border: 1px solid transparent; background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.team input:focus-visible { outline: none; border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.serve-pick { border: 0; background: transparent; border-radius: 999px; padding: 5px 10px 5px 6px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.serve-pick .ball { opacity: .35; }
.serve-pick[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink); }
.serve-pick[aria-pressed="true"] .ball { opacity: 1; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .25); }
.swap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--surface); background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 16px; padding: 0; }
.ball { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; background: radial-gradient(circle at 35% 35%, #F4FAB8 0 16%, var(--ball) 17%); }

.roster { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.roster .rhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; max-width: 100%; overflow-wrap: anywhere; }
.chip-btn .r { font-family: var(--display); font-stretch: 75%; font-weight: 700; font-size: 14px; color: var(--muted); }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-btn[aria-pressed="true"] .r { color: inherit; opacity: .65; }
.chip-btn.editing { border-style: dashed; }
.chip-btn.editing::after { content: "✕"; font-size: 11px; color: var(--danger); }
.add-player { display: flex; gap: 8px; }
.add-player input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.link { border: 0; background: transparent; padding: 4px 2px; font-size: 14px; font-weight: 600; color: var(--blue); }
.link.armed { color: var(--danger); }

.forecast { margin-top: 16px; border-radius: 16px; background: var(--surface-2); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
.forecast .fc-k { font-size: 12px; color: var(--muted); font-weight: 500; }
.forecast .fc-who { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.forecast .fc-score { grid-row: 1 / span 2; grid-column: 2; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 34px; line-height: 1; }
.forecast .fc-note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin: 4px 0 0; }

.btn { border: 0; border-radius: 16px; padding: 16px 20px; font-weight: 700; font-size: 16px; display: inline-flex; justify-content: center; align-items: center; gap: 10px; }
.btn:active { transform: scale(.985); }
.btn-ink { background: var(--ink); color: var(--bg); }
.btn-ball { background: var(--ball); color: var(--ball-ink); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-soft { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--danger); color: #fff; }
.btn.block { width: 100%; }
.start { margin-top: 18px; }

/* Lists */
.games { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.game { background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; }
.game .lines { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.game .line { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; }
.game .tick { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.game .who { min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
.game .win .who { color: var(--ink); font-weight: 600; }
.game .pts { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 26px; line-height: 1; min-width: 2ch; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.game .win .pts { color: var(--ink); }
.game .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-left: 18px; }
.tag { background: var(--surface-2); border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 500; }
.tag.logged { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }

.empty { background: var(--surface); border-radius: 22px; padding: 24px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty p { margin: 0; color: var(--muted); max-width: 42ch; }

.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.totals div { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.totals b { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.totals span { font-size: 13px; color: var(--muted); }

/* Leaders */
.podium { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; align-items: end; }
.step { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.step .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 17px; margin-bottom: 6px; }
.step.s1 .avatar { width: 58px; height: 58px; font-size: 21px; box-shadow: 0 0 0 4px var(--ball); }
.step .pl-name { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; line-height: 1.2; }
.step .pl-rating { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.step.s1 .pl-rating { font-size: 38px; }
.step .block { width: 100%; margin-top: 8px; border-radius: 16px 16px 6px 6px; display: flex; justify-content: center; padding-top: 8px; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 24px; background: var(--surface); box-shadow: var(--shadow); color: var(--muted); }
.step.s1 .block { height: 96px; background: var(--ink); color: var(--ball); }
.step.s2 .block { height: 70px; }
.step.s3 .block { height: 52px; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.prow { background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 2.2ch 1fr auto; gap: 12px; align-items: center; }
.prow .rank { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 20px; color: var(--muted); text-align: center; }
.prow:first-child .rank { color: var(--ink); }
.prow .pinfo { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.prow .pname { font-weight: 600; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.prow .pstats { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.prow .rel { display: inline-flex; align-items: center; gap: 6px; }
.prow .rel i { width: 44px; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; display: inline-block; position: relative; }
.prow .rel i b { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 2px; }
.prow .pr { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.prow .rating { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
.badge.prov { background: var(--surface-2); color: var(--muted); }
.badge.hot { background: var(--ball); color: var(--ball-ink); }
.delta { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat { color: var(--muted); font-weight: 500; }
.awards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.awards div { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.awards .aw-k { font-size: 13px; color: var(--muted); }
.awards .aw-name { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; line-height: 1.2; }
.awards .aw-v { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 26px; line-height: 1; margin-top: auto; padding-top: 6px; }

/* Rules */
.rules { display: flex; flex-direction: column; gap: 10px; }
.rule { background: var(--surface); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.rule p, .rule ul { margin: 0; color: var(--muted); max-width: 62ch; }
.rule ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.rule b { color: var(--ink); }
.call-demo { display: flex; gap: 10px; }
.call-demo div { flex: 1; background: var(--surface-2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
.call-demo strong { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: 1; }
.call-demo small { font-size: 12px; color: var(--muted); text-align: center; }

/* Tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
}
.tabs nav {
  pointer-events: auto; max-width: 420px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px;
  background: color-mix(in srgb, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 12px 34px -12px rgb(0 0 0 / .35);
}
.tabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* Scoring screen */
.court {
  position: fixed; inset: 0; z-index: 40; background: #070B11; color: #fff;
  display: grid; grid-template-rows: auto 1fr auto 1fr; gap: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
}
.court-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 2px; }
.court-top .info { font-size: 12px; color: rgb(255 255 255 / .55); text-align: center; min-width: 0; }
.court-top .cbtns { display: flex; gap: 6px; }
.court-top button { border: 0; background: rgb(255 255 255 / .1); color: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.court-top button:disabled { opacity: .3; }
.half { border: 0; padding: 0; color: #fff; background: var(--c); border-radius: 28px; position: relative; overflow: hidden; display: block; text-align: left; transition: transform .08s, filter .1s; }
.half:active { transform: scale(.992); filter: brightness(1.06); }
.half[data-k="a"] { --c: var(--blue); }
.half[data-k="b"] { --c: var(--green); }
.half::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 20% 0%, rgb(255 255 255 / .16), transparent 55%); pointer-events: none; }
.half .paint { position: absolute; inset: 18px 18px 0 18px; border: 2px solid rgb(255 255 255 / .28); border-bottom: 0; border-radius: 12px 12px 0 0; pointer-events: none; }
.half[data-k="b"] .paint { inset: 0 18px 18px 18px; border-top: 0; border-bottom: 2px solid rgb(255 255 255 / .28); border-radius: 0 0 12px 12px; }
.half .paint::before { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: rgb(255 255 255 / .28); bottom: 30%; }
.half .paint::after { content: ""; position: absolute; width: 2px; left: calc(50% - 1px); background: rgb(255 255 255 / .28); top: 0; bottom: 30%; }
.half[data-k="b"] .paint::before { bottom: auto; top: 30%; }
.half[data-k="b"] .paint::after { top: 30%; bottom: 0; }
.half .content { position: absolute; inset: 0; padding: 30px 32px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.half[data-k="a"] .content { padding-bottom: calc(30% + 12px); }
.half[data-k="b"] .content { padding-top: calc(30% + 12px); align-items: start; }
.players { display: flex; flex-direction: column; gap: 6px; align-self: start; min-width: 0; }
.half[data-k="b"] .players { align-self: end; }

<script id="engine">
/*ENGINE-START*/
const PB = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));
  function newGame(cfg) {
    const doubles = cfg.mode === 'doubles';
    const first = cfg.first || 0;
    return {
      cfg: clone(cfg), score: [0, 0], serving: first,
      // Side-out doubles starts at 0-0-2: only one server on the first service turn.
      serverNum: doubles && cfg.scoring === 'sideout' ? 2 : 1,
      right: [0, 0],   // index of the player standing in the right-hand court, per team
      server: 0,       // index of the serving player within the serving team
      rallies: 0, switched: false, justSwitched: false, winner: null,
      startedAt: Date.now(), endedAt: null
    };
  }
  function switchAt(target) { return Math.ceil(target / 2); }
  function rally(prev, w) {
    const s = clone(prev);
    s.justSwitched = false;
    if (s.winner !== null) return s;
    const doubles = s.cfg.mode === 'doubles';
    s.rallies++;
    if (s.cfg.scoring === 'rally') {
      s.score[w]++;
      if (w === s.serving) { if (doubles) s.right[w] = 1 - s.right[w]; }
      else { s.serving = w; s.server = doubles ? s.right[w] : 0; }
    } else if (w === s.serving) {
      s.score[w]++;
      if (doubles) s.right[w] = 1 - s.right[w]; // server moves to the other side and serves again
    } else if (doubles && s.serverNum === 1) {
      s.serverNum = 2; s.server = 1 - s.server; // partner serves from where they stand
    } else {
      s.serving = 1 - s.serving; s.serverNum = 1;
      s.server = doubles ? s.right[s.serving] : 0; // side out: player on the right serves first
    }
    const hi = Math.max(s.score[0], s.score[1]);
    if (!s.switched && hi >= switchAt(s.cfg.target)) { s.switched = true; s.justSwitched = true; }
    for (const t of [0, 1]) {
      if (s.score[t] >= s.cfg.target && s.score[t] - s.score[1 - t] >= s.cfg.winBy) { s.winner = t; s.endedAt = Date.now(); }
    }
    return s;
  }
  function call(s) {
    const a = s.score[s.serving], b = s.score[1 - s.serving];
    if (s.cfg.mode === 'doubles' && s.cfg.scoring === 'sideout') return [a, b, s.serverNum];
    return [a, b];
  }
  function serverSide(s) {
    if (s.cfg.mode === 'doubles') return s.server === s.right[s.serving] ? 'right' : 'left';
    return s.score[s.serving] % 2 === 0 ? 'right' : 'left';
  }
  return { newGame, rally, call, serverSide, switchAt };
})();

/* Dink Rating: our own performance rating, inspired by how DUPR is publicly described.
   - Scale 2.00 to 8.00. New players start at 3.50. Doubles and singles are rated separately.
   - A team's rating is the average of its players.
   - Each game has an expected share of points: share = 1 / (1 + 10^(-gap / 2.8)).
     A 0.50 rating gap expects roughly 11-7.
   - After the game: change = K x (actual share - expected share). Beat the forecast and you go up, even in a loss.
   - K shrinks as reliability grows: K = 0.06 + 0.24 x (1 - reliability).
   - Reliability = min(1, games / 20), fading after 30 days without a game (never below 40% of its value).

  const START = 3.5, MIN = 2, MAX = 8, SCALE = 2.8, FULL = 20;

  const expShare = gap => 1 / (1 + Math.pow(10, -gap / SCALE));

    if (!p || !p.games) return 0;
    const volume = Math.min(1, p.games / FULL);
    const days = (now - p.last) / DAY;

  const clamp = r => Math.min(MAX, Math.max(MIN, r));

    const tables = { doubles: new Map(), singles: new Map() };

        const k = key(n);

        return T.get(k);

      const tr = teams.map(t => t.reduce((s, p) => s + p.rating, 0) / t.length);

      const updates = [];

        const surprise = ti === 0 ? sA - pA : pA - sA;
        t.forEach(p => {
          const rel = reliability(p, g.endedAt);
          updates.push([p, clamp(p.rating + kFactor(rel) * surprise), ti]);
        });
      });
      // apply after computing, so partners and opponents all use pre-game ratings
      for (const [p, next, ti] of updates) {
        const before = p.rating;
        p.rating = next; p.delta = next - before; p.games++; p.last = g.endedAt;
        if (g.winner === ti) p.wins++;
        list.push({ name: p.name, team: ti, before, after: next });
      }
      changes[g.id] = { expected: pA, list };

    return { tables, changes };
  }
  function lookup(tables, mode, name) {
    return tables[mode === 'singles' ? 'singles' : 'doubles'].get(key(name)) || null;
  }
  function forecast(tables, mode, teams, target) {
    const tr = teams.map(t => t.reduce((s, n) => s + ((lookup(tables, mode, n) || {}).rating ?? START), 0) / t.length);
    const pA = expShare(tr[0] - tr[1]);
    const fav = pA >= 0.5 ? 0 : 1;
    const pf = fav === 0 ? pA : 1 - pA;
    const loser = Math.min(target - 1, Math.round(target * (1 - pf) / pf));
    return { pA, fav, score: fav === 0 ? [target, loser] : [loser, target], ratings: tr };
  }
  return { compute, forecast, lookup, reliability, expShare, START };
})();
/*ENGINE-END*/
</script>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };
const TEAM_COLOR = ['var(--blue)', 'var(--green)'];
const TEAM_NAME = ['Blue', 'Green'];
const DAY = 864e5;

/* ---------- state ---------- */
const defaults = { mode: 'doubles', scoring: 'sideout', target: 11, winBy: 2, first: 0, names: [['', ''], ['', '']] };
let setup = Object.assign({}, defaults, store.get('pb.setup', {}));
let tab = store.get('pb.tab', 'play');
if (!['play', 'leaders', 'history', 'rules'].includes(tab)) tab = 'play';
let live = store.get('pb.live', null); // { state, stack, open }
if (live) live.stack = live.stack || [];
let localGames = store.get('pb.games', []);
let cloudGames = null;
let gamesCol = null;
let syncOn = false;
let syncNote = 'On this device';
let armedDelete = null;
let bumpTeam = null;
let ratingMode = store.get('pb.rmode', 'doubles');
let logForm = null; // the "log a result" sheet when open

const r2 = n => n.toFixed(2);
const isDefaultName = n => /^Player \d+$/.test(n);
const sameName = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const initials = n => n.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
function deltaHTML(d) {
  const v = Math.round(d * 100) / 100;
  if (v === 0) return `<span class="delta flat">±0.00</span>`;
  return `<span class="delta ${v > 0 ? 'up' : 'down'}">${v > 0 ? '▲ ' : '▼ '}${Math.abs(v).toFixed(2)}</span>`;
}
function namesFor(names, mode, t) {
  const n = mode === 'doubles' ? 2 : 1;
  return Array.from({ length: n }, (_, i) => (names[t][i] || '').trim() || `Player ${t * 2 + i + 1}`);
}
const teamPlayers = t => namesFor(setup.names, setup.mode, t);
const teamLabel = players => players.join(' & ');
function allGames() {
  const map = new Map();
  for (const g of localGames) map.set(g.id, g);
  if (cloudGames) for (const g of cloudGames) map.set(g.id, g);
  return [...map.values()].sort((a, b) => b.endedAt - a.endedAt);
}
const minutes = g => Math.max(1, Math.round((g.endedAt - g.startedAt) / 60000));

/* ---------- saved players ---------- */
let roster = store.get('pb.roster', []);
let rosterEdit = false;
let profileDoc = null;
let rosterWriting = Promise.resolve();
function persistRoster() {
  roster.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
  store.set('pb.roster', roster);
  if (profileDoc) { const snap = roster.slice(); rosterWriting = rosterWriting.then(() => profileDoc.set({ roster: snap })).catch(() => {}); }
}
function addToRoster(names) {
  let changed = false;
  for (const raw of names) {
    const n = String(raw || '').trim().slice(0, 40);
    if (!n || isDefaultName(n) || roster.some(r => sameName(r, n))) continue;
    roster.push(n); changed = true;
  }
  if (changed) persistRoster();
}
function removeFromRoster(name) { roster = roster.filter(r => !sameName(r, name)); persistRoster(); }
// Toggle a saved player into the first open slot of a names grid, or out of it if already there.
function pickInto(names, mode, name) {
  const n = mode === 'doubles' ? 2 : 1;
  for (const t of [0, 1]) for (let i = 0; i < n; i++) if (sameName(names[t][i] || '', name)) { names[t][i] = ''; return; }
  for (const t of [0, 1]) for (let i = 0; i < n; i++) if (!(names[t][i] || '').trim()) { names[t][i] = name; return; }
}
function chipsHTML(names, mode, scope) {
  const { tables } = DR.compute(allGames());
  const n = mode === 'doubles' ? 2 : 1;
  const inUse = name => [0, 1].some(t => names[t].slice(0, n).some(v => sameName(v || '', name)));
  const editing = scope === 'setup' && rosterEdit;
  return roster.map(name => {
    const p = DR.lookup(tables, mode, name);
    return `<button type="button" class="chip-btn ${editing ? 'editing' : ''}" data-pick="${esc(name)}" data-scope="${scope}" aria-pressed="${!editing && inUse(name)}" ${editing ? `aria-label="Remove ${esc(name)}"` : ''}>${esc(name)}${p && p.games && !editing ? `<span class="r">${r2(p.rating)}</span>` : ''}</button>`;
  }).join('');
}

/* ---------- account sync (Claude artifact only; private to each signed-in viewer) ---------- */
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    profileDoc = db.doc('data/users/' + uid + '/profile');
    gamesCol = profileDoc.collection('games');
    let rosterSynced = false;
    profileDoc.onSnapshot(snap => {
      const remote = snap.exists && Array.isArray((snap.data() || {}).roster) ? snap.data().roster : [];
      const before = roster.length;
      for (const n of remote) if (typeof n === 'string' && !roster.some(r => sameName(r, n))) roster.push(n);
      store.set('pb.roster', roster);
      if (!snap.metadata.fromCache && !rosterSynced) { rosterSynced = true; if (roster.length !== remote.length) persistRoster(); }
      if (roster.length !== before && !(live && live.open) && !logForm) render();
    }, () => {});
    let first = true;
    const timer = setTimeout(() => { syncNote = 'Sync unavailable'; render(); }, 10000);
    gamesCol.orderBy('endedAt', 'desc').limit(500).onSnapshot(snap => {
      cloudGames = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      if (!snap.metadata.fromCache) {
        clearTimeout(timer); syncOn = true; syncNote = 'Synced';
        if (first) { first = false; uploadLocalOnly(); }
      }
      if (!logForm) render();
    }, () => { clearTimeout(timer); gamesCol = null; syncOn = false; syncNote = 'On this device'; render(); });
  } catch {}
})();
async function uploadLocalOnly() {
  const have = new Set((cloudGames || []).map(g => g.id));
  for (const g of localGames) {
    if (have.has(g.id)) continue;
    try { const { id, ...rest } = g; await gamesCol.doc(id).set(rest); } catch { break; }
  }
}
async function saveGame(rec) {
  localGames = [rec, ...localGames.filter(g => g.id !== rec.id)].slice(0, 1000);
  store.set('pb.games', localGames);
  addToRoster([...rec.teams[0], ...rec.teams[1]]);
  if (gamesCol) { try { const { id, ...rest } = rec; await gamesCol.doc(id).set(rest); } catch {} }
}
async function deleteGame(id) {
  localGames = localGames.filter(g => g.id !== id);
  store.set('pb.games', localGames);
  if (cloudGames) cloudGames = cloudGames.filter(g => g.id !== id);
  render();
  if (gamesCol) { try { await gamesCol.doc(id).delete(); } catch {} }
}
const newId = t => 'g' + t.toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- views ---------- */
const MARK = `<svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="var(--ink)"/><circle cx="17" cy="17" r="10.5" fill="var(--ball)"/><g fill="var(--ink)" opacity=".85"><circle cx="13.2" cy="13.2" r="1.3"/><circle cx="19.2" cy="12.1" r="1.3"/><circle cx="16.6" cy="17" r="1.3"/><circle cx="12.5" cy="19.6" r="1.3"/><circle cx="21.1" cy="18" r="1.3"/><circle cx="17.4" cy="22.3" r="1.3"/></g></svg>`;

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  const head = `<header class="top"><div class="wordmark">${MARK}<h1>Dink Score</h1></div><span class="sync ${syncOn ? 'on' : ''}">${esc(syncNote)}</span></header>`;
  $('#app').innerHTML = head + (tab === 'play' ? playView() : tab === 'leaders' ? leadersView() : tab === 'history' ? historyView() : rulesView());
  renderCourt();
  renderLog();
  renderTour();
}

function seg(attr, options, value, cls = '') {
  return `<div class="seg ${cls}" role="group">${options.map(([v, l]) =>
    `<button type="button" ${attr}="${v}" aria-pressed="${String(v) === String(value)}">${l}</button>`).join('')}</div>`;
}

function homeTiles(games) {
  const tiles = [];
  if (live && live.state.winner === null) {
    const s = live.state;
    tiles.push(`<div class="tile live wide"><span class="t-k">Paused game</span><span class="t-big">${s.score[0]}–${s.score[1]}</span>
      <span class="t-name">${esc(teamLabel(s.cfg.teams[0]))} vs ${esc(teamLabel(s.cfg.teams[1]))}</span><button class="go" data-act="resume">Resume</button></div>`);
  }
  tiles.push(`<button class="tile log" data-act="log-open"><span class="plus">+</span><span class="t-name">Log a result</span><span class="t-k">For games on other courts</span></button>`);
  const top = leaderStats(games, setup.mode)[0];
  tiles.push(`<button class="tile" data-tab-go="leaders"><span class="t-k">Top ${setup.mode === 'singles' ? 'singles' : 'doubles'} player</span>
    ${top ? `<span class="t-name">${esc(top.name)}</span><span class="t-big">${r2(top.rating)}</span>` : `<span class="t-name">No ratings yet</span><span class="t-foot">Save a game with named players</span>`}</button>`);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Array.from({ length: 7 }, (_, i) => new Date(today.getTime() - (6 - i) * DAY));
  const counts = days.map(d => games.filter(g => g.endedAt >= d.getTime() && g.endedAt < d.getTime() + DAY).length);
  const max = Math.max(1, ...counts);
  const total = counts.reduce((a, b) => a + b, 0);
  tiles.push(`<div class="tile wide" style="min-height:0"><div class="sec-head"><span class="t-k">This week</span><span class="t-k">${total} game${total === 1 ? '' : 's'}</span></div>
    <div class="week">${days.map((d, i) => `<div><i class="${counts[i] ? 'has' : ''} ${i === 6 ? 'today' : ''}" style="height:${counts[i] ? Math.max(14, 100 * counts[i] / max) : 8}%" title="${counts[i]} games"></i><span>${d.toLocaleDateString(undefined, { weekday: 'narrow' })}</span></div>`).join('')}</div></div>`);
  return `<section class="tiles">${tiles.join('')}</section>`;
}

function forecastHTML() {
  const { tables } = DR.compute(allGames());
  const teams = [teamPlayers(0), teamPlayers(1)];
  const known = teams.flat().filter(n => !isDefaultName(n) && (DR.lookup(tables, setup.mode, n) || {}).games);
  if (!known.length) return `<div class="forecast"><span class="fc-k">Forecast</span><span class="fc-who">No ratings yet</span><p class="fc-note">Every saved game builds each player's Dink Rating. New players start at ${r2(DR.START)}.</p></div>`;
  const f = DR.forecast(tables, setup.mode, teams, +setup.target);
  const close = Math.abs(f.pA - 0.5) < 0.02;
  return `<div class="forecast"><span class="fc-k">Forecast</span>
    <span class="fc-who">${close ? 'Too close to call' : `${esc(teamLabel(teams[f.fav]))} favored`}</span>
    <span class="fc-score">${f.score[0]}–${f.score[1]}</span>
    <p class="fc-note">Team ratings ${r2(f.ratings[0])} and ${r2(f.ratings[1])}. Beat the forecast and your rating rises, even in a loss.</p></div>`;
}

function teamCard(t) {
  const n = setup.mode === 'doubles' ? 2 : 1;
  const inputs = Array.from({ length: n }, (_, i) =>
    `<input id="name-${t}-${i}" data-name="${t}-${i}" list="roster-list" placeholder="Player ${t * 2 + i + 1}" value="${esc(setup.names[t][i])}" autocomplete="off" aria-label="${TEAM_NAME[t]} team, player ${i + 1}">`).join('');
  return `<div class="team" style="--c:${TEAM_COLOR[t]}"><div class="thead"><span class="tname">${TEAM_NAME[t]} team</span>
    <button type="button" class="serve-pick" data-first="${t}" aria-pressed="${setup.first === t}"><span class="ball"></span>${setup.first === t ? 'Serves first' : 'Serve first'}</button></div>${inputs}</div>`;
}

function playView() {
  const games = allGames();
  return `${homeTiles(games)}
  <section class="card" aria-labelledby="new-h">
    <h2 id="new-h">New game</h2>
    <div class="field" style="margin-top:14px"><span class="lab">Format</span>${seg('data-set-mode', [['doubles', 'Doubles'], ['singles', 'Singles']], setup.mode)}</div>
    <div class="field"><span class="lab">Scoring</span>${seg('data-set-scoring', [['sideout', 'Side-out'], ['rally', 'Rally']], setup.scoring)}
      <p class="note">${setup.scoring === 'sideout' ? 'Classic rules. Only the serving side scores.' : 'A point on every rally, whoever served.'}</p></div>
    <div class="seg-row"><div class="field" style="margin:0"><span class="lab">Play to</span>${seg('data-set-target', [[11, '11'], [15, '15'], [21, '21']], setup.target)}</div>
      <div class="field" style="margin:0"><span class="lab">Win by</span>${seg('data-set-winBy', [[2, '2'], [1, '1']], setup.winBy)}</div></div>
    <div class="teams">${teamCard(0)}<button type="button" class="swap" data-act="swap" aria-label="Swap teams">⇅</button>${teamCard(1)}</div>
    <div class="roster"><div class="rhead"><span class="lab">${roster.length ? (rosterEdit ? 'Tap a name to remove it' : 'Saved players') : 'Saved players'}</span>
      ${roster.length ? `<button type="button" class="link" data-act="roster-edit">${rosterEdit ? 'Done' : 'Edit'}</button>` : ''}</div>
      ${roster.length ? `<div class="chips">${chipsHTML(setup.names, setup.mode, 'setup')}</div>` : `<p class="note">Names you play with are saved here automatically.</p>`}
      <form class="add-player" data-form="add-player"><input id="new-player" placeholder="Add a player" autocomplete="off" aria-label="New player name" maxlength="40"><button type="submit" class="btn btn-soft" style="padding:10px 16px;border-radius:12px">Save</button></form></div>
    <div id="forecast">${forecastHTML()}</div>
    <datalist id="roster-list">${roster.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist>
    <button class="btn btn-ink block start" data-act="start"><span class="ball"></span>Start game</button>
  </section>
  ${games.length ? `<section><div class="sec-head"><h2>Recent</h2><button class="link" data-tab-go="history">See all</button></div><ul class="games" style="margin-top:10px">${games.slice(0, 3).map(gameItem).join('')}</ul></section>` : ''}`;
}

function gameItem(g) {
  const d = new Date(g.endedAt);
  const date = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const line = t => `<div class="line ${g.winner === t ? 'win' : ''}" style="--c:${TEAM_COLOR[t]}"><span class="tick"></span><span class="who">${esc(teamLabel(g.teams[t]))}</span><span class="pts">${g.score[t]}</span></div>`;
  const armed = armedDelete === g.id;
  return `<li class="game"><div class="lines">${line(0)}${line(1)}</div>
    <button class="link ${armed ? 'armed' : ''}" data-del="${esc(g.id)}" style="align-self:start;font-size:13px">${armed ? 'Confirm' : 'Delete'}</button>
    <div class="meta"><span>${esc(date)}</span><span class="tag">${g.mode === 'doubles' ? 'Doubles' : 'Singles'}</span>${g.logged ? '<span class="tag logged">Logged</span>' : `<span class="tag">${g.scoring === 'rally' ? 'Rally' : 'Side-out'} to ${g.target}</span><span class="tag">${minutes(g)} min</span>`}</div></li>`;
}

function historyView() {
  const games = allGames();
  const head = `<section><div class="sec-head"><h2>Record</h2><button class="btn btn-blue" data-act="log-open" style="padding:10px 16px;border-radius:12px;font-size:15px">+ Log a result</button></div></section>`;
  if (!games.length) return head + `<div class="empty"><p>Finished games land here. Score one live, or log a result from another court.</p><button class="btn btn-ink" data-tab-go="play">Start a game</button></div>`;
  const totalRallies = games.reduce((s, g) => s + (g.rallies || 0), 0);
  const timed = games.filter(g => !g.logged);
  const totalMin = timed.reduce((s, g) => s + minutes(g), 0);
  return head + `<section class="totals"><div><b>${games.length}</b><span>Games</span></div><div><b>${totalRallies}</b><span>Rallies scored</span></div><div><b>${totalMin}</b><span>Minutes</span></div></section>
    <section><ul class="games">${games.map(gameItem).join('')}</ul></section>`;
}

function leaderStats(games, mode) {
  const { tables } = DR.compute(games);
  const now = Date.now();
  const extra = new Map();
  for (const g of [...games].sort((a, b) => a.endedAt - b.endedAt)) {
    if ((g.mode === 'singles' ? 'singles' : 'doubles') !== mode) continue;
    for (const t of [0, 1]) for (const n of g.teams[t]) {
      const k = n.trim().toLowerCase();
      const e = extra.get(k) || { streak: 0, best: 0, diff: 0 };
      e.streak = g.winner === t ? e.streak + 1 : 0; e.best = Math.max(e.best, e.streak);
      e.diff += g.score[t] - g.score[1 - t];
      extra.set(k, e);
    }
  }
  return [...tables[mode].values()].filter(p => !isDefaultName(p.name)).map(p => {
    const e = extra.get(p.name.toLowerCase()) || { streak: 0, best: 0, diff: 0 };
    return Object.assign({}, p, e, { rel: Math.round(DR.reliability(p, now) * 100) });
  }).sort((a, b) => b.rating - a.rating);
}
function leadersView() {
  const rows = leaderStats(allGames(), ratingMode);
  const head = `<section><div class="sec-head"><h2>Leaderboard</h2>${seg('data-rmode', [['doubles', 'Doubles'], ['singles', 'Singles']], ratingMode, 'sm')}</div><p class="sub">Ranked by Dink Rating from every saved ${ratingMode} game.</p></section>`;
  if (!rows.length) return head + `<div class="empty"><p>No rated ${ratingMode} players yet. Name the players before a game, or log a result, to put them on the board.</p><button class="btn btn-ink" data-tab-go="play">Start a game</button></div>`;
  const podium = rows.slice(0, 3);
  const order = podium.length === 3 ? [1, 0, 2] : podium.map((_, i) => i);
  const avatarColor = ['var(--ink)', 'var(--blue)', 'var(--green)'];
  const podiumHTML = `<section class="podium" style="--n:${podium.length}">${order.map(i => { const p = podium[i]; return `<div class="step s${i + 1}" style="--c:${avatarColor[i]}">
      <span class="avatar">${esc(initials(p.name))}</span><span class="pl-name">${esc(p.name)}</span><span class="pl-rating">${r2(p.rating)}</span>${deltaHTML(p.delta)}
      <div class="block">${i + 1}</div></div>`; }).join('')}</section>`;
  const list = `<section class="rows">${rows.map((p, i) => `<div class="prow"><span class="rank">${i + 1}</span>
      <div class="pinfo"><span class="pname">${esc(p.name)}${p.rel < 60 ? '<span class="badge prov">Provisional</span>' : ''}${p.streak >= 3 ? `<span class="badge hot">${p.streak} straight wins</span>` : ''}</span>
        <span class="pstats"><span>${p.wins}–${p.games - p.wins}</span><span>${p.diff > 0 ? '+' : ''}${p.diff} pts</span><span class="rel" title="Reliability"><i><b style="width:${p.rel}%"></b></i>${p.rel}%</span></span></div>
      <div class="pr"><span class="rating">${r2(p.rating)}</span>${deltaHTML(p.delta)}</div></div>`).join('')}</section>`;
  const by = (f, label, fmt) => { const top = [...rows].sort((a, b) => f(b) - f(a))[0]; return top && f(top) > 0 ? `<div><span class="aw-k">${label}</span><span class="aw-name">${esc(top.name)}</span><span class="aw-v">${fmt(top)}</span></div>` : ''; };
  const awards = [by(p => p.wins, 'Most wins', p => p.wins), by(p => p.best, 'Longest win streak', p => p.best), by(p => p.diff, 'Best point difference', p => '+' + p.diff), by(p => p.games, 'Most games', p => p.games)].join('');
  return head + podiumHTML + list + (awards ? `<section><h2>Club honors</h2><div class="awards" style="margin-top:10px">${awards}</div></section>` : '');
}

function rulesView() {
  return `<section><h2>Rules</h2><p class="sub">The essentials, for settling it at the kitchen line.</p></section>
  <div class="rule"><h3>New to Dink Score?</h3><p>Take the quick tour of how to set up games, keep score, log results and read the leaderboard.</p><button class="btn btn-ink replay" data-tour="open" style="padding:11px 16px;border-radius:12px;font-size:15px">Show the tour</button></div>
  <div class="rules">
    <div class="rule"><h3>Calling the score</h3><p>In doubles, say three numbers before each serve.</p>
      <div class="call-demo"><div><strong>4</strong><small>Serving team</small></div><div><strong>2</strong><small>Receiving team</small></div><div><strong>1</strong><small>Server</small></div></div>
      <p>Games open at <b>0–0–2</b>, so the first team to serve gets only one server.</p></div>
    <div class="rule"><h3>Side-out scoring</h3><ul><li>Only the serving team scores.</li><li>Win the rally and the server swaps sides with their partner, then serves again.</li><li>Server 1 loses a rally and server 2 takes over. Server 2 loses and it's a side out.</li><li>After a side out, whoever stands on the right serves first.</li></ul></div>
    <div class="rule"><h3>Where to serve from</h3><p>Even score, serve from the right. Odd score, from the left. That holds for whoever started the game on the right. Dink Score shows the side on the scoring screen.</p></div>
    <div class="rule"><h3>The serve</h3><ul><li>Underhand, with contact below the waist and one foot behind the baseline.</li><li>Serve diagonally, deep of the kitchen. Landing on the kitchen line is a fault.</li></ul></div>
    <div class="rule"><h3>Two-bounce rule</h3><p>The return of serve must bounce, and so must the third shot. After that, volleys are open.</p></div>
    <div class="rule"><h3>The kitchen</h3><p>The non-volley zone runs 7 feet from the net on each side. No volleys while you're in it or touching its line, including momentum carrying you in after the shot. Step in any time to play a ball that has bounced.</p></div>

function ratingPreview(s) {
  const rec = Object.assign(record(s), { id: '__pending' });
  const { changes } = DR.compute([...allGames(), rec]);
  const c = changes.__pending;
  if (!c) return '';

  if (!named.length) return `<p class="expect">Add player names next time to track Dink Ratings.</p>`;
  const fav = c.expected >= 0.5 ? 0 : 1;
  const pf = fav === 0 ? c.expected : 1 - c.expected;
  const target = s.cfg.target;
  const exp = Math.min(target - 1, Math.round(target * (1 - pf) / pf));
  const expText = Math.abs(c.expected - 0.5) < 0.02 ? 'The forecast called it even.' : `The forecast had ${esc(teamLabel(s.cfg.teams[fav]))} winning ${target}–${exp}.`;
  return `<div style="display:flex;flex-direction:column;gap:8px"><p class="expect">${expText} Rating changes once saved:</p>

}

  } else if (d.logScore !== undefined && logForm) {
    logForm.score[+d.logScore] = e.target.value;
  } else if (e.target.hasAttribute && e.target.hasAttribute('data-log-when') && logForm) {
    logForm.when = e.target.value;
  }
});
document.addEventListener('submit', e => {
  const form = e.target;
  if (form.matches('[data-form="log"]')) { e.preventDefault(); submitLog(); return; }
  if (!form.matches('[data-form="add-player"]')) return;
  e.preventDefault();
  const name = $('#new-player').value.trim();
  if (!name) return;
  addToRoster([name]); render();
  const again = $('#new-player'); if (again) again.focus();
});
document.addEventListener('keydown', e => {
  if (tourStep !== null) {
    if (e.key === 'Escape') closeTour();
    else if (e.key === 'ArrowRight' && tourStep < tourSteps().length - 1) { tourStep++; renderTour(); }
    else if (e.key === 'ArrowLeft' && tourStep > 0) { tourStep--; renderTour(); }
    return;
  }
  if (e.key === 'Escape' && logForm) { logForm = null; render(); return; }
  if (!live || !live.open || live.state.winner !== null || live.confirmEnd || logForm) return;
  if (e.target.matches && e.target.matches('input')) return;
  if (e.key === '1' || e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); document.querySelector('[data-rally="0"]').click(); }
  if (e.key === '2' || e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); document.querySelector('[data-rally="1"]').click(); }
  if ((e.key === 'z' && (e.ctrlKey || e.metaKey)) || e.key === 'Backspace') { e.preventDefault(); document.querySelector('[data-act="undo"]').click(); }
});

if (live && live.state.winner === null && live.open) keepAwake(true);
render();
</script>
